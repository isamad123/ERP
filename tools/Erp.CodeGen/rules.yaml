      - text: "unique applies only to text, number, decimal, date, choice, user and employee fields"
        check: { name: ck_custom_field_defs_unique_types, sql: "not is_unique or data_type in ('text', 'number', 'decimal', 'date', 'choice', 'user', 'employee')" }


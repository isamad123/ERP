        text: "the list, e.g. org.branches; at most 100 characters"
        check: { name: ck_saved_views_list_key, sql: "list_key ~ '^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$' and length(list_key) <= 100" }
      - column: name

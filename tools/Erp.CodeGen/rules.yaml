# Reviewed translations of the free text in docs/data-design/*.yaml (slice S1.02).
#
# The data design is approved (D-50) and read-only. Where a table entry states a rule in words (table `checks`,
# table `notes`, partial-unique phrases, a few column notes), this file says how the generator turns it into
# database objects. Every entry quotes the design text exactly; if the design text changes, the generator stops
# with "untranslated text" so the new wording is reviewed here before any code changes (D-39).
#
# Entry kinds:
#   check:      SQL check constraint that states the rule literally.
#   exclusion:  SQL exclusion constraint that states the rule literally.
#   eff_where:  WHERE clause added to the table's effective-dating exclusion constraint.
#   composite_fk: foreign key over several columns, replacing the single-column one on the same column.
#   append_only_updatable: columns the append-only trigger still lets the owning service update.
#   stub:       a rule that needs a trigger or application logic owned by a later slice. The generator creates a
#               named placeholder function `<schema>.todo_<name>()` that raises "not implemented" if called, and lists
#               it in docs/registers/todo-stubs.md. Tests keep the register, the database and the owning slice in step.
#   comment:    descriptive text about behaviour (no rule for the database); kept as a table comment only.

tables:
  hrm.pay_periods:
    checks:
      - text: "exclusion: (pay_group_id with =, daterange(start_date, end_date, '[]') with &&)"
        exclusion: { name: ex_pay_periods_pay_group_id_dates, elements: ["pay_group_id with =", "daterange(start_date, end_date, '[]') with &&"] }
      - text: "start_date <= cut_off_date and start_date <= end_date"
        check: { name: ck_pay_periods_dates, sql: "start_date <= cut_off_date and start_date <= end_date" }
    notes:
      - text: "Trigger refuses new pay_inputs, retro_adjustments or installments targeting a closed period."
        stub: { name: pay_periods_closed_period_guard, owner: S1.38 }

  hrm.statutory_tables:
    notes:
      - text: "Pack updates create new versions with a future valid_from."
        comment: true

  hrm.statutory_table_rows:
    checks:
      - text: "lower_bound < upper_bound when both present"
        check: { name: ck_statutory_table_rows_bounds, sql: "lower_bound is null or upper_bound is null or lower_bound < upper_bound" }
      - text: "exclusion: (table_id with =, coalesce(key,'') with =, numrange(lower_bound, upper_bound) with &&)"
        exclusion: { name: ex_statutory_table_rows_table_id_key_bounds, elements: ["table_id with =", "(coalesce(key, '')) with =", "numrange(lower_bound, upper_bound) with &&"] }
    notes:
      - text: "Immutable by trigger once the parent version is effective or referenced by any run; change by a new table version."
        stub: { name: statutory_table_rows_lock, owner: S1.36 }

  hrm.pay_runs:
    notes:
      - text: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33); status column may still advance (paid, posted, closed) through the run service only."
        stub: { name: pay_runs_lock, owner: S1.38 }

  hrm.pay_run_employees:
    checks:
      - text: "exclusion: (employment_id with =, daterange(period_start, period_end, '[]') with &&) where run_kind in ('regular','final_settlement') and run_status <> 'cancelled'"
        exclusion: { name: ex_pay_run_employees_employment_id_period, elements: ["employment_id with =", "daterange(period_start, period_end, '[]') with &&"], where: "run_kind in ('regular','final_settlement') and run_status <> 'cancelled'" }
    notes:
      - text: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
        stub: { name: pay_run_employees_lock, owner: S1.38 }

  hrm.pay_results:
    notes:
      - text: "Trigger refuses update and delete when the run status is locked or later. Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
        stub: { name: pay_results_lock, owner: S1.38 }

  hrm.pay_result_lines:
    partition: none   # design: "partitioned yearly once volume requires"; not partitioned in Release 1.0
    notes:
      - text: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
        stub: { name: pay_result_lines_lock, owner: S1.38 }

  hrm.pay_traces:
    notes:
      - text: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
        stub: { name: pay_traces_lock, owner: S1.38 }

  hrm.pay_result_reversals:
    checks:
      - text: "allowed only while no non-failed payment line exists for the result"
        stub: { name: pay_result_reversals_before_payment, owner: S1.39 }

  hrm.retro_adjustments:
    notes:
      - text: "applied_in_run_id may be set once (trigger); status pending -> applied is one-way."
        stub: { name: retro_adjustments_apply_once, owner: S1.39 }

  hrm.salary_holds:
    notes:
      - text: "A release pays the original result of the held run through a payment batch; the salary is never recalculated. Each result is paid once (hrm.payment_lines unique key)."
        comment: true

  hrm.payment_lines:
    unique_where:
      "where status not in ('failed','reissued') and batch not cancelled (maintained via denormalized batch_status)": "status not in ('failed','reissued') and batch_status <> 'cancelled'"
    checks:
      - text: "deferred: sum of active lines per result equals pay_results.net"
        stub: { name: payment_lines_sum_equals_net, owner: S1.40 }

  hrm.final_settlements:
    checks:
      - text: "status may become approved only when clearance_status in (cleared, waived) (FR-XM-29)"
        stub: { name: final_settlements_approval_needs_clearance, owner: S1.43 }
      - text: "pay_run_id required before status = paid"
        check: { name: ck_final_settlements_paid_needs_run, sql: "status <> 'paid' or pay_run_id is not null" }
    notes:
      - text: "Header and lines locked by trigger from approved onward; correction by cancel and reissue (FR-XM-05)."
        stub: { name: final_settlements_lock, owner: S1.43 }

  hrm.loan_installments:
    notes:
      - text: "Frozen by trigger once status = deducted."
        stub: { name: loan_installments_freeze, owner: S1.41 }

  hrm.loan_transactions:
    checks:
      - text: "trigger: a recovery cannot exceed the outstanding balance"
        stub: { name: loan_transactions_recovery_within_balance, owner: S1.41 }
    notes:
      - text: "Recovery entries are written only when the pay run locks."
        comment: true

  hrm.salary_bands:
    checks:
      - text: "minimum <= midpoint and midpoint <= maximum"
        check: { name: ck_salary_bands_order, sql: "minimum <= midpoint and midpoint <= maximum" }

  hrm.provident_fund_accounts:
    notes:
      - text: "On intra-group transfer the old account closes with a transfer entry and the new account opens with the balance (employment_events.carry_over)."
        stub: { name: provident_fund_accounts_transfer, owner: S1.44 }

  hrm.person_identifiers:
    notes:
      - text: "One row per identifier; renewal updates issue and expiry dates (history in the audit log)."
        comment: true

  hrm.nominations:
    checks:
      - text: "deferred: shares per (person_id, scheme) on any date sum to 1"
        stub: { name: nominations_shares_sum_to_one, owner: S1.20 }

  hrm.employment_assignments:
    notes:
      - text: "Cycle check trigger on manager_employment_id."
        stub: { name: employment_assignments_manager_cycle, owner: S1.20 }
        # S1.20b (CR-076 S1.20b detail): nobody reports to themself, directly or through others, on any date. The fast path
        # looks at every manager the new manager has ever had; only when the employment is among them is the chain followed
        # on each date of the row's period where a row of that chain starts (a cycle exists on such a date if on any date).
        # An AFTER trigger, so the row being written is part of the chain it closes.
        implemented:
          slice: S1.20b
          triggers:
            - [hrm.employment_assignments, tg_employment_assignments_manager_cycle]
          sql: |
            create or replace function hrm.tg_employment_assignments_manager_cycle() returns trigger
            language plpgsql as $fn$
            declare
                d date;
            begin
                if new.manager_employment_id is null then
                    return null;
                end if;
                if new.manager_employment_id = new.employment_id then
                    raise exception 'employment % cannot be its own manager', new.employment_id
                        using errcode = '23514', constraint = 'ck_employment_assignments_manager_cycle';
                end if;
                if not exists (
                    with recursive up(id) as (
                        select new.manager_employment_id
                        union
                        select a.manager_employment_id from hrm.employment_assignments a join up on a.employment_id = up.id
                        where a.manager_employment_id is not null)
                    select 1 from up where up.id = new.employment_id) then
                    return null;
                end if;
                for d in
                    with recursive up(id) as (
                        select new.manager_employment_id
                        union
                        select a.manager_employment_id from hrm.employment_assignments a join up on a.employment_id = up.id
                        where a.manager_employment_id is not null)
                    select new.valid_from
                    union
                    select a.valid_from from hrm.employment_assignments a
                    where a.employment_id in (select id from up) and a.valid_from > new.valid_from
                      and (new.valid_to is null or a.valid_from < new.valid_to)
                loop
                    if exists (
                        with recursive chain(id) as (
                            select new.manager_employment_id
                            union
                            select a.manager_employment_id from chain c join hrm.employment_assignments a on a.employment_id = c.id
                            where a.manager_employment_id is not null and a.valid_from <= d and (a.valid_to is null or a.valid_to > d))
                        select 1 from chain where chain.id = new.employment_id) then
                        raise exception 'manager % of employment % on % closes a reporting cycle', new.manager_employment_id, new.employment_id, d
                            using errcode = '23514', constraint = 'ck_employment_assignments_manager_cycle';
                    end if;
                end loop;
                return null;
            end
            $fn$;
            create or replace trigger tg_employment_assignments_manager_cycle after insert or update of manager_employment_id, employment_id, valid_from, valid_to
                on hrm.employment_assignments for each row execute function hrm.tg_employment_assignments_manager_cycle();
    column_stubs:
      - column: cost_allocation
        text: "list of {cost_center_ref or department, pct}; must sum to 1"
        stub: { name: employment_assignments_cost_allocation_sum, owner: S1.20 }
        # S1.20b (CR-076 S1.20b detail): a non-empty list of shares, each naming exactly one of a cost centre reference or a
        # department (an org unit of the assignment's company, like a foreign key) with a share above 0 and at most 1; the
        # shares sum to exactly 1 (numeric, no rounding).
        implemented:
          slice: S1.20b
          triggers:
            - [hrm.employment_assignments, tg_employment_assignments_cost_allocation_sum]
          sql: |
            create or replace function hrm.tg_employment_assignments_cost_allocation_sum() returns trigger
            language plpgsql as $fn$
            declare
                item jsonb;
                share numeric;
                total numeric := 0;
            begin
                if jsonb_typeof(new.cost_allocation) is distinct from 'array' or jsonb_array_length(new.cost_allocation) = 0 then
                    raise exception 'cost allocation of assignment % must be a non-empty list', new.id
                        using errcode = '23514', constraint = 'ck_employment_assignments_cost_allocation_sum';
                end if;
                for item in select value from jsonb_array_elements(new.cost_allocation) loop
                    if jsonb_typeof(item) is distinct from 'object' or jsonb_typeof(item -> 'pct') is distinct from 'number'
                       or (item ? 'cost_center_ref') = (item ? 'department') then
                        raise exception 'cost allocation of assignment % has a share without exactly one target and a number', new.id
                            using errcode = '23514', constraint = 'ck_employment_assignments_cost_allocation_sum';
                    end if;
                    if item ? 'department' and (jsonb_typeof(item -> 'department') is distinct from 'string'
                       or (item ->> 'department') !~ '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                       or not exists (select 1 from org.org_units u where u.id = (item ->> 'department')::uuid and u.company_id = new.company_id)) then
                        raise exception 'cost allocation of assignment % names a department that is not an org unit of its company', new.id
                            using errcode = '23514', constraint = 'ck_employment_assignments_cost_allocation_department';
                    end if;
                    share := (item ->> 'pct')::numeric;
                    if share <= 0 or share > 1 then
                        raise exception 'cost allocation of assignment % has a share of %', new.id, share
                            using errcode = '23514', constraint = 'ck_employment_assignments_cost_allocation_sum';
                    end if;
                    total := total + share;
                end loop;
                if total <> 1 then
                    raise exception 'cost allocation of assignment % sums to % instead of 1', new.id, total
                        using errcode = '23514', constraint = 'ck_employment_assignments_cost_allocation_sum';
                end if;
                return new;
            end
            $fn$;
            create or replace trigger tg_employment_assignments_cost_allocation_sum before insert or update of cost_allocation
                on hrm.employment_assignments for each row execute function hrm.tg_employment_assignments_cost_allocation_sum();

  hrm.employee_bank_accounts:
    checks:
      - text: "bank fields required when payment_mode = bank_transfer or mobile_wallet"
        stub: { name: employee_bank_accounts_bank_fields_required, owner: S1.20 }
        # S1.20d (CR-076 S1.20d detail): a bank transfer or mobile wallet names the bank (or wallet provider) of ref.banks, the
        # account title and an account number or IBAN; cash and cheque carry no bank, account number or IBAN (a cheque may name
        # its payee in the title). A trigger, not a check constraint, because the first migration is frozen and the generated
        # catalogue knows rules implemented after it by their triggers.
        implemented:
          slice: S1.20d
          triggers:
            - [hrm.employee_bank_accounts, tg_employee_bank_accounts_bank_fields_required]
          sql: |
            create or replace function hrm.tg_employee_bank_accounts_bank_fields_required() returns trigger
            language plpgsql as $fn$
            begin
                if new.payment_mode in ('bank_transfer', 'mobile_wallet') then
                    if new.bank_id is null or new.account_title is null or (new.account_number is null and new.iban is null) then
                        raise exception 'bank account % paid by % needs the bank, the account title and an account number or IBAN', new.id, new.payment_mode
                            using errcode = '23514', constraint = 'ck_employee_bank_accounts_bank_fields_required';
                    end if;
                elsif new.bank_id is not null or new.account_number is not null or new.iban is not null then
                    raise exception 'bank account % paid by % carries no bank, account number or IBAN', new.id, new.payment_mode
                        using errcode = '23514', constraint = 'ck_employee_bank_accounts_bank_fields_required';
                end if;
                return new;
            end
            $fn$;
            create or replace trigger tg_employee_bank_accounts_bank_fields_required before insert or update
                on hrm.employee_bank_accounts for each row execute function hrm.tg_employee_bank_accounts_bank_fields_required();
      # S1.20d (CR-076 S1.20d detail; FR-HRM-EMP-06, FR-HRM-PAY-24): the split value of each kind.
      - text: "the remainder account has no split value; a percent is above 0 and at most 100; an amount is above 0"
        check: { name: ck_employee_bank_accounts_split_value, sql: "(split_kind = 'remainder' and split_value is null) or (split_kind = 'percent' and split_value > 0 and split_value <= 100) or (split_kind = 'amount' and split_value > 0)" }
      - text: "priority is between 1 and 99"
        check: { name: ck_employee_bank_accounts_priority, sql: "priority between 1 and 99" }
      - text: "an account number or IBAN is stored exactly with its blind index"
        check: { name: ck_employee_bank_accounts_blind_index, sql: "(account_number is null) = (account_number_hmac is null) and (iban is null) = (iban_hmac is null)" }
    notes:
      - text: "Changes go through maker-checker (iam.maker_checker_requests)."
        comment: true

  hrm.employment_statutory_registrations:
    checks:
      # S1.20d (CR-076 S1.20d detail; slice S1.20 Build item 15): registrations only, no contribution rule (S1.37, AS-4).
      - text: "an exemption reason is given exactly when the scheme does not apply"
        check: { name: ck_employment_statutory_registrations_exemption, sql: "(not is_applicable) = (exemption_reason is not null)" }
      - text: "a registration number is stored exactly with its blind index"
        check: { name: ck_employment_statutory_registrations_blind_index, sql: "(registration_no is null) = (registration_no_hmac is null)" }
      - text: "a scheme code is lower-case letters, digits and underscores and starts with a letter"
        check: { name: ck_employment_statutory_registrations_scheme_format, sql: "scheme ~ '^[a-z][a-z0-9_]*$'" }

  hrm.positions:
    notes:
      - text: "Cycle check trigger on reports_to_position_id."
        stub: { name: positions_reporting_cycle, owner: S1.22 }
        # S1.22a (CR-078 S1.22a detail b): a position never reports to itself, directly or through others. A position is its code:
        # a change from a date adds a row with a new id, so the chain follows codes and refuses a cycle on any date (stricter than
        # a cycle on one date, never looser). An AFTER trigger, so the row being written is part of the chain it closes.
        implemented:
          slice: S1.22a
          triggers:
            - [hrm.positions, tg_positions_reporting_cycle]
          sql: |
            create or replace function hrm.tg_positions_reporting_cycle() returns trigger
            language plpgsql as $fn$
            begin
                if new.reports_to_position_id is null then
                    return null;
                end if;
                if exists (
                    with recursive up(code) as (
                        select p.position_code_lower from hrm.positions p
                        where p.company_id = new.company_id and p.id = new.reports_to_position_id
                        union
                        select r.position_code_lower
                        from up
                        join hrm.positions c on c.company_id = new.company_id and c.position_code_lower = up.code
                        join hrm.positions r on r.company_id = new.company_id and r.id = c.reports_to_position_id)
                    select 1 from up where up.code = lower(new.position_code)) then
                    raise exception 'position % reports to itself, directly or through others', new.position_code
                        using errcode = '23514', constraint = 'ck_positions_reporting_cycle';
                end if;
                return null;
            end
            $fn$;
            create or replace trigger tg_positions_reporting_cycle after insert or update of reports_to_position_id, position_code, valid_from, valid_to
                on hrm.positions for each row execute function hrm.tg_positions_reporting_cycle();

  hrm.policies:
    checks:
      # S1.23a (CR-079 S1.23a detail; slice S1.23 Build item 1): the code of a registered policy type (policy-types.json).
      - text: "a policy type is lower-case letters, digits and underscores and starts with a letter"
        check: { name: ck_policies_policy_type_format, sql: "policy_type ~ '^[a-z][a-z0-9_]*$'" }

  hrm.policy_versions:
    checks:
      # S1.23a (CR-079 S1.23a detail; slice S1.23 Build item 2): parameters are checked against the type's JSON Schema by the service.
      - text: "parameters are a JSON object"
        check: { name: ck_policy_versions_parameters_object, sql: "jsonb_typeof(parameters) = 'object'" }
      - text: "version numbers start at 1"
        check: { name: ck_policy_versions_version, sql: "version >= 1" }
    notes:
      - text: "Exclusion on policy_id applies where status <> 'draft'; dates assigned on activation."
        eff_where: "status <> 'draft'"

  hrm.policy_assignments:
    checks:
      # S1.23a (CR-079 S1.23a detail; slice S1.23 Build item 3, ruling Q4): conditions joined by "and"; the service checks the shape.
      - text: "a rule is a JSON object"
        check: { name: ck_policy_assignments_rule_object, sql: "jsonb_typeof(rule) = 'object'" }
      - text: "precedence is between 1 and 9999"
        check: { name: ck_policy_assignments_precedence, sql: "precedence between 1 and 9999" }

  hrm.shifts:
    checks:
      # S1.28a (CR-085 S1.28a detail; slice S1.28 Build item 1): versions of a shift do not run backwards.
      - text: "a version ends on or after the day it starts"
        check: { name: ck_shifts_version_dates, sql: "valid_from is null or valid_to is null or valid_to >= valid_from" }

  hrm.rosters:
    checks:
      # S1.28a (CR-085 S1.28a detail; slice S1.28 Build item 4).
      - text: "a roster ends on or after the day it starts"
        check: { name: ck_rosters_period, sql: "period_end >= period_start" }

  hrm.roster_lines:
    checks:
      # S1.28a (CR-085 S1.28a detail; slice S1.28 Build item 4): a working day names a shift; a weekly off or holiday names none.
      - text: "a working day has a shift and any other day has none"
        check: { name: ck_roster_lines_shift, sql: "(day_type = 'working') = (shift_id is not null)" }

  hrm.form_definitions:
    notes:
      - text: "active_version_id uses composite FK (id, active_version_id) -> hrm.form_versions (parent_id, id)."
        composite_fk: { column: active_version_id, columns: [id, active_version_id], target: hrm.form_versions, target_columns: [form_id, id] }

  hrm.goals:
    notes:
      - text: "Cycle check trigger on parent_goal_id."
        stub: { name: goals_parent_cycle, owner: S1.49 }

  hrm.training_bonds:
    notes:
      - text: "Active bonds appear in final settlement as bond_recovery (LND-06)."
        stub: { name: training_bonds_final_settlement_recovery, owner: S1.43 }

  hrm.device_user_maps:
    notes:
      - text: "Punches resolve the employee by mapping valid on the punch date."
        comment: true

  hrm.pay_component_versions:
    column_stubs:
      - column: base_component_ids
        text: "cycle check on save"
        stub: { name: pay_component_versions_base_cycle, owner: S1.34 }
        # S1.34b (CR-087 S1.34b detail; FR-HRM-PAY-03): the components a version is a percentage of (or a formula names) exist, belong to
        # the component's company, never include the component itself and never lead back to it: the walk follows the base lists of
        # every version in force on the new version's start date or starting later (a loop that begins later is a loop, review H3),
        # under a per-company lock. The component service checks the same first to give a clear message
        # (and also reads the names in a formula); the trigger stops any other path.
        implemented:
          slice: S1.34b
          triggers:
            - [hrm.pay_component_versions, tg_pay_component_versions_bases]
          sql: |
            create or replace function hrm.tg_pay_component_versions_bases() returns trigger
            language plpgsql as $fn$
            declare
                v_company uuid;
                v_bad uuid;
            begin
                if cardinality(new.base_component_ids) = 0 then
                    return new;
                end if;
                select company_id into v_company from hrm.pay_components where id = new.component_id;
                -- one writer of versions per company at a time, so two writes cannot each pass the loop check and make a loop together
                perform pg_advisory_xact_lock(hashtextextended(v_company::text, 0));
                if new.component_id = any (new.base_component_ids) then
                    raise exception 'pay component %: a component cannot be based on itself', new.component_id
                        using errcode = '23514', constraint = 'ck_pay_component_versions_bases';
                end if;
                select b into v_bad from unnest(new.base_component_ids) as b
                 where not exists (select 1 from hrm.pay_components c where c.id = b and c.company_id = v_company) limit 1;
                if v_bad is not null then
                    raise exception 'pay component %: base component % does not exist in the company', new.component_id, v_bad
                        using errcode = '23514', constraint = 'ck_pay_component_versions_bases';
                end if;
                if exists (
                    with recursive walk(id) as (
                        select unnest(new.base_component_ids)
                        union
                        select unnest(v.base_component_ids)
                          from walk w
                          join hrm.pay_component_versions v on v.component_id = w.id
                           and v.id <> new.id
                           and (v.valid_to is null or v.valid_to > new.valid_from)
                    )
                    select 1 from walk where id = new.component_id) then
                    raise exception 'pay component %: its base components lead back to it', new.component_id
                        using errcode = '23514', constraint = 'ck_pay_component_versions_bases';
                end if;
                return new;
            end
            $fn$;
            drop trigger if exists tg_pay_component_versions_bases on hrm.pay_component_versions;
            create trigger tg_pay_component_versions_bases before insert or update on hrm.pay_component_versions
                for each row execute function hrm.tg_pay_component_versions_bases();

  hrm.attendance_periods:
    checks:
      - text: "exclusion: (pay_group_id with =, daterange(period_start, period_end, '[]') with &&)"
        exclusion: { name: ex_attendance_periods_pay_group_id_period, elements: ["pay_group_id with =", "daterange(period_start, period_end, '[]') with &&"] }
    notes:
      - text: "A locked period never reopens (FR-XM-26). Unlocking is allowed only if the locking run is cancelled before it is locked itself. Lock trigger covers attendance_days, leave_request_days, overtime_entries and approved regularization_requests dated in the period; changes after lock become hrm.retro_adjustments."
        stub: { name: attendance_periods_lock, owner: S1.31 }


# Database functions written by a slice (S1.07). Reviewed SQL, emitted as V…03(30+n)__kernel__functions_<slice>.sql after
# the slice's design file. Never edit a merged entry: a later change is a new entry with a new name or slice.
functions:
  - slice: S1.07
    name: aud.change_canonical
    purpose: "The fixed text a change-log row is hashed over (KRN-AUD-03, ruling Q2): every column but the hashes, each as <octet length>:<text>; (null as ~;). The verifier rebuilds the same text."
    sql: |
      create or replace function aud.change_canonical(
          p_id uuid, p_occurred_at timestamptz, p_actor_user_id uuid, p_actor_kind text, p_entity_type text, p_entity_id uuid,
          p_company_id uuid, p_action text, p_changes jsonb, p_subject_person_id uuid, p_correlation_id uuid, p_ip_address inet,
          p_source text, p_created_at timestamptz, p_created_by uuid)
      returns text
      language sql immutable parallel safe
      set search_path = pg_catalog, pg_temp
      as $fn$
          select string_agg(case when v is null then '~;' else octet_length(v)::text || ':' || v || ';' end, '' order by n)
          from unnest(array[
              p_id::text,
              to_char(p_occurred_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'),
              p_actor_user_id::text, p_actor_kind, p_entity_type, p_entity_id::text, p_company_id::text, p_action,
              p_changes::text, p_subject_person_id::text, p_correlation_id::text, p_ip_address::text, p_source,
              to_char(p_created_at at time zone 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.US"Z"'),
              p_created_by::text]) with ordinality as t(v, n)
      $fn$;
      revoke all on function aud.change_canonical(uuid, timestamptz, uuid, text, text, uuid, uuid, text, jsonb, uuid, uuid, inet, text, timestamptz, uuid) from public;
      grant execute on function aud.change_canonical(uuid, timestamptz, uuid, text, text, uuid, uuid, text, jsonb, uuid, uuid, inet, text, timestamptz, uuid) to app_rw, app_ro, app_audit;

  - slice: S1.07
    name: aud.append_changes
    purpose: "The only way rows enter aud.change_log (KRN-AUD-01, KRN-AUD-03; rulings Q1, Q2, P1, P2): owned by the database owner, run with its rights; the caller cannot choose hashes, order or anchors. One chain per customer database, written under a transaction-level lock; occurred_at never goes backwards along the chain (a row earlier than the head moves to one microsecond after it), so a date range is one contiguous piece; each day's last hash is kept in aud.chain_anchors."
    sql: |
      create or replace function aud.append_changes(p_entries jsonb)
      returns integer
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      declare
          e jsonb;
          head_day date;
          head_at timestamptz;
          head_hash bytea;
          at timestamptz;
          hash bytea;
          written integer := 0;
      begin
          if p_entries is null or jsonb_typeof(p_entries) <> 'array' then
              raise exception 'aud.append_changes expects a json array' using errcode = '22023';
          end if;

          perform pg_advisory_xact_lock(hashtext('aud.change_log.chain'));
          -- The head is the latest row; the latest anchored day bounds the search to its partition (index ix_change_log_occurred_at, CR-029).
          select max(a.day) into head_day from aud.chain_anchors a;
          if head_day is not null then
              select c.occurred_at, c.row_hash into head_at, head_hash from aud.change_log c
              where c.occurred_at >= (head_day::timestamp at time zone 'UTC') order by c.occurred_at desc limit 1;
          end if;
          if head_hash is null then
              head_hash := decode(repeat('00', 32), 'hex');
          end if;

          for e in select value from jsonb_array_elements(p_entries) loop
              at := (e ->> 'occurred_at')::timestamptz;
              if at is null then
                  raise exception 'aud.append_changes: occurred_at is required' using errcode = '23502';
              end if;
              if head_at is not null and at <= head_at then
                  at := head_at + interval '1 microsecond';
              end if;

              hash := sha256(head_hash || convert_to(aud.change_canonical(
                  (e ->> 'id')::uuid, at, (e ->> 'actor_user_id')::uuid, e ->> 'actor_kind', e ->> 'entity_type', (e ->> 'entity_id')::uuid,
                  (e ->> 'company_id')::uuid, e ->> 'action', e -> 'changes', (e ->> 'subject_person_id')::uuid, (e ->> 'correlation_id')::uuid,
                  (e ->> 'ip_address')::inet, e ->> 'source', at, (e ->> 'created_by')::uuid), 'UTF8'));

              insert into aud.change_log (id, occurred_at, actor_user_id, actor_kind, entity_type, entity_id, company_id, action, changes,
                                          subject_person_id, correlation_id, ip_address, prev_hash, row_hash, created_at, created_by, source)
              values ((e ->> 'id')::uuid, at, (e ->> 'actor_user_id')::uuid, e ->> 'actor_kind', e ->> 'entity_type', (e ->> 'entity_id')::uuid,
                      (e ->> 'company_id')::uuid, e ->> 'action', e -> 'changes', (e ->> 'subject_person_id')::uuid, (e ->> 'correlation_id')::uuid,
                      (e ->> 'ip_address')::inet, head_hash, hash, at, (e ->> 'created_by')::uuid, e ->> 'source');

              insert into aud.chain_anchors (day, last_hash, verified_at) values ((at at time zone 'UTC')::date, hash, null)
              on conflict (day) do update set last_hash = excluded.last_hash, verified_at = null;

              head_at := at;
              head_hash := hash;
              written := written + 1;
          end loop;

          return written;
      end
      $fn$;
      revoke all on function aud.append_changes(jsonb) from public;
      grant execute on function aud.append_changes(jsonb) to app_rw;

  - slice: S1.07
    name: aud.mark_anchor_verified
    purpose: "Records that the verifier checked a finished day's anchor (KRN-AUD-03); the only change allowed to aud.chain_anchors besides appends."
    sql: |
      create or replace function aud.mark_anchor_verified(p_day date, p_last_hash bytea, p_at timestamptz)
      returns boolean
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      begin
          update aud.chain_anchors set verified_at = p_at where day = p_day and last_hash = p_last_hash;
          return found;
      end
      $fn$;
      revoke all on function aud.mark_anchor_verified(date, bytea, timestamptz) from public;
      grant execute on function aud.mark_anchor_verified(date, bytea, timestamptz) to app_rw;

  - slice: S1.07
    name: aud.append_security_event
    purpose: "Appends one aud.security_events row (KRN-AUD-02, ruling Q7) with the owner's rights; the application can add events but never change them."
    sql: |
      create or replace function aud.append_security_event(
          p_id uuid, p_occurred_at timestamptz, p_event_type text, p_actor text, p_subject text, p_severity text, p_details jsonb, p_created_by uuid)
      returns void
      language sql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
          insert into aud.security_events (id, occurred_at, event_type, actor, subject, severity, details, created_at, created_by)
          values (p_id, p_occurred_at, p_event_type, p_actor, p_subject, p_severity, coalesce(p_details, '{}'::jsonb), p_occurred_at, p_created_by);
      $fn$;
      revoke all on function aud.append_security_event(uuid, timestamptz, text, text, text, text, jsonb, uuid) from public;
      grant execute on function aud.append_security_event(uuid, timestamptz, text, text, text, text, jsonb, uuid) to app_rw;

  - slice: S1.07
    name: aud.append_access
    purpose: "Appends one aud.access_log row (KRN-AUD-02, GHR-02, HRM-PRV-05; ruling Q6) with the owner's rights."
    sql: |
      create or replace function aud.append_access(
          p_id uuid, p_occurred_at timestamptz, p_actor_user_id uuid, p_entity_type text, p_entity_id uuid, p_fields text[],
          p_action text, p_row_count integer, p_correlation_id uuid, p_created_by uuid)
      returns void
      language sql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
          insert into aud.access_log (id, occurred_at, actor_user_id, entity_type, entity_id, fields, action, row_count, created_at, created_by, correlation_id)
          values (p_id, p_occurred_at, p_actor_user_id, p_entity_type, p_entity_id, coalesce(p_fields, '{}'), p_action, p_row_count, p_occurred_at, p_created_by, p_correlation_id);
      $fn$;
      revoke all on function aud.append_access(uuid, timestamptz, uuid, text, uuid, text[], text, integer, uuid, uuid) from public;
      grant execute on function aud.append_access(uuid, timestamptz, uuid, text, uuid, text[], text, integer, uuid, uuid) to app_rw;

  - slice: S1.07
    name: aud.ensure_subject_key
    purpose: "The data subject's audit key (spec 03 R-21): stores the offered wrapped key when the person has none and returns the stored one, and whether it was destroyed."
    sql: |
      create or replace function aud.ensure_subject_key(p_person_id uuid, p_wrapped_key bytea)
      returns table (wrapped_key bytea, destroyed boolean)
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      begin
          insert into aud.subject_keys (person_id, wrapped_key, destroyed_at) values (p_person_id, p_wrapped_key, null)
          on conflict (person_id) do nothing;
          return query select k.wrapped_key, k.destroyed_at is not null from aud.subject_keys k where k.person_id = p_person_id;
      end
      $fn$;
      revoke all on function aud.ensure_subject_key(uuid, bytea) from public;
      grant execute on function aud.ensure_subject_key(uuid, bytea) to app_rw;

  - slice: S1.07
    name: aud.destroy_subject_key
    purpose: "Destroys a data subject's audit key (spec 03 R-21; used by retention and erasure, HRM-PRV-04, ADM-SEC-06): the key bytes are overwritten, so that person's personal values in the log become unreadable while every hash stays valid. A person without a key gets a destroyed entry, so no new key is ever made for them."
    sql: |
      create or replace function aud.destroy_subject_key(p_person_id uuid, p_at timestamptz)
      returns boolean
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      begin
          insert into aud.subject_keys (person_id, wrapped_key, destroyed_at) values (p_person_id, '\x'::bytea, p_at)
          on conflict (person_id) do update set wrapped_key = '\x'::bytea, destroyed_at = p_at where aud.subject_keys.destroyed_at is null;
          return found;
      end
      $fn$;
      revoke all on function aud.destroy_subject_key(uuid, timestamptz) from public;
      grant execute on function aud.destroy_subject_key(uuid, timestamptz) to app_rw;

  - slice: S1.07-r1
    name: app_audit rights (CR-031)
    purpose: "Risk R-011 closed: the app_audit login may no longer insert into audit tables directly (spec 03 section 3.7 as amended by CR-031); like the application login it can only call the audit functions, which choose the hashes."
    sql: |
      revoke insert on all tables in schema aud from app_audit;
      grant execute on function aud.append_changes(jsonb) to app_audit;
      grant execute on function aud.append_security_event(uuid, timestamptz, text, text, text, text, jsonb, uuid) to app_audit;
      grant execute on function aud.append_access(uuid, timestamptz, uuid, text, uuid, text[], text, integer, uuid, uuid) to app_audit;

  - slice: S1.07-r1
    name: aud.append_changes
    purpose: "Ruling P2 as amended by CR-032 (risk R-014): an entry stamped more than 5 minutes after the database clock takes the database clock instead and one warning security event (aud.clock_ahead) is written per call, so a server clock running ahead cannot push the chain into the future. Otherwise unchanged from S1.07."
    sql: |
      create or replace function aud.append_changes(p_entries jsonb)
      returns integer
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      declare
          e jsonb;
          head_day date;
          head_at timestamptz;
          head_hash bytea;
          at timestamptz;
          offered timestamptz;
          db_now timestamptz;
          capped integer := 0;
          latest_offered timestamptz;
          hash bytea;
          written integer := 0;
      begin
          if p_entries is null or jsonb_typeof(p_entries) <> 'array' then
              raise exception 'aud.append_changes expects a json array' using errcode = '22023';
          end if;

          perform pg_advisory_xact_lock(hashtext('aud.change_log.chain'));
          db_now := clock_timestamp();
          -- The head is the latest row; the latest anchored day bounds the search to its partition (index ix_change_log_occurred_at, CR-029).
          select max(a.day) into head_day from aud.chain_anchors a;
          if head_day is not null then
              select c.occurred_at, c.row_hash into head_at, head_hash from aud.change_log c
              where c.occurred_at >= (head_day::timestamp at time zone 'UTC') order by c.occurred_at desc limit 1;
          end if;
          if head_hash is null then
              head_hash := decode(repeat('00', 32), 'hex');
          end if;

          for e in select value from jsonb_array_elements(p_entries) loop
              offered := (e ->> 'occurred_at')::timestamptz;
              if offered is null then
                  raise exception 'aud.append_changes: occurred_at is required' using errcode = '23502';
              end if;
              at := offered;
              if at > db_now + interval '5 minutes' then
                  at := db_now;
                  capped := capped + 1;
                  latest_offered := greatest(latest_offered, offered);
              end if;
              if head_at is not null and at <= head_at then
                  at := head_at + interval '1 microsecond';
              end if;

              hash := sha256(head_hash || convert_to(aud.change_canonical(
                  (e ->> 'id')::uuid, at, (e ->> 'actor_user_id')::uuid, e ->> 'actor_kind', e ->> 'entity_type', (e ->> 'entity_id')::uuid,
                  (e ->> 'company_id')::uuid, e ->> 'action', e -> 'changes', (e ->> 'subject_person_id')::uuid, (e ->> 'correlation_id')::uuid,
                  (e ->> 'ip_address')::inet, e ->> 'source', at, (e ->> 'created_by')::uuid), 'UTF8'));

              insert into aud.change_log (id, occurred_at, actor_user_id, actor_kind, entity_type, entity_id, company_id, action, changes,
                                          subject_person_id, correlation_id, ip_address, prev_hash, row_hash, created_at, created_by, source)
              values ((e ->> 'id')::uuid, at, (e ->> 'actor_user_id')::uuid, e ->> 'actor_kind', e ->> 'entity_type', (e ->> 'entity_id')::uuid,
                      (e ->> 'company_id')::uuid, e ->> 'action', e -> 'changes', (e ->> 'subject_person_id')::uuid, (e ->> 'correlation_id')::uuid,
                      (e ->> 'ip_address')::inet, head_hash, hash, at, (e ->> 'created_by')::uuid, e ->> 'source');

              insert into aud.chain_anchors (day, last_hash, verified_at) values ((at at time zone 'UTC')::date, hash, null)
              on conflict (day) do update set last_hash = excluded.last_hash, verified_at = null;

              head_at := at;
              head_hash := hash;
              written := written + 1;
          end loop;

          if capped > 0 then
              insert into aud.security_events (id, occurred_at, event_type, actor, subject, severity, details, created_at, created_by)
              values (gen_random_uuid(), db_now, 'aud.clock_ahead', p_entries -> 0 ->> 'actor_user_id', 'aud.change_log', 'warning',
                      jsonb_build_object('entries', capped, 'latest_offered', latest_offered, 'database_time', db_now),
                      db_now, (p_entries -> 0 ->> 'created_by')::uuid);
          end if;

          return written;
      end
      $fn$;
      revoke all on function aud.append_changes(jsonb) from public;
      grant execute on function aud.append_changes(jsonb) to app_rw, app_audit;

  - slice: S1.08
    name: cfg.numbering_series_root
    purpose: "The scheme that owns a scheme's series (slice S1.08 ruling Q8, P1): schemes of the same company, branch, document type and pattern share one series; its counters and sequences belong to the member that issued the first number (the oldest such member), else to the scheme itself. Decided by issued numbers, not by creation time, so adding a scheme to a series can never move its counters."
    sql: |
      create or replace function cfg.numbering_series_root(p_scheme_id uuid)
      returns uuid
      language sql stable security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
          select coalesce((
              select r.id from cfg.numbering_schemes n
              join cfg.numbering_schemes r on r.company_id is not distinct from n.company_id and r.branch_id is not distinct from n.branch_id
                   and r.document_type = n.document_type and r.pattern = n.pattern
              where n.id = p_scheme_id
                and (exists (select 1 from cfg.numbering_counters c where c.scheme_id = r.id)
                     or exists (select 1 from pg_class k join pg_namespace ns on ns.oid = k.relnamespace
                                where ns.nspname = 'cfg' and k.relkind = 'S'
                                  and left(k.relname, 40) = 'numseq_' || replace(r.id::text, '-', '') || '_'))
              order by r.created_at, r.id limit 1), p_scheme_id)
      $fn$;
      revoke all on function cfg.numbering_series_root(uuid) from public;
      grant execute on function cfg.numbering_series_root(uuid) to app_rw, app_ro;

  - slice: S1.08
    name: cfg.numbering_next
    purpose: "The next running value of a numbering scheme (FR-KRN-NUM-02, FR-KRN-NUM-06; slice S1.08 rulings Q2, Q3, Q8): owned by the database owner, run with its rights; the application can only call it. The scheme row is held FOR SHARE (a scheme edit or retirement waits for allocations in flight) and must still be active at the version the caller read. A scheme continues its series (same company, branch, document type and pattern, Q8): the counters and sequences of cfg.numbering_series_root. Gap-free: the counter row is created or advanced in the caller's transaction and stays locked to its commit, so a rollback gives the number back; a wait of more than 5 seconds fails (lock_not_available). Gap-allowed: a PostgreSQL sequence per series and period, created on first use (cache 1, so numbers come out in time order); sequences are never rolled back, so callers never wait on each other."
    sql: |
      create or replace function cfg.numbering_next(p_scheme_id uuid, p_row_version bigint, p_scope_key text, p_now timestamptz)
      returns bigint
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      set lock_timeout = '5s'
      as $fn$
      declare
          s record;
          root uuid;
          seq_name text;
          v bigint;
          attempt integer := 0;
      begin
          if p_scope_key is null or p_scope_key !~ '^(all|[0-9]{4}|[0-9]{4}-[0-9]{2}|fy[0-9]{4})$' then
              raise exception 'cfg.numbering_next: scope key % is not a period', p_scope_key using errcode = '22023';
          end if;

          select n.company_id, n.branch_id, n.document_type, n.pattern, n.gap_free, n.start_value, n.status, n.row_version
          into s from cfg.numbering_schemes n where n.id = p_scheme_id for share;
          if not found or s.status <> 'active' or s.row_version <> p_row_version then
              raise exception 'cfg.numbering_next: scheme % is retired or changed', p_scheme_id using errcode = 'ER801';
          end if;

          root := cfg.numbering_series_root(p_scheme_id);

          if s.gap_free then
              insert into cfg.numbering_counters as c (scheme_id, scope_key, last_value, updated_at)
              values (root, p_scope_key, s.start_value, p_now)
              on conflict (scheme_id, scope_key) do update set last_value = c.last_value + 1, updated_at = excluded.updated_at
              returning c.last_value into v;
              return v;
          end if;

          seq_name := 'numseq_' || replace(root::text, '-', '') || '_' || replace(p_scope_key, '-', '_');
          loop
              attempt := attempt + 1;
              begin
                  return nextval(('cfg.' || seq_name)::regclass);
              exception when undefined_table then
                  if attempt > 3 then
                      raise;
                  end if;
                  begin
                      execute format('create sequence cfg.%I as bigint start with %s minvalue 1 cache 1 no cycle', seq_name, s.start_value);
                      execute format('comment on sequence cfg.%I is %L', seq_name, 'Gap-allowed numbering series ' || root::text || ', period ' || p_scope_key || ' (S1.08)');
                  exception when duplicate_table or unique_violation then
                      null; -- another session created it first
                  end;
              end;
          end loop;
      end
      $fn$;
      revoke all on function cfg.numbering_next(uuid, bigint, text, timestamptz) from public;
      grant execute on function cfg.numbering_next(uuid, bigint, text, timestamptz) to app_rw;

  - slice: S1.08
    name: cfg.numbering_series_state
    purpose: "What a scheme's series has issued, per period (slice S1.08 rulings Q8, Q9, Q10): the last value of each gap-free counter and gap-allowed sequence of the series the scheme belongs to. Used to lock a scheme after first use, to refuse a manual number the series could still produce and for the void report. Read-only; run with the owner's rights because the application cannot read the sequences."
    sql: |
      create or replace function cfg.numbering_series_state(p_scheme_id uuid)
      returns table (scope_key text, last_value bigint, gap_free boolean)
      language plpgsql stable security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      declare
          root uuid;
          prefix text;
          rel record;
          lv bigint;
          called boolean;
      begin
          if not exists (select 1 from cfg.numbering_schemes where id = p_scheme_id) then
              return;
          end if;
          root := cfg.numbering_series_root(p_scheme_id);

          return query select c.scope_key, c.last_value, true from cfg.numbering_counters c where c.scheme_id = root;

          prefix := 'numseq_' || replace(root::text, '-', '') || '_';
          for rel in
              select c.relname from pg_class c join pg_namespace ns on ns.oid = c.relnamespace
              where ns.nspname = 'cfg' and c.relkind = 'S' and left(c.relname, length(prefix)) = prefix
          loop
              execute format('select last_value, is_called from cfg.%I', rel.relname) into lv, called;
              if called then
                  scope_key := regexp_replace(substr(rel.relname, length(prefix) + 1), '^([0-9]{4})_([0-9]{2})$', '\1-\2');
                  last_value := lv;
                  gap_free := false;
                  return next;
              end if;
          end loop;
      end
      $fn$;
      revoke all on function cfg.numbering_series_state(uuid) from public;
      grant execute on function cfg.numbering_series_state(uuid) to app_rw, app_ro;

  - slice: S1.09a
    name: cfg.tg_config_version
    purpose: "Raises a change counter in cfg.config_versions (FR-KRN-SET-06; slice S1.09 ruling Q13 option A): one statement-level trigger per settings or flags table, so every change, from any path (services, migrations, packs), tells every host to refresh its cached values. Owned by the database owner and run with its rights; the counter row is created on first use. The counter becomes visible to other hosts only when the change commits."
    triggers:
      - [cfg.settings, tg_settings_config_version]
      - [cfg.setting_values, tg_setting_values_config_version]
      - [cfg.feature_flags, tg_feature_flags_config_version]
      - [cfg.feature_flag_overrides, tg_feature_flag_overrides_config_version]
    sql: |
      create or replace function cfg.tg_config_version()
      returns trigger
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      begin
          insert into cfg.config_versions (name, version, changed_at) values (tg_argv[0], 1, now())
          on conflict (name) do update set version = cfg.config_versions.version + 1, changed_at = excluded.changed_at;
          return null;
      end
      $fn$;
      revoke all on function cfg.tg_config_version() from public;
      create or replace trigger tg_settings_config_version after insert or update or delete or truncate on cfg.settings
          for each statement execute function cfg.tg_config_version('settings');
      create or replace trigger tg_setting_values_config_version after insert or update or delete or truncate on cfg.setting_values
          for each statement execute function cfg.tg_config_version('settings');
      create or replace trigger tg_feature_flags_config_version after insert or update or delete or truncate on cfg.feature_flags
          for each statement execute function cfg.tg_config_version('flags');
      create or replace trigger tg_feature_flag_overrides_config_version after insert or update or delete or truncate on cfg.feature_flag_overrides
          for each statement execute function cfg.tg_config_version('flags');

  - slice: S1.10a
    name: wf.tg_workflow_instances_parties_fixed
    purpose: "Nobody approves their own request (FR-XM-32; slice S1.10 ruling Q6): the requester and the people a request is about (subject_user_ids, CR-041) are fixed once the request exists, so the self-approval trigger on wf.workflow_tasks cannot be side-stepped by editing the request. In the functions file because the trigger names the column the S1.10a design file adds."
    triggers:
      - [wf.workflow_instances, tg_workflow_instances_parties_fixed]
    sql: |
      create or replace function wf.tg_workflow_instances_parties_fixed() returns trigger
      language plpgsql as $fn$
      begin
          if new.requester_user_id is distinct from old.requester_user_id
             or new.subject_user_ids is distinct from old.subject_user_ids then
              raise exception 'workflow request %: the requester and the people it is about cannot change (FR-XM-32)', old.id
                  using errcode = '23514', constraint = 'ck_workflow_instances_parties_fixed';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_workflow_instances_parties_fixed before update of requester_user_id, subject_user_ids
          on wf.workflow_instances for each row execute function wf.tg_workflow_instances_parties_fixed();

  - slice: S1.11a
    name: meta.ensure_partitions
    purpose: "Monthly partitions ahead of time (spec 03 section 8, FR-HRM-DAT-04; slice S1.11 Build item 5): for every monthly-partitioned table of the customer database (a parent with a <table>_default partition), creates <table>_pYYYY_MM for each month from p_first_month for p_months months when missing. Owned by the migration login and run with its rights, so the application login needs no right to create tables. A month whose rows already sit in the default partition is not created and is reported (outcome 'default_has_rows'), because attaching it would fail; an operator moves the rows first."
    sql: |
      create or replace function meta.ensure_partitions(p_first_month date, p_months integer)
      returns table (table_name text, partition_name text, outcome text)
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      declare
          parent record;
          month date;
          upper_month date;
          lower_bound text;
          upper_bound text;
          v_name text;
          has_rows boolean;
      begin
          if p_months is null or p_months < 1 or p_months > 36 then
              raise exception 'ensure_partitions: months must be between 1 and 36' using errcode = '22023';
          end if;
          for parent in
              select n.nspname as schema_name, c.relname as rel_name, a.attname as key_column, format_type(a.atttypid, a.atttypmod) as key_type
              from pg_partitioned_table pt
              join pg_class c on c.oid = pt.partrelid
              join pg_namespace n on n.oid = c.relnamespace
              join pg_attribute a on a.attrelid = c.oid and a.attnum = pt.partattrs[0]
              where pt.partstrat = 'r' and pt.partnatts = 1
                and exists (select 1 from pg_inherits i join pg_class d on d.oid = i.inhrelid
                            where i.inhparent = c.oid and d.relname = c.relname || '_default')
              order by n.nspname, c.relname
          loop
              for i in 0 .. p_months - 1 loop
                  month := (date_trunc('month', p_first_month) + make_interval(months => i))::date;
                  upper_month := (month + interval '1 month')::date;
                  v_name := parent.rel_name || '_p' || to_char(month, 'YYYY_MM');
                  if exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                             where n.nspname = parent.schema_name and c.relname = v_name) then
                      continue;
                  end if;
                  if parent.key_type = 'timestamp with time zone' then
                      lower_bound := quote_literal(to_char(month, 'YYYY-MM-DD') || ' 00:00:00+00');
                      upper_bound := quote_literal(to_char(upper_month, 'YYYY-MM-DD') || ' 00:00:00+00');
                  else
                      lower_bound := quote_literal(to_char(month, 'YYYY-MM-DD'));
                      upper_bound := quote_literal(to_char(upper_month, 'YYYY-MM-DD'));
                  end if;
                  execute format('select exists (select 1 from %I.%I where %I >= %s and %I < %s)',
                      parent.schema_name, parent.rel_name || '_default', parent.key_column, lower_bound, parent.key_column, upper_bound) into has_rows;
                  if has_rows then
                      table_name := parent.schema_name || '.' || parent.rel_name; partition_name := v_name; outcome := 'default_has_rows';
                      return next;
                      continue;
                  end if;
                  execute format('create table %I.%I partition of %I.%I for values from (%s) to (%s)',
                      parent.schema_name, v_name, parent.schema_name, parent.rel_name, lower_bound, upper_bound);
                  table_name := parent.schema_name || '.' || parent.rel_name; partition_name := v_name; outcome := 'created';
                  return next;
              end loop;
          end loop;
      end
      $fn$;
      revoke all on function meta.ensure_partitions(date, integer) from public;
      grant execute on function meta.ensure_partitions(date, integer) to app_rw;

  - slice: S1.03-r1
    name: org.tg_branches_keep_one_per_company
    purpose: "Rule SC-2 under concurrency (S1.03 review finding 4): before checking that another branch remains, the trigger locks the company row (for no key update, which does not block inserts that reference the company), so two transactions removing a company's last two branches take turns and the second one is refused. Otherwise unchanged from S1.03."
    sql: |
      create or replace function org.tg_branches_keep_one_per_company() returns trigger
      language plpgsql as $fn$
      begin
          if old.is_deleted then
              return coalesce(new, old);
          end if;
          if tg_op = 'UPDATE' and not new.is_deleted and new.company_id = old.company_id then
              return new;
          end if;
          perform 1 from org.companies c where c.id = old.company_id for no key update;
          if exists (select 1 from org.companies c where c.id = old.company_id and not c.is_deleted)
             and not exists (select 1 from org.branches b
                             where b.company_id = old.company_id and b.id <> old.id and not b.is_deleted) then
              raise exception 'company % must keep at least one branch (rule SC-2)', old.company_id
                  using errcode = '23514', constraint = 'ck_branches_one_per_company';
          end if;
          return coalesce(new, old);
      end
      $fn$;

  - slice: S1.03-r1
    name: meta.schema_history rights (R-038)
    purpose: "S1.03 review finding 8: only the migrator (the owner login) records applied migrations; the application login keeps read access but can no longer insert, so it cannot mark a migration as applied (spec 03 section 3.7; risk R-038, closed by this change)."
    sql: |
      revoke insert on meta.schema_history from app_rw;

  # S1.13a (CR-069, ruling Q6): the S1.05 deferral. Sign-in could match the wrong person if one user's username is another
  # user's e-mail address. The trigger refuses both directions, case-insensitively, on insert and on a change of either
  # column; a user's own username may equal their own e-mail address. The generated endpoints report the constraint name and
  # the screens say "already used to sign in" (errors.users.already_used_to_sign_in). Added as a function entry, not a
  # design note, because the first migrations are frozen.
  - slice: S1.13a
    name: iam.tg_users_username_email_clash
    purpose: "A username never equals another user's e-mail address, and an e-mail address never equals another user's username, in any letter case (CR-069, S1.05 deferral); refused with constraint ck_users_username_email_clash."
    triggers:
      - [iam.users, tg_users_username_email_clash]
    sql: |
      create or replace function iam.tg_users_username_email_clash() returns trigger
      language plpgsql as $fn$
      begin
          if exists (select 1 from iam.users o
                     where o.id <> new.id and (lower(o.email) = lower(new.username) or lower(o.username) = lower(new.email))) then
              raise exception 'username or e-mail of user % is already used to sign in by another user', new.id
                  using errcode = '23514', constraint = 'ck_users_username_email_clash';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_users_username_email_clash before insert or update of username, email on iam.users
          for each row execute function iam.tg_users_username_email_clash();

  # S1.14a (CR-070, Q3, Q5): what a site's coordinates, time zone and opening hours may hold. A function entry, not a design
  # note, because the first migrations are frozen. Each refusal names its constraint so the form shows it next to the field.
  - slice: S1.14a
    name: org.tg_locations_checks
    purpose: "A location's latitude is between -90 and 90, longitude between -180 and 180, time zone an IANA name known to the database, and operating hours an object of weekdays (mon to sun) each either {closed: true} or {open, close} as HH:MM with open before close (CR-070, FR-ADM-ORG-02); refused with constraints ck_locations_latitude_range, ck_locations_longitude_range, ck_locations_time_zone and ck_locations_operating_hours."
    triggers:
      - [org.locations, tg_locations_checks]
    constraint_fields:
      - [org.locations, ck_locations_latitude_range, latitude]
      - [org.locations, ck_locations_longitude_range, longitude]
      - [org.locations, ck_locations_time_zone, time_zone]
      - [org.locations, ck_locations_operating_hours, operating_hours]
    sql: |
      create or replace function org.tg_locations_checks() returns trigger
      language plpgsql as $fn$
      declare
          day_key text;
          day_value jsonb;
      begin
          if new.latitude is not null and (new.latitude < -90 or new.latitude > 90) then
              raise exception 'latitude of location % is outside -90 to 90', new.id using errcode = '23514', constraint = 'ck_locations_latitude_range';
          end if;
          if new.longitude is not null and (new.longitude < -180 or new.longitude > 180) then
              raise exception 'longitude of location % is outside -180 to 180', new.id using errcode = '23514', constraint = 'ck_locations_longitude_range';
          end if;
          if not exists (select 1 from pg_catalog.pg_timezone_names n where n.name = new.time_zone) then
              raise exception 'time zone % of location % is not an IANA name', new.time_zone, new.id using errcode = '23514', constraint = 'ck_locations_time_zone';
          end if;
          if new.operating_hours is not null then
              if jsonb_typeof(new.operating_hours) <> 'object' then
                  raise exception 'operating hours of location % are not an object', new.id using errcode = '23514', constraint = 'ck_locations_operating_hours';
              end if;
              for day_key, day_value in select * from jsonb_each(new.operating_hours) loop
                  if day_key not in ('mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun') or jsonb_typeof(day_value) <> 'object' then
                      raise exception 'operating hours of location % hold an unknown day %', new.id, day_key using errcode = '23514', constraint = 'ck_locations_operating_hours';
                  end if;
                  if day_value = '{"closed": true}'::jsonb then
                      continue;
                  end if;
                  if not (day_value ?& array['open', 'close']) or (select count(*) from jsonb_object_keys(day_value)) <> 2
                     or coalesce(day_value ->> 'open', '') !~ '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                     or coalesce(day_value ->> 'close', '') !~ '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                     or (day_value ->> 'open') >= (day_value ->> 'close') then
                      raise exception 'operating hours of location % for % are not open before close', new.id, day_key using errcode = '23514', constraint = 'ck_locations_operating_hours';
                  end if;
              end loop;
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_locations_checks before insert or update on org.locations
          for each row execute function org.tg_locations_checks();

  # S1.20b (CR-076 S1.20b detail; FR-XM-05, slice S1.20 rulings Q2 and Q12): an employment event that is approved, effective or
  # cancelled is never edited. Only its status moves on (approved to effective on its date, or approved to cancelled when a
  # correction replaced it before that date) and a letter may be attached later (S1.24); corrections are new events. Only a
  # draft may be removed. A function entry, not a design note, because the first migrations are frozen.
  - slice: S1.20b
    name: hrm.tg_employment_events_fixed
    purpose: "An approved, effective or cancelled employment event is never changed except its status (approved to effective or cancelled) and its letter, and only a draft may be deleted (FR-XM-05); refused with constraint ck_employment_events_fixed."
    triggers:
      - [hrm.employment_events, tg_employment_events_fixed]
    sql: |
      create or replace function hrm.tg_employment_events_fixed() returns trigger
      language plpgsql as $fn$
      begin
          if tg_op = 'DELETE' then
              if old.status <> 'draft' then
                  raise exception 'employment event % is % and cannot be deleted', old.id, old.status
                      using errcode = '23514', constraint = 'ck_employment_events_fixed';
              end if;
              return old;
          end if;
          if old.status in ('approved', 'effective', 'cancelled')
             and ((new.company_id, new.employment_id, new.kind, new.reason_code, new.effective_date, new.notes, new.carry_over,
                   new.workflow_instance_id, new.changes, new.corrects_event_id, new.created_at, new.created_by)
                  is distinct from
                  (old.company_id, old.employment_id, old.kind, old.reason_code, old.effective_date, old.notes, old.carry_over,
                   old.workflow_instance_id, old.changes, old.corrects_event_id, old.created_at, old.created_by)
                  or not (new.status = old.status or (old.status = 'approved' and new.status in ('effective', 'cancelled')))) then
              raise exception 'employment event % is % and cannot be changed', old.id, old.status
                  using errcode = '23514', constraint = 'ck_employment_events_fixed';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_employment_events_fixed before update or delete on hrm.employment_events
          for each row execute function hrm.tg_employment_events_fixed();

  # S1.22a (CR-078 S1.22a detail c; slice S1.22 Build items 2 to 4): numbers that cannot be negative, kept by the database like the
  # other value rules (a function entry, not a design check, because the first migrations are frozen). Each refusal names its
  # constraint, so the screens show it next to the field.
  - slice: S1.22a
    name: hrm.tg_positions_value_checks
    purpose: "A position's budgeted FTE is not negative (constraint ck_positions_budgeted_fte); a grade's rank is not negative (ck_grades_rank); a sanctioned count is not negative (ck_headcount_budgets_sanctioned_count)."
    triggers:
      - [hrm.positions, tg_positions_value_checks]
      - [hrm.grades, tg_grades_value_checks]
      - [hrm.headcount_budgets, tg_headcount_budgets_value_checks]
    sql: |
      create or replace function hrm.tg_positions_value_checks() returns trigger
      language plpgsql as $fn$
      begin
          if new.budgeted_fte < 0 then
              raise exception 'position % has a negative budgeted FTE', new.position_code
                  using errcode = '23514', constraint = 'ck_positions_budgeted_fte';
          end if;
          return new;
      end
      $fn$;
      create or replace function hrm.tg_grades_value_checks() returns trigger
      language plpgsql as $fn$
      begin
          if new.rank < 0 then
              raise exception 'grade % has a negative rank', new.code
                  using errcode = '23514', constraint = 'ck_grades_rank';
          end if;
          if jsonb_typeof(new.defaults) is distinct from 'object' then
              raise exception 'grade % needs its defaults as an object', new.code
                  using errcode = '23514', constraint = 'ck_grades_defaults_object';
          end if;
          return new;
      end
      $fn$;
      create or replace function hrm.tg_headcount_budgets_value_checks() returns trigger
      language plpgsql as $fn$
      begin
          if new.sanctioned_count < 0 then
              raise exception 'a sanctioned count cannot be negative'
                  using errcode = '23514', constraint = 'ck_headcount_budgets_sanctioned_count';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_positions_value_checks before insert or update of budgeted_fte on hrm.positions
          for each row execute function hrm.tg_positions_value_checks();
      create or replace trigger tg_grades_value_checks before insert or update of rank, defaults on hrm.grades
          for each row execute function hrm.tg_grades_value_checks();
      create or replace trigger tg_headcount_budgets_value_checks before insert or update of sanctioned_count on hrm.headcount_budgets
          for each row execute function hrm.tg_headcount_budgets_value_checks();
  # S1.20d (CR-076 S1.20d detail; FR-HRM-EMP-06, FR-HRM-PAY-24): on every date where an employment has payment accounts, exactly
  # one of them takes the remainder and the percentages add up to at most 100. Deferred to the commit, because one held change may
  # move the remainder from one account to another (two rows); the services check the same rule first and set the constraint
  # immediate before they commit, so a refusal is an answer, not a failed commit.
  - slice: S1.20d
    name: hrm.tg_employee_bank_accounts_split
    purpose: "On every date with payment accounts an employment has exactly one remainder account and percentages summing to at most 100 (FR-HRM-EMP-06); refused with constraint ck_employee_bank_accounts_split at commit."
    triggers:
      - [hrm.employee_bank_accounts, tg_employee_bank_accounts_split]
    sql: |
      create or replace function hrm.tg_employee_bank_accounts_split() returns trigger
      language plpgsql as $fn$
      declare
          emps uuid[];
          emp uuid;
          d date;
          accounts integer;
          remainders integer;
          percent numeric;
      begin
          -- The employment of the row; on an update that moves a row, both employments (review S1.20d finding 10).
          if tg_op = 'DELETE' then
              emps := array[old.employment_id];
          elsif tg_op = 'UPDATE' and old.employment_id <> new.employment_id then
              emps := array[old.employment_id, new.employment_id];
          else
              emps := array[new.employment_id];
          end if;
          foreach emp in array emps loop
              for d in
                  select a.valid_from from hrm.employee_bank_accounts a where a.employment_id = emp
                  union
                  select a.valid_to from hrm.employee_bank_accounts a where a.employment_id = emp and a.valid_to is not null
              loop
                  select count(*), count(*) filter (where a.split_kind = 'remainder'), coalesce(sum(a.split_value) filter (where a.split_kind = 'percent'), 0)
                    into accounts, remainders, percent
                    from hrm.employee_bank_accounts a
                   where a.employment_id = emp and a.valid_from <= d and (a.valid_to is null or a.valid_to > d);
                  if accounts > 0 and (remainders <> 1 or percent > 100) then
                      raise exception 'payment accounts of employment % on % have % remainder accounts and % percent', emp, d, remainders, percent
                          using errcode = '23514', constraint = 'ck_employee_bank_accounts_split';
                  end if;
              end loop;
          end loop;
          return null;
      end
      $fn$;
      drop trigger if exists tg_employee_bank_accounts_split on hrm.employee_bank_accounts;
      create constraint trigger tg_employee_bank_accounts_split after insert or update or delete on hrm.employee_bank_accounts
          deferrable initially deferred for each row execute function hrm.tg_employee_bank_accounts_split();

  # S1.23a (CR-079 S1.23a detail; slice S1.23 Build item 2, FR-XM-05): a policy version in force (active, or retired with its policy)
  # is never edited, so a result that used it can always be explained: only its end date may be set once (a later version or the
  # policy's retirement ends it) and active may become retired. Only a draft may be deleted. A function entry, not a design note,
  # because the first migrations are frozen.
  - slice: S1.23a
    name: hrm.tg_policy_versions_fixed
    purpose: "A policy version in force is never changed except its end date (set once) and its status (active to retired), and only a draft may be deleted (FR-XM-05); refused with constraint ck_policy_versions_fixed."
    triggers:
      - [hrm.policy_versions, tg_policy_versions_fixed]
    sql: |
      create or replace function hrm.tg_policy_versions_fixed() returns trigger
      language plpgsql as $fn$
      begin
          if tg_op = 'DELETE' then
              if old.status <> 'draft' then
                  raise exception 'policy version % is % and cannot be deleted', old.id, old.status
                      using errcode = '23514', constraint = 'ck_policy_versions_fixed';
              end if;
              return old;
          end if;
          if old.status <> 'draft' and (
                  (new.policy_id, new.version, new.parameters, new.is_overridden, new.valid_from, new.created_at, new.created_by)
                  is distinct from
                  (old.policy_id, old.version, old.parameters, old.is_overridden, old.valid_from, old.created_at, old.created_by)
                  or (old.valid_to is not null and new.valid_to is distinct from old.valid_to)
                  or not (new.status = old.status or (old.status = 'active' and new.status = 'retired'))) then
              raise exception 'policy version % is % and cannot be changed', old.id, old.status
                  using errcode = '23514', constraint = 'ck_policy_versions_fixed';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_policy_versions_fixed before update or delete on hrm.policy_versions
          for each row execute function hrm.tg_policy_versions_fixed();

  # S1.23a (CR-079 S1.23a detail; slice S1.23 Build items 3 and 5, ruling Q4): on every date, no two assignments of policies of the
  # same type in one company share a precedence (first match wins, so a tie could not be explained); an assignment is never edited
  # except its end date, set once, when a newer set replaces it. The service checks the same and holds a lock per company and type.
  - slice: S1.23a
    name: hrm.tg_policy_assignments_checks
    purpose: "No two assignments of one policy type in one company overlap with the same precedence (constraint ck_policy_assignments_precedence_unique); an assignment changes only by its end date, set once (constraint ck_policy_assignments_fixed)."
    triggers:
      - [hrm.policy_assignments, tg_policy_assignments_checks]
    sql: |
      create or replace function hrm.tg_policy_assignments_checks() returns trigger
      language plpgsql as $fn$
      declare
          kind text;
      begin
          if tg_op = 'UPDATE' and (
                  (new.company_id, new.policy_id, new.precedence, new.rule, new.valid_from, new.created_at, new.created_by)
                  is distinct from
                  (old.company_id, old.policy_id, old.precedence, old.rule, old.valid_from, old.created_at, old.created_by)
                  or (old.valid_to is not null and new.valid_to is distinct from old.valid_to)) then
              raise exception 'policy assignment % cannot be changed except by ending it', old.id
                  using errcode = '23514', constraint = 'ck_policy_assignments_fixed';
          end if;
          select p.policy_type into kind from hrm.policies p where p.id = new.policy_id;
          -- The same lock as the service's set activation (PolicyWriter.LockSetAsync), so two writers of one type and company never
          -- pass this check at the same time (review S1.23a finding 7).
          perform pg_advisory_xact_lock(hashtextextended('hrm.policy_assignments:' || new.company_id::text || ':' || kind, 0));
          if exists (
              select 1 from hrm.policy_assignments a
                join hrm.policies p on p.id = a.policy_id
               where a.id <> new.id and a.policy_id <> new.policy_id -- the same policy: the exclusion constraint answers
                 and a.company_id = new.company_id and a.precedence = new.precedence and p.policy_type = kind
                 and daterange(a.valid_from, a.valid_to, '[)') && daterange(new.valid_from, new.valid_to, '[)')) then
              raise exception 'another % assignment of company % has precedence % on some of these dates', kind, new.company_id, new.precedence
                  using errcode = '23514', constraint = 'ck_policy_assignments_precedence_unique';
          end if;
          return new;
      end
      $fn$;
      create or replace trigger tg_policy_assignments_checks before insert or update on hrm.policy_assignments
          for each row execute function hrm.tg_policy_assignments_checks();

  # S1.27a (CR-088; slice S1.27 Build item 5, FR-HRM-DAT-04): the purge job drops whole expired monthly partitions of the attendance events,
  # through this function: the application login cannot drop tables and the events themselves can never be deleted row by row.
  - slice: S1.27a
    name: hrm.drop_expired_attendance_partitions
    purpose: "Drops the monthly partitions of hrm.attendance_events whose whole month lies before p_before (a date: the first day of the oldest month kept). Only partitions named attendance_events_pYYYY_MM are touched, never the default partition and never a month that has not completely ended before p_before, and a row is never deleted on its own: the append-only trigger stays. Returns the names dropped and the number of rows they held. Owned by the migration login and run with its rights, as meta.ensure_partitions."
    sql: |
      create or replace function hrm.drop_expired_attendance_partitions(p_before date)
      returns table (partition_name text, row_count bigint)
      language plpgsql security definer
      set search_path = pg_catalog, pg_temp
      as $fn$
      declare
          part record;
          month_start date;
          rows_held bigint;
      begin
          if p_before is null then
              raise exception 'drop_expired_attendance_partitions: a date is required' using errcode = '22004';
          end if;
          for part in
              select c.relname as rel_name
              from pg_inherits i
              join pg_class c on c.oid = i.inhrelid
              join pg_class p on p.oid = i.inhparent
              join pg_namespace n on n.oid = p.relnamespace
              where n.nspname = 'hrm' and p.relname = 'attendance_events'
                and c.relname ~ '^attendance_events_p[0-9]{4}_[0-9]{2}$'
              order by c.relname
          loop
              month_start := to_date(substr(part.rel_name, length('attendance_events_p') + 1), 'YYYY_MM');
              if (month_start + interval '1 month')::date <= p_before then
                  execute format('select count(*) from hrm.%I', part.rel_name) into rows_held;
                  execute format('drop table hrm.%I', part.rel_name);
                  partition_name := part.rel_name; row_count := rows_held;
                  return next;
              end if;
          end loop;
      end
      $fn$;
      revoke all on function hrm.drop_expired_attendance_partitions(date) from public;
      grant execute on function hrm.drop_expired_attendance_partitions(date) to app_rw;
  # S1.34a (CR-087; FR-HRM-PAY-01): the numbers of a pay group are in range, and its frequency and tax-year start cannot change once
  # periods exist (the periods were generated from them). Statutory values are never here (AS-4): the tax-year start month and the
  # cut-off and payment offsets are the customer's own settings of the group.
  - slice: S1.34a
    name: hrm.tg_pay_groups_rules
    purpose: "A pay group's tax-year start month is 1 to 12 and its cut-off and payment offsets are 0 to 31 days; its frequency and tax-year start month do not change once periods exist (FR-HRM-PAY-01); refused with constraint ck_pay_groups_rules."
    triggers:
      - [hrm.pay_groups, tg_pay_groups_rules]
    sql: |
      create or replace function hrm.tg_pay_groups_rules() returns trigger
      language plpgsql as $fn$
      begin
          if new.tax_year_start_month < 1 or new.tax_year_start_month > 12
             or (new.cut_off_day is not null and (new.cut_off_day < 0 or new.cut_off_day > 31))
             or (new.payment_day is not null and (new.payment_day < 0 or new.payment_day > 31)) then
              raise exception 'pay group %: tax-year start month must be 1 to 12 and cut-off and payment offsets 0 to 31', new.code
                  using errcode = '23514', constraint = 'ck_pay_groups_rules';
          end if;
          if tg_op = 'UPDATE'
             and (new.frequency is distinct from old.frequency or new.tax_year_start_month is distinct from old.tax_year_start_month)
             and exists (select 1 from hrm.pay_periods p where p.pay_group_id = old.id) then
              raise exception 'pay group %: frequency and tax-year start cannot change once periods exist', old.code
                  using errcode = '23514', constraint = 'ck_pay_groups_rules';
          end if;
          return new;
      end
      $fn$;
      drop trigger if exists tg_pay_groups_rules on hrm.pay_groups;
      create trigger tg_pay_groups_rules before insert or update on hrm.pay_groups
          for each row execute function hrm.tg_pay_groups_rules();

  # S1.34a (CR-087; FR-HRM-PAY-01, FR-HRM-PAY-38): the dates of a period change only while it is in the future (before it opens); a
  # closed period never changes at all; only a future period can be deleted. The status itself is advanced by the pay run (S1.38).
  - slice: S1.34a
    name: hrm.tg_pay_periods_fixed
    purpose: "Dates, number and tax year of a period change only while it is future; a closed period never changes; only a future period is deleted (FR-HRM-PAY-01); refused with constraint ck_pay_periods_fixed."
    triggers:
      - [hrm.pay_periods, tg_pay_periods_fixed]
    sql: |
      create or replace function hrm.tg_pay_periods_fixed() returns trigger
      language plpgsql as $fn$
      begin
          if tg_op = 'DELETE' then
              if old.status <> 'future' then
                  raise exception 'pay period % is % and cannot be deleted', old.id, old.status
                      using errcode = '23514', constraint = 'ck_pay_periods_fixed';
              end if;
              return old;
          end if;
          if old.status = 'closed' then
              raise exception 'pay period % is closed and cannot change', old.id
                  using errcode = '23514', constraint = 'ck_pay_periods_fixed';
          end if;
          if old.status <> 'future'
             and (new.pay_group_id, new.period_no, new.tax_year, new.start_date, new.end_date, new.cut_off_date, new.payment_date)
                 is distinct from
                 (old.pay_group_id, old.period_no, old.tax_year, old.start_date, old.end_date, old.cut_off_date, old.payment_date) then
              raise exception 'pay period % is % and its dates cannot change', old.id, old.status
                  using errcode = '23514', constraint = 'ck_pay_periods_fixed';
          end if;
          return new;
      end
      $fn$;
      drop trigger if exists tg_pay_periods_fixed on hrm.pay_periods;
      create trigger tg_pay_periods_fixed before update or delete on hrm.pay_periods
          for each row execute function hrm.tg_pay_periods_fixed();

  # S1.34b (CR-087 S1.34b detail; FR-HRM-PAY-06, FR-XM-05): a compensation assignment that a revision has ended (it has an end date) is a
  # record of what was agreed and never changes or disappears, nor do its lines, and no line is added to it; the row in force keeps its
  # employee, structure, event and start. The revision service is the only writer of the current row (the generated writes are closed)
  # and ends it by setting its end date. The audit coverage test changes and deletes fresh rows of every audited table, so the rows in
  # force and their lines cannot be locked further here (review S1.34b M2, ruled in its Response). Refused with constraint ck_compensation_fixed.
  - slice: S1.34b
    name: hrm.tg_compensation_fixed
    purpose: "A compensation assignment that a revision has ended never changes or is deleted, and neither are its lines (FR-HRM-PAY-06, FR-XM-05); refused with constraint ck_compensation_fixed."
    triggers:
      - [hrm.compensation_assignments, tg_compensation_assignments_fixed]
      - [hrm.compensation_lines, tg_compensation_lines_fixed]
      - [hrm.compensation_lines, tg_compensation_lines_insert]
    sql: |
      create or replace function hrm.tg_compensation_fixed() returns trigger
      language plpgsql as $fn$
      declare
          v_ended boolean;
      begin
          if tg_table_name = 'compensation_assignments' then
              v_ended := old.valid_to is not null;
              if not v_ended and tg_op = 'UPDATE'
                 and (new.employment_id, new.structure_id, new.event_id, new.valid_from, new.company_id)
                     is distinct from (old.employment_id, old.structure_id, old.event_id, old.valid_from, old.company_id) then
                  raise exception 'a compensation assignment keeps its employee, structure, event and start: record a revision'
                      using errcode = '23514', constraint = 'ck_compensation_fixed';
              end if;
          else
              select a.valid_to is not null into v_ended from hrm.compensation_assignments a where a.id = old.assignment_id;
          end if;
          if coalesce(v_ended, false) then
              raise exception 'an ended % row never changes: record a revision', tg_table_name
                  using errcode = '23514', constraint = 'ck_compensation_fixed';
          end if;
          if tg_op = 'DELETE' then
              return old;
          end if;
          return new;
      end
      $fn$;
      create or replace function hrm.tg_compensation_lines_insert() returns trigger
      language plpgsql as $fn$
      begin
          if exists (select 1 from hrm.compensation_assignments a where a.id = new.assignment_id and a.valid_to is not null) then
              raise exception 'an ended compensation_assignments row never changes: record a revision'
                  using errcode = '23514', constraint = 'ck_compensation_fixed';
          end if;
          return new;
      end
      $fn$;
      drop trigger if exists tg_compensation_lines_insert on hrm.compensation_lines;
      create trigger tg_compensation_lines_insert before insert on hrm.compensation_lines
          for each row execute function hrm.tg_compensation_lines_insert();
      drop trigger if exists tg_compensation_assignments_fixed on hrm.compensation_assignments;
      create trigger tg_compensation_assignments_fixed before update or delete on hrm.compensation_assignments
          for each row execute function hrm.tg_compensation_fixed();
      drop trigger if exists tg_compensation_lines_fixed on hrm.compensation_lines;
      create trigger tg_compensation_lines_fixed before update or delete on hrm.compensation_lines
          for each row execute function hrm.tg_compensation_fixed();

  # S1.28a (CR-085 S1.28a detail; slice S1.28 Build item 5, FR-HRM-ATT-07): once a roster is published, a day of it is added, moved to
  # another shift or day type, or removed only with a reason, and a published day is never deleted (the day is changed to a weekly off
  # or other day type instead); changing only the status (publishing, archiving) needs none.
  - slice: S1.28a
    name: hrm.tg_roster_lines_published
    purpose: "A line of a published roster is added or changed only with a reason and is never deleted (FR-HRM-ATT-07); refused with constraint ck_roster_lines_published."
    triggers:
      - [hrm.roster_lines, tg_roster_lines_published]
    sql: |
      create or replace function hrm.tg_roster_lines_published() returns trigger
      language plpgsql as $fn$
      begin
          if tg_op = 'DELETE' then
              if old.roster_status = 'published' then
                  raise exception 'roster line % belongs to a published roster and cannot be deleted', old.id
                      using errcode = '23514', constraint = 'ck_roster_lines_published';
              end if;
              return old;
          end if;
          if tg_op = 'INSERT' then
              if new.roster_status = 'published' and (new.reason is null or btrim(new.reason) = '') then
                  raise exception 'a day added to a published roster needs a reason'
                      using errcode = '23514', constraint = 'ck_roster_lines_published';
              end if;
              return new;
          end if;
          if old.roster_status = 'published'
             and (new.shift_id, new.day_type, new.work_date, new.employment_id) is distinct from (old.shift_id, old.day_type, old.work_date, old.employment_id)
             and (new.reason is null or btrim(new.reason) = '') then
              raise exception 'a day of a published roster changes only with a reason'
                  using errcode = '23514', constraint = 'ck_roster_lines_published';
          end if;
          return new;
      end
      $fn$;
      drop trigger if exists tg_roster_lines_published on hrm.roster_lines;
      create trigger tg_roster_lines_published before insert or update or delete on hrm.roster_lines
          for each row execute function hrm.tg_roster_lines_published();

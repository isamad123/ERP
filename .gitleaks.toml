# Secret scan configuration (S1.11f1, R-030). Default gitleaks rules plus exact-value allowances only:
# the CI-only PostgreSQL password of the throwaway service container (.github/workflows/ci.yml) and the public RFC 6238
# test secret (base32 of "12345678901234567890") used by tests/Erp.UnitTests/Identity/IdentityDomainTests.cs.
title = "ERP secret scan"

[extend]
useDefault = true

[allowlist]
description = "Exact public test values"
regexTarget = "match"
regexes = [
  '''erp-ci-only''',
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
]

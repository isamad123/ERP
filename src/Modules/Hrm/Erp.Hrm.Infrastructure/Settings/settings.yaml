# Settings of the HR module (slice S1.09a format). S1.20a (CR-076 S1.20a detail c; slice S1.20 ruling Q4): merging duplicate
# persons waits for a second person while this setting is on; changing the setting waits for a second person too (review finding 3). Urdu texts to be reviewed by a native speaker (R-062).
settings:
  - key: hrm.person_merge.requires_approval
    type: bool
    default: true
    layers: [tenant]
    requires_approval: true
    area: hr.people
    name: {en: "Approval of person merges", ur: "افراد کے انضمام کی منظوری"}
    description: {en: "Merging two person records needs a second person's approval", ur: "دو افراد کے ریکارڈ ضم کرنے کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "A merge of duplicate person records waits until another person with the merge permission approves it. The person who asked can never approve it.", ur: "دہرائے گئے افراد کے ریکارڈ کا انضمام اس وقت تک رکا رہتا ہے جب تک انضمام کی اجازت والا کوئی دوسرا شخص اسے منظور نہ کرے۔ درخواست کرنے والا اسے کبھی منظور نہیں کر سکتا۔"}
  # S1.20b (CR-076 item 7, slice S1.20 ruling Q11): the employment event kinds that wait for the approval route (document type
  # hrm.employment_event) before they apply; the others apply at once. Changing the list waits for a second person, so nobody
  # can switch approval off and then promote alone (FR-XM-32, as for merges).
  - key: hrm.employment_events.approval_kinds
    type: list
    default: ["promotion", "demotion", "transfer", "grade_change"]
    validation: {choices: [promotion, demotion, transfer, grade_change, acting, secondment, confirmation, data_correction], max_items: 8}
    layers: [tenant, company]
    requires_approval: true
    area: hr.employment
    name: {en: "Employment changes needing approval", ur: "منظوری طلب ملازمتی تبدیلیاں"}
    description: {en: "The kinds of employment change that wait for approval before they apply", ur: "ملازمتی تبدیلیوں کی وہ اقسام جو نافذ ہونے سے پہلے منظوری کا انتظار کرتی ہیں"}
    help: {en: "A change of a listed kind goes to the approval route of employment changes and applies only once approved. The person who asked and the employee can never approve it. Other kinds apply when they are saved.", ur: "فہرست میں شامل قسم کی تبدیلی ملازمتی تبدیلیوں کے منظوری کے راستے پر جاتی ہے اور منظوری کے بعد ہی نافذ ہوتی ہے۔ درخواست کرنے والا اور ملازم اسے کبھی منظور نہیں کر سکتے۔ باقی اقسام محفوظ ہوتے ہی نافذ ہو جاتی ہیں۔"}
  # S1.20b (CR-076 item 7, slice S1.20 ruling Q8): read by the separations of S1.25 (the user is disabled on the last working day,
  # open tasks reassigned first).
  - key: hrm.user_link.disable_on_separation
    type: bool
    default: true
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Disable the user at separation", ur: "علیحدگی پر صارف کو غیر فعال کریں"}
    description: {en: "The user linked to an employment is disabled when the employment ends", ur: "ملازمت ختم ہونے پر اس سے منسلک صارف غیر فعال ہو جاتا ہے"}
    help: {en: "On the last working day the linked user is disabled, after their open approval tasks are passed on. Switch it off where people keep their user after leaving (for example to see their payslips).", ur: "آخری کام کے دن منسلک صارف غیر فعال کر دیا جاتا ہے، ان کے زیرِ التوا منظوری کے کام آگے منتقل کرنے کے بعد۔ جہاں لوگ رخصت کے بعد بھی اپنا صارف رکھتے ہیں (مثلاً تنخواہ کی پرچیاں دیکھنے کے لیے) وہاں اسے بند کریں۔"}
  # S1.20c (CR-076 S1.20c detail; slice S1.20 ruling Q9, FR-XM-30): the default of each carry-over choice of a transfer between
  # companies; every transfer records all three choices on its events. The receiving company's value is the default.
  - key: hrm.transfer.carry_over.service
    type: choice
    default: "keep"
    validation: {choices: [keep, restart]}
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Service on transfer", ur: "تبادلے پر ملازمت کی مدت"}
    description: {en: "Whether a transfer from a sister company keeps the service start date or starts it again", ur: "کیا ذیلی کمپنی سے تبادلے پر ملازمت کے آغاز کی تاریخ برقرار رہتی ہے یا نئے سرے سے شروع ہوتی ہے"}
    help: {en: "The choice offered first on a transfer between companies. Keep: the new employment counts service from the first employment's service start date. Restart: from the transfer date.", ur: "کمپنیوں کے درمیان تبادلے پر پہلے پیش کیا جانے والا انتخاب۔ برقرار: نئی ملازمت پہلی ملازمت کی آغازِ مدت سے شمار ہوتی ہے۔ نیا آغاز: تبادلے کی تاریخ سے۔"}
  - key: hrm.transfer.carry_over.leave
    type: choice
    default: "carry"
    validation: {choices: [carry, encash, lapse]}
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Leave balances on transfer", ur: "تبادلے پر رخصت کا بقایا"}
    description: {en: "Whether leave balances move to the new company, are paid out or lapse on a transfer", ur: "تبادلے پر رخصت کا بقایا نئی کمپنی میں منتقل ہوتا ہے، ادا کیا جاتا ہے یا ختم ہو جاتا ہے"}
    help: {en: "The choice offered first on a transfer between companies. The leave module applies the recorded choice.", ur: "کمپنیوں کے درمیان تبادلے پر پہلے پیش کیا جانے والا انتخاب۔ رخصت کا ماڈیول درج شدہ انتخاب لاگو کرتا ہے۔"}
  - key: hrm.transfer.carry_over.loans
    type: choice
    default: "carry"
    validation: {choices: [carry, settle]}
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Loans on transfer", ur: "تبادلے پر قرضے"}
    description: {en: "Whether loan and advance balances move to the new company or are settled on a transfer", ur: "تبادلے پر قرض اور پیشگی کا بقایا نئی کمپنی میں منتقل ہوتا ہے یا طے کیا جاتا ہے"}
    help: {en: "The choice offered first on a transfer between companies. The loans module applies the recorded choice.", ur: "کمپنیوں کے درمیان تبادلے پر پہلے پیش کیا جانے والا انتخاب۔ قرضوں کا ماڈیول درج شدہ انتخاب لاگو کرتا ہے۔"}
  # S1.20c (CR-076 S1.20c detail; slice S1.20 ruling Q10). S1.23a (slice S1.23 ruling Q3): the settings hrm.probation.default_months and
  # hrm.probation.employee_types are replaced by the policy type `probation` (months, extension limit, reviewer; assignment rules choose the
  # employee types); migrate hides their definitions and keeps any stored values. The reminder lead time stays a setting.
  - key: hrm.probation.reminder_days
    type: int
    default: 14
    validation: {min: 1, max: 90}
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Probation reminder (days before)", ur: "آزمائش کی یاد دہانی (دن پہلے)"}
    description: {en: "How many days before a probation ends the manager and HR are reminded", ur: "آزمائشی مدت ختم ہونے سے کتنے دن پہلے مینیجر اور ایچ آر کو یاد دلایا جائے"}
    help: {en: "The line manager and HR administrators get a reminder this many days before the probation (or its extension) ends, so the review is done in time.", ur: "آزمائشی مدت (یا اس کی توسیع) ختم ہونے سے اتنے دن پہلے لائن مینیجر اور ایچ آر منتظمین کو یاد دہانی ملتی ہے تاکہ جائزہ بروقت ہو۔"}
  # S1.20c (CR-076 S1.20c detail; slice S1.20 Build item 13, FR-HRM-EMP-09): used when a contract has no renewal notice days.
  - key: hrm.contracts.renewal_notice_days
    type: int
    default: 30
    validation: {min: 1, max: 365}
    layers: [tenant, company]
    area: hr.employment
    name: {en: "Contract renewal reminder (days before)", ur: "معاہدے کی تجدید کی یاد دہانی (دن پہلے)"}
    description: {en: "How many days before a contract ends the manager and HR are reminded, when the contract gives no number", ur: "معاہدہ ختم ہونے سے کتنے دن پہلے مینیجر اور ایچ آر کو یاد دلایا جائے، جب معاہدے میں تعداد درج نہ ہو"}
    help: {en: "A contract's own renewal notice days come first. Without them, the line manager and HR administrators are reminded this many days before the end date.", ur: "معاہدے کے اپنے تجدیدی نوٹس کے دن پہلے آتے ہیں۔ ان کے بغیر لائن مینیجر اور ایچ آر منتظمین کو اختتامی تاریخ سے اتنے دن پہلے یاد دلایا جاتا ہے۔"}
  # S1.22a (CR-078 item 1, slice S1.22 Build item 1 and ruling Q2, FR-HRM-POS-01): how the company plans its strength. The default is
  # headcount; the size-profile presets of the first-run wizard (S1.18, D-40) write position for Mid and Enterprise (CR-078 S1.22a detail e).
  # A change is refused unless the company's assignments allow it (setting change guard of the HR module, CR-078 S1.22a detail f).
  - key: hrm.org.model
    type: choice
    default: "headcount"
    validation: {choices: [position, headcount]}
    layers: [tenant, company]
    area: hr.organization
    name: {en: "Strength planning model", ur: "افرادی قوت کی منصوبہ بندی کا طریقہ"}
    description: {en: "Whether the company plans by positions or by headcount per unit and grade", ur: "کمپنی عہدوں کے حساب سے منصوبہ بندی کرتی ہے یا ہر یونٹ اور گریڈ کی تعداد کے حساب سے"}
    help: {en: "Position: every post is a record with a budgeted FTE and nobody is placed beyond it without an approved exception. Headcount: HR sets the sanctioned number per unit and grade. A change is allowed only when it leaves no one without or with a wrong post (see the check on the positions screen).", ur: "عہدہ: ہر آسامی ایک ریکارڈ ہے جس کا بجٹ شدہ ایف ٹی ای ہوتا ہے اور منظور شدہ استثنا کے بغیر کسی کو اس سے زیادہ تعینات نہیں کیا جاتا۔ تعداد: ایچ آر ہر یونٹ اور گریڈ کی منظور شدہ تعداد طے کرتا ہے۔ تبدیلی تب ہی ممکن ہے جب وہ کسی کو بغیر آسامی کے یا غلط آسامی پر نہ چھوڑے (عہدوں کی اسکرین پر جانچ دیکھیں)۔"}
  # S1.20d (CR-076 S1.20d detail; slice S1.20 Build item 14, FR-HRM-EMP-06): changes of employees' payment accounts wait for a second
  # person (maker-checker, as for the company's own bank accounts). Changing the setting waits for a second person too, so nobody can
  # switch it off and then change an account alone (FR-XM-32).
  - key: hrm.bank_accounts.requires_approval
    type: bool
    default: true
    layers: [tenant, company]
    requires_approval: true
    area: hr.employment
    name: {en: "Approval of employee bank accounts", ur: "ملازمین کے بینک اکاؤنٹس کی منظوری"}
    description: {en: "A new or changed payment account of an employee needs a second person's approval", ur: "ملازم کے نئے یا تبدیل شدہ ادائیگی اکاؤنٹ کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "Adding, changing, ending or removing an employee's payment account waits until another person with the approval permission approves it. The person who asked can never approve it.", ur: "ملازم کا ادائیگی اکاؤنٹ شامل کرنا، تبدیل کرنا، ختم کرنا یا ہٹانا اس وقت تک رکا رہتا ہے جب تک منظوری کی اجازت والا کوئی دوسرا شخص اسے منظور نہ کرے۔ درخواست کرنے والا اسے کبھی منظور نہیں کر سکتا۔"}
  # S1.23a (CR-079 S1.23a detail; slice S1.23 ruling Q1): activating a policy version or a set of policy assignments waits for a second
  # person holding hrm.policies.approve while this is on (the customer's maker-checker choice for policies). Changing the setting waits
  # for a second person too, so nobody can switch it off and then activate alone (FR-XM-32).
  - key: hrm.policies.requires_approval
    type: bool
    default: false
    layers: [tenant, company]
    requires_approval: true
    area: hr.policies
    name: {en: "Approval of policy activations", ur: "پالیسیوں کے نفاذ کی منظوری"}
    description: {en: "Activating a policy version or policy assignments needs a second person's approval", ur: "پالیسی کے ورژن یا پالیسی تفویضات کے نفاذ کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "A version or a set of assignments is put into force only after another person with the approval permission approves it. The person who asked can never approve it.", ur: "ورژن یا تفویضات کا مجموعہ اسی وقت نافذ ہوتا ہے جب منظوری کی اجازت والا کوئی دوسرا شخص اسے منظور کرے۔ درخواست کرنے والا اسے کبھی منظور نہیں کر سکتا۔"}
  # S1.27a (CR-088; slice S1.27 Build items 1 to 5; FR-HRM-ATT-01, ATT-03, DAT-02, DAT-04). Urdu texts to be reviewed by a native speaker (R-062).
  - key: hrm.att.duplicate_window_seconds
    type: int
    default: 60
    validation: {min: 0, max: 3600}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Duplicate punch window (seconds)", ur: "دہرے اندراج کا وقفہ (سیکنڈ)"}
    description: {en: "Punches of one person in the same direction within this many seconds count once", ur: "ایک شخص کے ایک ہی سمت میں اتنے سیکنڈ کے اندر اندراج ایک بار شمار ہوتے ہیں"}
    help: {en: "A later punch of the same person and direction within this window of an earlier counted punch is kept but marked as a duplicate and never counted. 0 switches duplicate marking off.", ur: "ایک ہی شخص اور سمت کا کوئی بعد کا اندراج، پہلے شمار ہونے والے اندراج کے اس وقفے کے اندر ہو تو محفوظ رہتا ہے مگر دہرا نشان زد ہوتا ہے اور کبھی شمار نہیں ہوتا۔ 0 سے دہرے اندراج کی نشاندہی بند ہو جاتی ہے۔"}
  - key: hrm.att.future_tolerance_minutes
    type: int
    default: 5
    validation: {min: 0, max: 1440}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Future punch tolerance (minutes)", ur: "مستقبل کے اندراج کی گنجائش (منٹ)"}
    description: {en: "A punch time later than the server clock by more than this is refused", ur: "سرور کی گھڑی سے اتنے منٹ سے زیادہ آگے کا اندراج مسترد ہوتا ہے"}
    help: {en: "Device clocks drift. A punch dated further ahead of the server's time than this many minutes is refused, so nobody can punch for a time that has not come.", ur: "آلات کی گھڑیاں آگے پیچھے ہو جاتی ہیں۔ سرور کے وقت سے اتنے منٹ سے زیادہ آگے کی تاریخ والا اندراج مسترد ہوتا ہے، تاکہ کوئی ایسے وقت کا اندراج نہ کر سکے جو آیا ہی نہیں۔"}
  - key: hrm.att.event_retention_years
    type: int
    default: 7
    validation: {min: 1, max: 50}
    layers: [tenant]
    area: hr.attendance
    name: {en: "Punch retention (years)", ur: "اندراجات کی مدتِ حفاظت (سال)"}
    description: {en: "How many years attendance punches are kept before their month is removed", ur: "حاضری کے اندراجات کتنے سال محفوظ رہتے ہیں، پھر ان کا مہینہ ہٹا دیا جاتا ہے"}
    help: {en: "The purge job removes a whole month of punches only when that month ended more than this many years ago. Individual punches are never deleted. Check the legal retention period of your country before shortening it.", ur: "صفائی کا کام پورے مہینے کے اندراجات تبھی ہٹاتا ہے جب وہ مہینہ اتنے سال سے زیادہ پہلے ختم ہوا ہو۔ انفرادی اندراج کبھی نہیں مٹائے جاتے۔ مدت گھٹانے سے پہلے اپنے ملک میں قانونی مدتِ حفاظت دیکھ لیں۔"}
  - key: hrm.att.qr_window_seconds
    type: int
    default: 60
    validation: {min: 15, max: 3600}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "QR code lifetime (seconds)", ur: "کیو آر کوڈ کی مدت (سیکنڈ)"}
    description: {en: "How often the QR code of a gate changes", ur: "گیٹ کا کیو آر کوڈ کتنی دیر بعد بدلتا ہے"}
    help: {en: "The code shown at a location changes every this many seconds; a scanned code is accepted in its own period and the one before. A photograph of the code is useless, and the punch also needs the employee's own signed-in session.", ur: "کسی مقام پر دکھایا جانے والا کوڈ ہر اتنے سیکنڈ بعد بدلتا ہے؛ اسکین کیا گیا کوڈ اپنی مدت اور اس سے پہلی مدت میں قبول ہوتا ہے۔ کوڈ کی تصویر بے کار ہے، اور اندراج کے لیے ملازم کا اپنا سائن ان سیشن بھی لازمی ہے۔"}
  - key: hrm.att.allowed_networks
    type: list
    default: []
    validation: {max_items: 50}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Allowed networks for web punches", ur: "ویب اندراج کے لیے اجازت یافتہ نیٹ ورک"}
    description: {en: "Network ranges (for example 203.0.113.0/24) from which web and QR punches are accepted; empty means anywhere", ur: "وہ نیٹ ورک رینجز (مثلاً 203.0.113.0/24) جہاں سے ویب اور کیو آر اندراج قبول ہوتے ہیں؛ خالی کا مطلب کہیں سے بھی"}
    help: {en: "Leave empty to accept web punches from any network. With ranges listed, a web or QR punch from outside them is refused. Kiosk punches are not affected: the kiosk screen is a signed-in station.", ur: "خالی چھوڑیں تو ویب اندراج کسی بھی نیٹ ورک سے قبول ہوتا ہے۔ رینجز درج ہوں تو ان سے باہر سے ویب یا کیو آر اندراج مسترد ہوتا ہے۔ کیوسک اندراج پر اس کا اثر نہیں: کیوسک اسکرین سائن ان شدہ اسٹیشن ہے۔"}
  # S1.34a (CR-087; slice S1.34 Build item 3, FR-HRM-PAY-38): read by the daily job hrm.pay_cutoff_reminders.
  - key: hrm.pay.cutoff_reminder_days
    type: int
    default: 3
    validation: {min: 0, max: 31}
    layers: [tenant, company]
    area: hr.payroll
    name: {en: "Payroll cut-off reminder (days before)", ur: "پے رول کٹ آف کی یاد دہانی (دن پہلے)"}
    description: {en: "How many days before a pay period's cut-off the payroll officers are reminded", ur: "تنخواہی دور کی کٹ آف سے کتنے دن پہلے پے رول افسران کو یاد دلایا جائے"}
    help: {en: "The payroll officers get a reminder this many days before the cut-off date of each pay period that has not closed, once for each cut-off date. Zero reminds only on the cut-off day itself.", ur: "ہر اس تنخواہی دور کی کٹ آف تاریخ سے اتنے دن پہلے پے رول افسران کو یاد دہانی ملتی ہے جو ابھی بند نہیں ہوا، ہر کٹ آف تاریخ کے لیے ایک بار۔ صفر ہو تو صرف کٹ آف کے دن یاد دلایا جاتا ہے۔"}
  # S1.34b (CR-087; slice S1.34 Q5, FR-XM-32): read by the structure and compensation services. Changing the setting waits for a second
  # person too, so nobody can switch it off and then change a salary alone.
  - key: hrm.pay.change_approval
    type: bool
    default: true
    layers: [tenant, company]
    requires_approval: true
    area: hr.payroll
    name: {en: "Approval of salary structure and compensation changes", ur: "تنخواہ کے ڈھانچے اور معاوضے کی تبدیلیوں کی منظوری"}
    description: {en: "A change of a salary structure's components or of an employee's salary needs a second person's approval", ur: "تنخواہ کے ڈھانچے کے اجزا یا ملازم کی تنخواہ کی تبدیلی کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "A change of the components of a salary structure, and a new salary arrangement or revision for an employee, waits until another person with the approval permission approves it. The person who asked can never approve it. Switching this off also waits for a second person.", ur: "تنخواہ کے ڈھانچے کے اجزا کی تبدیلی اور ملازم کے لیے نیا تنخواہی انتظام یا نظرثانی اس وقت تک رکی رہتی ہے جب تک منظوری کی اجازت والا کوئی دوسرا شخص اسے منظور نہ کرے۔ درخواست کرنے والا اسے کبھی منظور نہیں کر سکتا۔ اسے بند کرنا بھی دوسرے شخص کی منظوری کا منتظر رہتا ہے۔"}
  # S1.35a (CR-093; slice S1.35 Q3, Q9): read by the payroll engine when it takes a run's snapshot (the mode is frozen in each employee's
  # snapshot, so a later change never alters a calculated run). Urdu texts to be reviewed by a native speaker (R-062).
  - key: hrm.pay.rounding_mode
    type: choice
    default: "half_away_from_zero"
    validation: {choices: [half_away_from_zero, half_even]}
    layers: [tenant, company]
    area: hr.payroll
    name: {en: "Payroll rounding", ur: "پے رول میں رقم کی گولائی"}
    description: {en: "How payroll rounds each payslip amount to the currency's smallest unit and in round() of a formula", ur: "پے رول ہر پے سلپ رقم کو کرنسی کی سب سے چھوٹی اکائی تک اور فارمولے کے round() میں کیسے گول کرتا ہے"}
    help: {en: "Half away from zero: 0.5 goes up (2.345 becomes 2.35, -2.345 becomes -2.35). Half even (banker's rounding): 0.5 goes to the even digit (2.345 becomes 2.34, 2.355 becomes 2.36). Working values inside a calculation always keep four decimals.", ur: "صفر سے دور نصف: 0.5 اوپر جاتا ہے (2.345 سے 2.35، -2.345 سے -2.35)۔ جفت نصف (بینکر کی گولائی): 0.5 جفت ہندسے کی طرف جاتا ہے (2.345 سے 2.34، 2.355 سے 2.36)۔ حساب کے اندر کام کی قدریں ہمیشہ چار اعشاریہ رکھتی ہیں۔"}
  - key: hrm.pay.chunk_size
    type: int
    default: 200
    validation: {min: 1, max: 5000}
    layers: [tenant, company]
    area: hr.payroll
    name: {en: "Payroll calculation batch size", ur: "پے رول حساب کی کھیپ کا سائز"}
    description: {en: "How many employees a payroll calculation saves together", ur: "پے رول کا حساب ایک ساتھ کتنے ملازمین محفوظ کرتا ہے"}
    help: {en: "A calculation works through the employees of a run in batches of this size; each batch is saved on its own, so a stop loses at most one batch. Larger batches are faster, smaller ones hold the database for less time.", ur: "حساب کسی رن کے ملازمین کو اس سائز کی کھیپوں میں مکمل کرتا ہے؛ ہر کھیپ الگ محفوظ ہوتی ہے، اس لیے رکنے پر زیادہ سے زیادہ ایک کھیپ ضائع ہوتی ہے۔ بڑی کھیپیں تیز ہیں، چھوٹی ڈیٹا بیس کو کم وقت کے لیے مصروف رکھتی ہیں۔"}
  # S1.27b (CR-088 S1.27b detail; FR-HRM-ATT-02, ATT-03, ATT-20). Urdu texts to be reviewed by a native speaker (R-062).
  - key: hrm.att.biometric_enabled
    type: bool
    default: false
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Biometric devices", ur: "بایومیٹرک آلات"}
    description: {en: "Allow this company to use biometric attendance devices; mapping a device user then needs the person's consent", ur: "اس کمپنی کو بایومیٹرک حاضری آلات استعمال کرنے کی اجازت؛ آلے کے صارف کو جوڑنے کے لیے پھر شخص کی رضامندی لازمی ہے"}
    help: {en: "While this is on, a device user can be mapped to an employee only after the employee's consent date is recorded. The system never reads, stores or logs fingerprint or face templates; the device keeps them. Switch off where no biometric device is used.", ur: "جب تک یہ آن ہے، آلے کے صارف کو ملازم سے تبھی جوڑا جا سکتا ہے جب ملازم کی رضامندی کی تاریخ درج ہو۔ نظام انگلیوں کے نشان یا چہرے کے ٹیمپلیٹ کبھی نہیں پڑھتا، نہ محفوظ کرتا ہے، نہ لاگ کرتا ہے؛ وہ آلے میں رہتے ہیں۔ جہاں بایومیٹرک آلہ استعمال نہیں ہوتا وہاں بند رکھیں۔"}
  - key: hrm.att.device_offline_minutes
    type: int
    default: 30
    validation: {min: 1, max: 10080}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Device offline after (minutes)", ur: "آلہ آف لائن شمار ہونے کی مدت (منٹ)"}
    description: {en: "A device not heard from for this many minutes is shown offline", ur: "جس آلے سے اتنے منٹ رابطہ نہ ہو وہ آف لائن دکھایا جاتا ہے"}
    help: {en: "Pull devices are checked by the device sync job; push devices are online while they keep sending. A device silent for longer than this is shown offline and HR sees its last error.", ur: "کھینچنے والے آلات کو آلات کی ہم آہنگی کا کام جانچتا ہے؛ دھکیلنے والے آلات بھیجتے رہنے تک آن لائن ہیں۔ اس سے زیادہ خاموش آلہ آف لائن دکھایا جاتا ہے اور ایچ آر اس کی آخری خرابی دیکھتا ہے۔"}
  - key: hrm.att.device_pull_minutes
    type: int
    default: 5
    validation: {min: 1, max: 1440}
    layers: [tenant]
    area: hr.attendance
    name: {en: "Device pull interval (minutes)", ur: "آلات سے پڑھنے کا وقفہ (منٹ)"}
    description: {en: "How often the platform reads punches from devices it connects to", ur: "پلیٹ فارم جن آلات سے رابطہ کرتا ہے ان سے اندراجات کتنی بار پڑھے"}
    help: {en: "The device sync job visits every active pull device that was last read more than this many minutes ago. A person can also ask for a device to be read now from the device list.", ur: "آلات کی ہم آہنگی کا کام ہر اس فعال آلے پر جاتا ہے جسے آخری بار اتنے منٹ سے پہلے پڑھا گیا ہو۔ آلات کی فہرست سے کوئی شخص آلے کو ابھی پڑھنے کو بھی کہہ سکتا ہے۔"}
  # S1.32a (CR-086; slice S1.32 ruling Q3): the month a leave year starts, read by the leave balances, the accrual job and the recompute; a
  # leave policy may set another month for one leave type (yearStartMonth). January by default, as the slice's recommendation says.
  - key: hrm.leave.year_start_month
    type: int
    default: 1
    validation: {min: 1, max: 12}
    layers: [tenant, company]
    area: hr.leave
    name: {en: "Leave year starts in month", ur: "رخصت کا سال اس مہینے سے شروع"}
    description: {en: "The month (1 = January to 12 = December) in which the leave year starts", ur: "وہ مہینہ (1 = جنوری سے 12 = دسمبر) جس سے رخصت کا سال شروع ہوتا ہے"}
    help: {en: "Leave balances are counted per leave year. A yearly grant is given at the start of the leave year (or on joining), and the year-end carries forward, lapses or pays out what is left. A leave policy can give one leave type a different start month. Choose it before the first leave is granted: once a company has leave entries the month can no longer change, because past balances would move to other years.", ur: "رخصت کا بقایا ہر رخصتی سال کے حساب سے گنا جاتا ہے۔ سالانہ عطا رخصتی سال کے آغاز پر (یا شمولیت پر) دی جاتی ہے، اور سال کے اختتام پر بچی ہوئی رخصت آگے منتقل، ختم یا ادا کی جاتی ہے۔ رخصت کی پالیسی کسی ایک قسم کے لیے آغاز کا دوسرا مہینہ مقرر کر سکتی ہے۔ پہلی رخصت عطا ہونے سے پہلے اسے منتخب کریں: کمپنی میں رخصت کے اندراجات ہونے کے بعد مہینہ نہیں بدلا جا سکتا، کیونکہ پچھلا بقایا دوسرے سالوں میں چلا جائے گا۔"}
  # S1.32b (CR-086 S1.32b detail; slice S1.32 ruling Q4): the hours of a working day for hourly leave when no shift names the day; 0 (the default)
  # means none is set, and hourly leave is then possible only on days a shift plans. No number is filled in for you.
  - key: hrm.leave.hours_per_day
    type: decimal
    default: 0
    validation: {min: 0, max: 24}
    layers: [tenant, company]
    area: hr.leave
    name: {en: "Hours of a working day (hourly leave)", ur: "کام کے دن کے گھنٹے (گھنٹہ وار رخصت)"}
    description: {en: "How many hours of work a day has for hourly leave on a day no shift plans; 0 means not set", ur: "جس دن کوئی شفٹ مقرر نہ ہو اس دن گھنٹہ وار رخصت کے لیے کام کے کتنے گھنٹے ہیں؛ 0 کا مطلب ہے مقرر نہیں"}
    help: {en: "Hourly leave takes at most the hours of work of its day. They come from the employee's shift on that day; this number is used only when no shift names the day. Until you set it, hourly leave is possible only on days a shift plans.", ur: "گھنٹہ وار رخصت اپنے دن کے کام کے گھنٹوں سے زیادہ نہیں ہو سکتی۔ یہ گھنٹے اس دن ملازم کی شفٹ سے آتے ہیں؛ یہ عدد صرف تب استعمال ہوتا ہے جب کوئی شفٹ اس دن کو مقرر نہ کرے۔ جب تک آپ اسے مقرر نہ کریں، گھنٹہ وار رخصت صرف انہی دنوں ممکن ہے جو کسی شفٹ میں مقرر ہوں۔"}
  # S1.33a (CR-092, slice S1.33 ruling Q1; FR-HRM-LVE-05, -15): the share of a manager's team (direct and indirect) away on one day at which the leave
  # screens warn; a warning only, never a block. 0 switches the warning off.
  - key: hrm.leave.coverage_warning_percent
    type: int
    default: 30
    validation: {min: 0, max: 100}
    layers: [tenant, company]
    area: hr.leave
    name: {en: "Team coverage warning (percent away)", ur: "ٹیم کی دستیابی کی تنبیہ (غیر حاضر فیصد)"}
    description: {en: "Warn the approver and the team calendar when this share of a team is away on one day; 0 turns the warning off", ur: "جب ایک دن ٹیم کا اتنا حصہ رخصت پر ہو تو منظور کنندہ اور ٹیم کیلنڈر کو تنبیہ دکھائیں؛ 0 تنبیہ بند کر دیتا ہے"}
    help: {en: "The share is the people of the line manager's team (direct and indirect reports) who have approved or waiting leave on that day, out of the team's members at work that period. The warning is shown on the approval card and on the team calendar; it never blocks an approval. Urdu text to be reviewed (R-062).", ur: "حصہ لائن مینیجر کی ٹیم (براہ راست اور بالواسطہ ماتحت) کے ان افراد کا ہے جن کی اس دن رخصت منظور شدہ یا منظوری کی منتظر ہے، ٹیم کے کل ارکان میں سے۔ تنبیہ منظوری کے کارڈ اور ٹیم کیلنڈر پر دکھائی جاتی ہے اور منظوری کو کبھی نہیں روکتی۔"}
  # S1.32b (CR-086 S1.32b detail; slice S1.32 Build item 12, FR-HRM-LVE-11): confirming a leave year-end waits for a second person (maker-checker).
  # Changing the setting waits for a second person too, so nobody can switch it off and then confirm alone (FR-XM-32).
  - key: hrm.leave.year_end_requires_approval
    type: bool
    default: true
    layers: [tenant, company]
    requires_approval: true
    area: hr.leave
    name: {en: "Approval of the leave year-end", ur: "رخصت کے سال کے اختتام کی منظوری"}
    description: {en: "Confirming the leave year-end needs a second person's approval", ur: "رخصت کے سال کے اختتام کی تصدیق کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "The carry-forward, payout and lapse of a leave year are posted only after another person with the approval permission approves the confirmation. The person who confirmed can never approve it. Until then the preview can still be rolled back.", ur: "رخصت کے سال کی آگے منتقلی، ادائیگی اور اختتام اسی وقت درج ہوتے ہیں جب منظوری کی اجازت والا کوئی دوسرا شخص تصدیق منظور کرے۔ تصدیق کرنے والا اسے کبھی منظور نہیں کر سکتا۔ تب تک پیش نظارہ واپس لیا جا سکتا ہے۔"}
  # S1.28b (CR-085 S1.28b detail; FR-HRM-ATT-15). Urdu texts to be reviewed by a native speaker (R-062).
  - key: hrm.att.hijri_offset_days
    type: int
    default: 0
    validation: {min: -1, max: 1}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Hijri date correction (days)", ur: "ہجری تاریخ کی تصحیح (دن)"}
    description: {en: "Moves the Hijri date shown beside each holiday by one day earlier or later, to follow the moon sighting", ur: "ہر چھٹی کے ساتھ دکھائی جانے والی ہجری تاریخ کو چاند دیکھنے کے مطابق ایک دن آگے یا پیچھے کرتا ہے"}
    help: {en: "Hijri dates are worked out from the Umm al-Qura calendar and shown for information only; they never decide pay or attendance. Where the moon is sighted a day earlier or later, choose -1 or +1. The holiday date itself is never moved.", ur: "ہجری تاریخیں ام القریٰ کیلنڈر سے نکالی جاتی ہیں اور صرف معلومات کے لیے دکھائی جاتی ہیں؛ وہ تنخواہ یا حاضری کا فیصلہ کبھی نہیں کرتیں۔ جہاں چاند ایک دن پہلے یا بعد نظر آئے وہاں -1 یا +1 چنیں۔ چھٹی کی اپنی تاریخ کبھی نہیں بدلتی۔"}
  - key: hrm.att.optional_holidays_per_year
    type: int
    default: 0
    validation: {min: 0, max: 60}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Optional holidays per year", ur: "سال میں اختیاری چھٹیاں"}
    description: {en: "How many optional holidays each employee may choose in a year; 0 means employees cannot choose any", ur: "ہر ملازم سال میں کتنی اختیاری چھٹیاں چن سکتا ہے؛ 0 کا مطلب ہے کوئی نہیں چن سکتا"}
    help: {en: "No number is filled in for you: until you set one, optional holidays on the calendar cannot be chosen. The limit counts the holidays of one calendar year for one employment.", ur: "کوئی عدد خود سے نہیں بھرا جاتا: جب تک آپ مقرر نہ کریں، کیلنڈر کی اختیاری چھٹیاں چنی نہیں جا سکتیں۔ حد ایک ملازمت کے لیے ایک کیلنڈر سال کی چھٹیوں پر گنی جاتی ہے۔"}
  - key: hrm.att.optional_holiday_cutoff_days
    type: int
    default: 0
    validation: {min: 0, max: 365}
    layers: [tenant, company]
    area: hr.attendance
    name: {en: "Optional holiday choice closes (days before)", ur: "اختیاری چھٹی کا انتخاب بند (دن پہلے)"}
    description: {en: "A choice can be made or changed until this many days before the holiday", ur: "انتخاب چھٹی سے اتنے دن پہلے تک کیا یا بدلا جا سکتا ہے"}
    help: {en: "With 0 a choice can be changed up to the day of the holiday itself. With 7 it closes seven days before. The rule applies to each holiday on its own.", ur: "0 ہو تو انتخاب چھٹی کے دن تک بدلا جا سکتا ہے۔ 7 ہو تو چھٹی سے سات دن پہلے بند ہو جاتا ہے۔ قاعدہ ہر چھٹی پر الگ لاگو ہوتا ہے۔"}
  - key: hrm.att.dashboard_refresh_seconds
    type: int
    default: 60
    validation: {min: 15, max: 3600}
    layers: [tenant]
    area: hr.attendance
    name: {en: "Attendance dashboard refresh (seconds)", ur: "حاضری ڈیش بورڈ کی تازگی (سیکنڈ)"}
    description: {en: "How often the live attendance dashboard asks the server for new counts while it is open", ur: "حاضری کا لائیو ڈیش بورڈ کھلا ہونے پر سرور سے نئی گنتی کتنی بار مانگے"}
    help: {en: "The dashboard polls the server on this interval; nothing is pushed. A shorter interval shows punches sooner and asks the server more often. The person can also refresh at once.", ur: "ڈیش بورڈ اس وقفے سے سرور سے پوچھتا ہے؛ کچھ بھیجا نہیں جاتا۔ کم وقفے سے اندراجات جلد نظر آتے ہیں اور سرور سے زیادہ بار پوچھنا پڑتا ہے۔ شخص فوراً بھی تازہ کر سکتا ہے۔"}

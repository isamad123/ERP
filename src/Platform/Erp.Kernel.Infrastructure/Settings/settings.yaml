# Kernel settings and feature flags (slice S1.09a build items 1 and 5; rulings Q10, Q11, Q14; CR-036, CR-037).
# One manifest per module. The code generator checks it and writes Access/settings.g.json, which `migrate` and
# provisioning register in cfg.settings and cfg.feature_flags. Keys start with the module id (iam, cfg, org, ...).
# Removing an entry never deletes customer values: the definition is kept and marked hidden.
# Keys of each setting: key, type (bool, int, decimal, text, choice, list, json), default, validation (min, max, choices,
# pattern, max_length, item_type, min_items, max_items), layers (pack, tenant, company, role, user), role_rule (any, all,
# lowest, highest; needed for the role layer), tighten_only (yes/no only), self_service, visible (default yes),
# requires_approval (default no), area, unit, name, description and help in English and Urdu.
# The 22 settings below came from S1.05, S1.06 and S1.08 unchanged (key, type, default, validation, layers, description);
# names and help texts were added in S1.09a. Urdu texts need review by a native speaker.
settings:
  - key: iam.password.min_length
    type: int
    default: 10
    validation: {min: 6}
    layers: [tenant]
    area: security.passwords
    unit: characters
    name: {en: "Minimum password length", ur: "پاس ورڈ کی کم از کم لمبائی"}
    description: {en: "Minimum password length", ur: "پاس ورڈ کی کم از کم لمبائی"}
    help: {en: "New and changed passwords must have at least this many characters.", ur: "نئے اور تبدیل شدہ پاس ورڈ میں کم از کم اتنے حروف ہونے چاہییں۔"}
  - key: iam.password.min_character_kinds
    type: int
    default: 3
    validation: {min: 1}
    layers: [tenant]
    area: security.passwords
    name: {en: "Character kinds", ur: "حروف کی اقسام"}
    description: {en: "Character kinds required (of upper, lower, digit, symbol)", ur: "درکار حروف کی اقسام (بڑے، چھوٹے، ہندسے، علامات میں سے)"}
    help: {en: "How many of upper-case letters, lower-case letters, digits and symbols a password must contain.", ur: "پاس ورڈ میں بڑے حروف، چھوٹے حروف، ہندسوں اور علامات میں سے کتنی اقسام ہونی چاہییں۔"}
  - key: iam.password.history_count
    type: int
    default: 5
    validation: {min: 0}
    layers: [tenant]
    area: security.passwords
    unit: passwords
    name: {en: "Password history", ur: "پاس ورڈ کی تاریخ"}
    description: {en: "Previous passwords that cannot be reused", ur: "پچھلے پاس ورڈ جو دوبارہ استعمال نہیں ہو سکتے"}
    help: {en: "A new password may not repeat any of this many previous passwords.", ur: "نیا پاس ورڈ اتنے پچھلے پاس ورڈز میں سے کسی کو دہرا نہیں سکتا۔"}
  - key: iam.password.expiry_days
    type: int
    default: 0
    validation: {min: 0}
    layers: [tenant]
    area: security.passwords
    unit: days
    name: {en: "Password expiry", ur: "پاس ورڈ کی میعاد"}
    description: {en: "Days until a password expires (0 = never)", ur: "پاس ورڈ کی میعاد کے دن (0 = کبھی نہیں)"}
    help: {en: "Users must choose a new password after this many days; 0 means passwords never expire.", ur: "صارفین کو اتنے دن بعد نیا پاس ورڈ چننا ہوگا؛ 0 کا مطلب ہے کہ پاس ورڈ کی میعاد کبھی ختم نہیں ہوتی۔"}
  - key: iam.lockout.threshold
    type: int
    default: 5
    validation: {min: 0}
    layers: [tenant]
    area: security.sign_in
    unit: attempts
    name: {en: "Lockout after failed sign-ins", ur: "ناکام سائن ان کے بعد بندش"}
    description: {en: "Failed sign-ins before the account locks (0 = never)", ur: "اکاؤنٹ بند ہونے سے پہلے ناکام سائن ان (0 = کبھی نہیں)"}
    help: {en: "The account locks after this many failed sign-ins in a row; 0 turns locking off.", ur: "مسلسل اتنی ناکام کوششوں کے بعد اکاؤنٹ بند ہو جاتا ہے؛ 0 سے بندش بند ہو جاتی ہے۔"}
  - key: iam.lockout.minutes
    type: int
    default: 15
    validation: {min: 1}
    layers: [tenant]
    area: security.sign_in
    unit: minutes
    name: {en: "Lockout duration", ur: "بندش کی مدت"}
    description: {en: "Minutes an automatic lock lasts", ur: "خودکار بندش کے منٹ"}
    help: {en: "An automatic lock ends after this many minutes; an administrator can unlock the account earlier.", ur: "خودکار بندش اتنے منٹ بعد ختم ہو جاتی ہے؛ منتظم اکاؤنٹ پہلے بھی کھول سکتا ہے۔"}
  - key: iam.session.idle_minutes
    type: int
    default: 30
    validation: {min: 5}
    layers: [tenant]
    area: security.sessions
    unit: minutes
    name: {en: "Idle timeout", ur: "غیر فعالیت کی حد"}
    description: {en: "Minutes without activity before a session ends", ur: "غیر فعالیت کے منٹ جن کے بعد سیشن ختم ہو جاتا ہے"}
    help: {en: "A session ends when it has not been used for this many minutes.", ur: "اتنے منٹ استعمال نہ ہونے پر سیشن ختم ہو جاتا ہے۔"}
  - key: iam.session.absolute_minutes
    type: int
    default: 720
    validation: {min: 5}
    layers: [tenant]
    area: security.sessions
    unit: minutes
    name: {en: "Maximum session length", ur: "سیشن کی زیادہ سے زیادہ مدت"}
    description: {en: "Maximum session length in minutes", ur: "سیشن کی زیادہ سے زیادہ مدت منٹوں میں"}
    help: {en: "A session ends this many minutes after sign-in, even while it is in use.", ur: "سائن ان کے اتنے منٹ بعد سیشن ختم ہو جاتا ہے، چاہے وہ استعمال میں ہو۔"}
  - key: iam.session.max_concurrent
    type: int
    default: 3
    validation: {min: 1}
    layers: [tenant]
    area: security.sessions
    unit: sessions
    name: {en: "Sessions at once", ur: "بیک وقت سیشن"}
    description: {en: "Sessions a user may hold at once", ur: "ایک صارف کے بیک وقت سیشن"}
    help: {en: "The most sessions one user may hold at the same time.", ur: "ایک صارف بیک وقت زیادہ سے زیادہ اتنے سیشن رکھ سکتا ہے۔"}
  - key: iam.session.remember_device_days
    type: int
    default: 0
    validation: {min: 0}
    layers: [tenant]
    area: security.sessions
    unit: days
    name: {en: "Remember trusted device", ur: "قابل اعتماد آلہ یاد رکھنا"}
    description: {en: "Days a trusted device is remembered (0 = off; used from slice S1.12)", ur: "قابل اعتماد آلہ یاد رکھنے کے دن (0 = بند)"}
    help: {en: "Days a trusted device is remembered; 0 turns this off.", ur: "قابل اعتماد آلہ کتنے دن یاد رکھا جائے؛ 0 سے یہ بند ہو جاتا ہے۔"}
  - key: iam.mfa.required
    type: bool
    default: false
    layers: [tenant, role, user]
    role_rule: any
    tighten_only: true
    area: security.mfa
    name: {en: "Second factor required", ur: "دوسرا مرحلہ لازمی"}
    description: {en: "Second factor required at sign-in", ur: "سائن ان پر دوسرا مرحلہ لازمی"}
    help: {en: "When on, users must confirm sign-in with a second factor. A role or a user's own value can only make it required, never relax the organization's rule.", ur: "فعال ہونے پر صارفین کو سائن ان کی تصدیق دوسرے مرحلے سے کرنا ہوگی۔ کوئی کردار یا صارف کی اپنی قدر اسے صرف لازمی بنا سکتی ہے، ادارے کا اصول نرم نہیں کر سکتی۔"}
  - key: iam.mfa.grace_days
    type: int
    default: 7
    validation: {min: 0}
    layers: [tenant]
    area: security.mfa
    unit: days
    name: {en: "Second factor grace period", ur: "دوسرے مرحلے کی مہلت"}
    description: {en: "Days allowed to enrol a second factor once required", ur: "لازمی ہونے کے بعد دوسرا مرحلہ اندراج کرنے کے دن"}
    help: {en: "Days a user may still sign in without a second factor after it becomes required.", ur: "لازمی ہونے کے بعد صارف کتنے دن دوسرے مرحلے کے بغیر سائن ان کر سکتا ہے۔"}
  - key: iam.mfa.recovery_codes
    type: int
    default: 10
    validation: {min: 1}
    layers: [tenant]
    area: security.mfa
    unit: codes
    name: {en: "Recovery codes", ur: "بحالی کوڈ"}
    description: {en: "Recovery codes issued at enrolment", ur: "اندراج پر جاری کردہ بحالی کوڈ"}
    help: {en: "Recovery codes given at enrolment, for use when the second-factor device is lost.", ur: "اندراج پر دیے گئے بحالی کوڈ، دوسرے مرحلے کا آلہ گم ہونے کی صورت میں استعمال کے لیے۔"}
  - key: iam.mfa.allowed_methods
    type: list
    default: ["totp"]
    layers: [tenant]
    area: security.mfa
    name: {en: "Second factor methods", ur: "دوسرے مرحلے کے طریقے"}
    description: {en: "Allowed second-factor methods", ur: "دوسرے مرحلے کے اجازت یافتہ طریقے"}
    help: {en: "The second-factor methods users may enrol: the authenticator app (totp) and, from slice S1.11b2, a code sent by e-mail (email).", ur: "وہ طریقے جن کا صارفین اندراج کر سکتے ہیں: تصدیقی ایپ (totp) اور، سلائس S1.11b2 سے، ای میل پر بھیجا گیا کوڈ (email)۔"}
  - key: iam.activation.token_hours
    type: int
    default: 72
    validation: {min: 1}
    layers: [tenant]
    area: security.accounts
    unit: hours
    name: {en: "Activation link validity", ur: "فعال کرنے کے لنک کی مدت"}
    description: {en: "Hours an account activation link stays valid", ur: "اکاؤنٹ فعال کرنے کا لنک کتنے گھنٹے درست رہتا ہے"}
    help: {en: "Hours a new user's activation link can be used.", ur: "نئے صارف کا فعال کرنے کا لنک کتنے گھنٹے استعمال ہو سکتا ہے۔"}
  - key: iam.sign_in.challenge_minutes
    type: int
    default: 10
    validation: {min: 1}
    layers: [tenant]
    area: security.sign_in
    unit: minutes
    name: {en: "Time for the next sign-in step", ur: "سائن ان کے اگلے مرحلے کا وقت"}
    description: {en: "Minutes to complete a sign-in step (second factor, password change)", ur: "سائن ان کا اگلا مرحلہ مکمل کرنے کے منٹ"}
    help: {en: "Minutes a user has to finish a sign-in step such as the second factor or a password change.", ur: "دوسرا مرحلہ یا پاس ورڈ کی تبدیلی جیسا سائن ان مرحلہ مکمل کرنے کے لیے صارف کے پاس اتنے منٹ ہیں۔"}
  - key: iam.mfa.required_for_privileged
    type: bool
    default: true
    layers: [tenant]
    area: security.mfa
    name: {en: "Second factor for privileged roles", ur: "مراعات یافتہ کرداروں کے لیے دوسرا مرحلہ"}
    description: {en: "Second factor required for users holding a privileged role", ur: "مراعات یافتہ کردار رکھنے والے صارفین کے لیے دوسرا مرحلہ لازمی"}
    help: {en: "Users holding a role with a sensitive permission must use a second factor. With two or more tenant administrators, switching it off needs the approval of a second one.", ur: "حساس اجازت والے کردار کے حامل صارفین کو دوسرا مرحلہ استعمال کرنا ہوگا۔ دو یا زیادہ ٹیننٹ ایڈمن ہوں تو اسے بند کرنے کے لیے دوسرے کی منظوری درکار ہے۔"}
  - key: iam.password.privileged_min_length
    type: int
    default: 14
    validation: {min: 6}
    layers: [tenant]
    area: security.passwords
    unit: characters
    name: {en: "Minimum password length for privileged roles", ur: "مراعات یافتہ کرداروں کے پاس ورڈ کی کم از کم لمبائی"}
    description: {en: "Minimum password length for users holding a privileged role", ur: "مراعات یافتہ کردار رکھنے والے صارفین کے پاس ورڈ کی کم از کم لمبائی"}
    help: {en: "Users holding a role with a sensitive permission need passwords at least this long.", ur: "حساس اجازت والے کردار کے حامل صارفین کے پاس ورڈ کم از کم اتنے لمبے ہونے چاہییں۔"}
  - key: iam.maker_checker.sensitive_roles
    type: bool
    default: true
    layers: [tenant]
    area: security.approvals
    name: {en: "Approval of sensitive role changes", ur: "حساس کرداروں میں تبدیلی کی منظوری"}
    description: {en: "Changes to roles with sensitive permissions need a second person's approval", ur: "حساس اجازتوں والے کرداروں میں تبدیلی کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "Changes to, and assignments of, roles with sensitive permissions wait for a second person's approval. With two or more tenant administrators, switching it off needs the approval of a second one.", ur: "حساس اجازتوں والے کرداروں میں تبدیلی اور ان کی تفویض دوسرے شخص کی منظوری کی منتظر رہتی ہے۔ دو یا زیادہ ٹیننٹ ایڈمن ہوں تو اسے بند کرنے کے لیے دوسرے کی منظوری درکار ہے۔"}
  - key: iam.maker_checker.expiry_days
    type: int
    default: 7
    validation: {min: 1}
    layers: [tenant]
    area: security.approvals
    unit: days
    name: {en: "Approval waiting time", ur: "منظوری کے انتظار کی مدت"}
    description: {en: "Days a change waiting for approval stays open", ur: "منظوری کی منتظر تبدیلی کتنے دن کھلی رہتی ہے"}
    help: {en: "A change waiting for approval expires after this many days.", ur: "منظوری کی منتظر تبدیلی اتنے دن بعد ختم ہو جاتی ہے۔"}
  - key: cfg.numbering.fiscal_year_start_month
    type: int
    default: 1
    validation: {min: 1, max: 12}
    layers: [tenant, company]
    area: numbering
    unit: month
    name: {en: "Fiscal year start month", ur: "مالی سال کا پہلا مہینہ"}
    description: {en: "Month the fiscal year starts in (1 = January); used by fiscal-year numbering", ur: "مالی سال کس مہینے سے شروع ہوتا ہے (1 = جنوری)؛ مالی سال کی نمبرنگ کے لیے"}
    help: {en: "Month the fiscal year starts in (1 = January). Without a value, the default of the company's country applies.", ur: "مالی سال کس مہینے سے شروع ہوتا ہے (1 = جنوری)۔ قدر نہ ہونے پر کمپنی کے ملک کا طے شدہ مہینہ لاگو ہوتا ہے۔"}
  - key: org.time_zone
    type: text
    default: "Asia/Karachi"
    layers: [tenant, company]
    area: organization
    name: {en: "Time zone", ur: "ٹائم زون"}
    description: {en: "Time zone of the company (IANA name, for example Asia/Karachi)", ur: "کمپنی کا ٹائم زون (IANA نام، مثلاً Asia/Karachi)"}
    help: {en: "IANA time zone name, for example Asia/Karachi. It decides which day \"today\" is. Without a value, the default of the company's country applies.", ur: "IANA ٹائم زون کا نام، مثلاً Asia/Karachi۔ اسی سے طے ہوتا ہے کہ \"آج\" کون سا دن ہے۔ قدر نہ ہونے پر کمپنی کے ملک کا طے شدہ ٹائم زون لاگو ہوتا ہے۔"}
  # Slice S1.09b (ruling Q7, FR-ADM-USR-08 "configurable thresholds"): when a licence limit warns before its hard stop.
  - key: cfg.limits.warning_percent
    type: int
    default: 90
    validation: {min: 50, max: 99}
    layers: [tenant]
    area: licence
    unit: percent
    name: {en: "Licence limit warning", ur: "لائسنس کی حد کی تنبیہ"}
    description: {en: "Percentage of a licence limit at which administrators are warned", ur: "لائسنس کی حد کا وہ فیصد جس پر منتظمین کو تنبیہ کی جاتی ہے"}
    help: {en: "When users, concurrent users or companies reach this percentage of the licence limit, a warning is shown and announced once. At 100 percent new ones are refused.", ur: "جب صارفین، بیک وقت صارفین یا کمپنیاں لائسنس کی حد کے اس فیصد تک پہنچیں تو ایک بار تنبیہ دکھائی اور بھیجی جاتی ہے۔ 100 فیصد پر نئے رد کر دیے جاتے ہیں۔"}

  # Slice S1.10b (CR-041 settings; rulings Q8, Q9, Q12, Q16): workflow time limits, the working week, delegation and bulk approval.
  - key: wf.escalation.default_working_days
    type: int
    default: 2
    validation: {min: 1, max: 365}
    layers: [tenant, company]
    area: workflow
    unit: working days
    name: {en: "Approval time limit", ur: "منظوری کی مقررہ مدت"}
    description: {en: "Working days an approver has before a task moves up a level, when the route sets none", ur: "کام کے وہ دن جن کے بعد کام اگلے درجے پر چلا جاتا ہے، جب راستہ کوئی مدت مقرر نہ کرے"}
    help: {en: "When a route step sets no time limit, a task moves to the next level after this many working days. Weekly off days and company holidays are not counted. Nothing is ever approved automatically.", ur: "جب راستے کا مرحلہ کوئی مدت مقرر نہ کرے تو کام اتنے کام کے دنوں کے بعد اگلے درجے پر چلا جاتا ہے۔ ہفتہ وار چھٹیاں اور کمپنی کی تعطیلات شمار نہیں ہوتیں۔ کوئی چیز کبھی خود بخود منظور نہیں ہوتی۔"}
  - key: org.weekly_off_days
    type: list
    default: ["saturday", "sunday"]
    validation: {choices: [monday, tuesday, wednesday, thursday, friday, saturday, sunday], max_items: 6}
    layers: [tenant, company]
    area: organization
    name: {en: "Weekly off days", ur: "ہفتہ وار چھٹیاں"}
    description: {en: "Days of the week the company does not work (for approval time limits)", ur: "ہفتے کے وہ دن جن میں کمپنی کام نہیں کرتی (منظوری کی مدت کے لیے)"}
    help: {en: "Approval time limits count working days only; these days and the company's holidays are skipped. Employee rosters keep their own patterns.", ur: "منظوری کی مدت میں صرف کام کے دن شمار ہوتے ہیں؛ یہ دن اور کمپنی کی تعطیلات چھوڑ دی جاتی ہیں۔ ملازمین کے روسٹر اپنے الگ نظام رکھتے ہیں۔"}
  - key: wf.delegation.max_days
    type: int
    default: 90
    validation: {min: 1, max: 365}
    layers: [tenant]
    area: workflow
    unit: days
    name: {en: "Longest delegation", ur: "طویل ترین تفویض"}
    description: {en: "Most days one delegation of approvals may cover", ur: "منظوریوں کی ایک تفویض زیادہ سے زیادہ کتنے دنوں پر محیط ہو سکتی ہے"}
    help: {en: "A user handing their approvals to someone else (for example while on leave) may choose at most this many days at a time.", ur: "اپنی منظوریاں کسی اور کو سونپنے والا صارف (مثلاً چھٹی کے دوران) ایک وقت میں زیادہ سے زیادہ اتنے دن چن سکتا ہے۔"}
  - key: wf.bulk_approval.max_items
    type: int
    default: 100
    validation: {min: 1, max: 500}
    layers: [tenant]
    area: workflow
    unit: tasks
    name: {en: "Bulk approval size", ur: "اجتماعی منظوری کی حد"}
    description: {en: "Most tasks approved in one bulk approval", ur: "ایک اجتماعی منظوری میں زیادہ سے زیادہ کام"}
    help: {en: "An approver may approve at most this many tasks in one go, and only where the document type and the route step allow it. Each task is checked on its own.", ur: "منظور کنندہ ایک بار میں زیادہ سے زیادہ اتنے کام منظور کر سکتا ہے، اور صرف وہاں جہاں دستاویز کی قسم اور راستے کا مرحلہ اجازت دیں۔ ہر کام کی الگ جانچ ہوتی ہے۔"}
  # Slice S1.11a (ruling Q9, P4): the unusual-access alert of FR-HRM-PRV-05.
  - key: aud.alerts.sensitive_people_per_hour
    type: int
    default: 50
    validation: {min: 1, max: 100000}
    layers: [tenant]
    area: security.audit
    unit: records per hour
    name: {en: "Unusual access alert", ur: "غیر معمولی رسائی کا انتباہ"}
    description: {en: "Sensitive records one user may open or export in an hour before administrators are alerted", ur: "حساس ریکارڈ جو ایک صارف ایک گھنٹے میں کھول یا برآمد کر سکتا ہے، اس سے زیادہ پر منتظمین کو انتباہ"}
    help: {en: "When one user opens or exports the salary, personal or other sensitive data of more than this many different records within one hour, Tenant Admins and Auditors are alerted. Exports count every exported row.", ur: "جب ایک صارف ایک گھنٹے کے اندر اس سے زیادہ مختلف ریکارڈز کی تنخواہ، ذاتی یا دیگر حساس معلومات کھولے یا برآمد کرے تو ٹیننٹ منتظمین اور آڈیٹرز کو انتباہ بھیجا جاتا ہے۔ برآمد میں ہر برآمد شدہ قطار شمار ہوتی ہے۔"}
  # Slice S1.11a (P3; spec 03 section 8, FR-HRM-DAT-04): how long finished background runs are kept.
  - key: job.retention.run_days
    type: int
    default: 30
    validation: {min: 7, max: 3660}
    layers: [tenant]
    area: jobs
    unit: days
    name: {en: "Keep finished background runs", ur: "مکمل شدہ پس منظر کے کام محفوظ رکھنا"}
    description: {en: "Days a finished background run and its log stay in the job centre", ur: "دن جن تک مکمل شدہ پس منظر کا کام اور اس کا ریکارڈ جاب سینٹر میں رہتا ہے"}
    help: {en: "Runs that succeeded, failed or were cancelled are removed from the job centre after this many days by the daily clean-up.", ur: "کامیاب، ناکام یا منسوخ شدہ کام روزانہ کی صفائی کے ذریعے اتنے دن بعد جاب سینٹر سے ہٹا دیے جاتے ہیں۔"}

  # Slice S1.11b2 (KRN-NTF-05, KRN-NTF-07, ruling Q10): sender identity and sending rate of e-mail notifications.
  - key: ntf.email.sender_name
    type: text
    default: ""
    validation: {max_length: 100}
    layers: [tenant]
    area: notifications
    name: {en: "E-mail sender name", ur: "ای میل بھیجنے والے کا نام"}
    description: {en: "Name shown as the sender of notification e-mails", ur: "اطلاعی ای میلز میں بھیجنے والے کے طور پر دکھایا جانے والا نام"}
    help: {en: "For example your company name. The sender address itself is set by the operator after the domain checks.", ur: "مثلاً آپ کی کمپنی کا نام۔ بھیجنے کا پتا ڈومین کی جانچ کے بعد آپریٹر طے کرتا ہے۔"}
  - key: ntf.email.reply_to
    type: text
    default: ""
    validation: {max_length: 254, pattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"}
    layers: [tenant]
    area: notifications
    name: {en: "Reply-to address", ur: "جواب کا پتا"}
    description: {en: "Address that receives replies to notification e-mails", ur: "وہ پتا جس پر اطلاعی ای میلز کے جوابات آتے ہیں"}
    help: {en: "Leave empty when replies are not wanted.", ur: "اگر جوابات نہیں چاہییں تو خالی چھوڑ دیں۔"}
  - key: ntf.email.per_minute
    type: int
    default: 60
    validation: {min: 1, max: 1000}
    layers: [tenant]
    area: notifications
    unit: e-mails per minute
    name: {en: "E-mails per minute", ur: "فی منٹ ای میلز"}
    description: {en: "Most notification e-mails sent in one minute", ur: "ایک منٹ میں زیادہ سے زیادہ اطلاعی ای میلز"}
    help: {en: "E-mails above this number wait for the next minute.", ur: "اس تعداد سے زیادہ ای میلز اگلے منٹ کا انتظار کرتی ہیں۔"}

  # Slice S1.11b2 (KRN-IAM-01, KRN-IAM-02, ruling Q16): password reset links and e-mail codes.
  - key: iam.password_reset.minutes
    type: int
    default: 60
    validation: {min: 5, max: 1440}
    layers: [tenant]
    area: security.accounts
    unit: minutes
    name: {en: "Password reset link validity", ur: "پاس ورڈ ری سیٹ لنک کی مدت"}
    description: {en: "Minutes a password reset link stays valid", ur: "پاس ورڈ ری سیٹ لنک کتنے منٹ درست رہتا ہے"}
    help: {en: "A reset link works once, within this many minutes.", ur: "ری سیٹ لنک صرف ایک بار، اتنے منٹ کے اندر کام کرتا ہے۔"}
  - key: iam.password_reset.per_hour
    type: int
    default: 5
    validation: {min: 1, max: 50}
    layers: [tenant]
    area: security.accounts
    name: {en: "Reset requests per hour", ur: "فی گھنٹہ ری سیٹ درخواستیں"}
    description: {en: "Most password reset e-mails sent to one account in an hour", ur: "ایک گھنٹے میں ایک اکاؤنٹ کو زیادہ سے زیادہ پاس ورڈ ری سیٹ ای میلز"}
    help: {en: "Further requests in the same hour get the same answer but no e-mail.", ur: "اسی گھنٹے میں مزید درخواستوں کو وہی جواب ملتا ہے مگر ای میل نہیں جاتی۔"}
  - key: iam.email_code.minutes
    type: int
    default: 10
    validation: {min: 1, max: 60}
    layers: [tenant]
    area: security.mfa
    unit: minutes
    name: {en: "E-mail code validity", ur: "ای میل کوڈ کی مدت"}
    description: {en: "Minutes a sign-in code sent by e-mail stays valid", ur: "ای میل پر بھیجا گیا سائن ان کوڈ کتنے منٹ درست رہتا ہے"}
    help: {en: "A code works once, within this many minutes.", ur: "کوڈ صرف ایک بار، اتنے منٹ کے اندر کام کرتا ہے۔"}
  - key: iam.email_code.max_attempts
    type: int
    default: 5
    validation: {min: 1, max: 10}
    layers: [tenant]
    area: security.mfa
    name: {en: "E-mail code tries", ur: "ای میل کوڈ کی کوششیں"}
    description: {en: "Wrong entries after which an e-mail code stops working", ur: "غلط اندراجات جن کے بعد ای میل کوڈ کام کرنا چھوڑ دیتا ہے"}
    help: {en: "After this many wrong entries the person asks for a new code.", ur: "اتنی غلط کوششوں کے بعد صارف کو نیا کوڈ منگوانا ہوتا ہے۔"}

  # Slice S1.11b1 (HRM-NTF-09, ruling Q11): how long in-app notification items stay in the centre.
  - key: ntf.in_app.retention_days
    type: int
    default: 180
    validation: {min: 30, max: 3660}
    layers: [tenant]
    area: notifications
    unit: days
    name: {en: "Keep notification items", ur: "اطلاعات کے اندراجات محفوظ رکھنا"}
    description: {en: "Days a notification item stays in a person's notification centre", ur: "دن جن تک اطلاع کا اندراج کسی شخص کے اطلاعاتی مرکز میں رہتا ہے"}
    help: {en: "The daily clean-up removes notification items older than this many days. Approvals and decisions are always kept in the workflow history.", ur: "روزانہ کی صفائی اتنے دن سے پرانے اطلاعی اندراجات ہٹا دیتی ہے۔ منظوریاں اور فیصلے ورک فلو کی تاریخ میں ہمیشہ محفوظ رہتے ہیں۔"}

  # Slice S1.11c1 (KRN-DOC-01, KRN-DOC-02, KRN-DOC-08, rulings Q21, Q22, Q25): file scanning, upload limits and expiry reminders.
  - key: doc.scan.mode
    type: text
    default: "required"
    validation: {choices: [required, "off"]}
    layers: [tenant]
    area: documents
    name: {en: "Virus scanning of files", ur: "فائلوں کی وائرس اسکیننگ"}
    description: {en: "Whether uploaded files must be scanned before they can be downloaded", ur: "کیا اپ لوڈ کی گئی فائلیں ڈاؤن لوڈ سے پہلے اسکین ہونا ضروری ہیں"}
    help: {en: "required: a file waits until it is scanned clean (and keeps waiting if the scanner is down). off: files are available at once and the health page shows them as not scanned.", ur: "required: فائل اسکین ہو کر صاف نکلنے تک انتظار کرتی ہے (اور اسکینر بند ہو تو انتظار کرتی رہتی ہے)۔ off: فائلیں فوراً دستیاب ہوتی ہیں اور ہیلتھ صفحہ انہیں غیر اسکین شدہ دکھاتا ہے۔"}
  - key: doc.upload.max_mb
    type: int
    default: 20
    validation: {min: 1, max: 200}
    layers: [tenant]
    area: documents
    unit: MB
    name: {en: "Largest file", ur: "سب سے بڑی فائل"}
    description: {en: "Most megabytes one uploaded file may have", ur: "ایک اپ لوڈ کی گئی فائل کے زیادہ سے زیادہ میگا بائٹس"}
    help: {en: "Larger files are refused.", ur: "اس سے بڑی فائلیں مسترد کر دی جاتی ہیں۔"}
  - key: doc.upload.allowed_types
    type: list
    default: ["pdf", "jpeg", "png", "word", "excel", "text", "csv"]
    validation: {choices: [pdf, jpeg, png, word, excel, text, csv], max_items: 7}
    layers: [tenant]
    area: documents
    name: {en: "Allowed file types", ur: "اجازت یافتہ فائل کی اقسام"}
    description: {en: "The kinds of file that may be attached", ur: "فائل کی وہ اقسام جو منسلک کی جا سکتی ہیں"}
    help: {en: "The kind is checked from the content of the file, not from its name.", ur: "قسم فائل کے مواد سے جانچی جاتی ہے، اس کے نام سے نہیں۔"}
  - key: doc.expiry.reminder_days
    type: list
    default: ["30", "7", "0"]
    validation: {max_items: 6}
    layers: [tenant]
    area: documents
    name: {en: "Expiry reminders (days before)", ur: "میعاد ختم ہونے کی یاد دہانی (دن پہلے)"}
    description: {en: "How many days before a document expires reminders are sent", ur: "دستاویز کی میعاد ختم ہونے سے کتنے دن پہلے یاد دہانی بھیجی جائے"}
    help: {en: "For example 30, 7 and 0 (the day of expiry). Each reminder goes to the person who uploaded the file.", ur: "مثلاً 30، 7 اور 0 (میعاد ختم ہونے کا دن)۔ ہر یاد دہانی فائل اپ لوڈ کرنے والے کو جاتی ہے۔"}

  # Slice S1.11c2 (KRN-DOC-05, ruling Q17): limits of document templates and printed documents.
  - key: doc.template.max_kb
    type: int
    default: 200
    validation: {min: 10, max: 2000}
    layers: [tenant]
    area: documents
    unit: KB
    name: {en: "Largest template", ur: "سب سے بڑا سانچہ"}
    description: {en: "Most kilobytes the text of one document template may have", ur: "ایک دستاویزی سانچے کے متن کے زیادہ سے زیادہ کلو بائٹس"}
    help: {en: "A longer template is refused when it is saved.", ur: "اس سے لمبا سانچہ محفوظ کرتے وقت مسترد کر دیا جاتا ہے۔"}
  - key: doc.pdf.max_pages
    type: int
    default: 50
    validation: {min: 1, max: 500}
    layers: [tenant]
    area: documents
    name: {en: "Most pages in a printed document", ur: "چھپے ہوئے دستاویز میں زیادہ سے زیادہ صفحات"}
    description: {en: "A generated PDF with more pages than this is refused", ur: "اس سے زیادہ صفحات والا تیار شدہ PDF مسترد کر دیا جاتا ہے"}
    help: {en: "Protects the server from a template that never ends.", ur: "ایسے سانچے سے سرور کی حفاظت کرتا ہے جو کبھی ختم نہیں ہوتا۔"}

# Release 1.0 has no requirement that needs a specific flag yet (ruling Q14): the mechanism ships with an empty list.
flags: []

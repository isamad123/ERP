# Kernel settings and feature flags (slice S1.09a build items 1 and 5; rulings Q10, Q11, Q14; CR-036, CR-037).
# One manifest per module. The code generator checks it and writes Access/settings.g.json, which `migrate` and
# provisioning register in cfg.settings and cfg.feature_flags. Keys start with the module id (iam, cfg, org, ...).
# Removing an entry never deletes customer values: the definition is kept and marked hidden.
# Keys of each setting: key, type (bool, int, decimal, text, choice, list, json), default, validation (min, max, choices,
# pattern, max_length, item_type, min_items, max_items), layers (pack, tenant, company, role, user), role_rule (any, all,
# lowest, highest; needed for the role layer), tighten_only (yes/no only), self_service, visible (default yes),
# requires_approval (default no), area, unit, name, description and help in English and Urdu.
# The 22 settings below came from S1.05, S1.06 and S1.08 unchanged (key, type, default, validation, layers, description);
# names and help texts were added in S1.09a. Urdu texts need review by a native speaker.
settings:
  - key: iam.password.min_length
    type: int
    default: 10
    validation: {min: 6}
    layers: [tenant]
    area: security.passwords
    unit: characters
    name: {en: "Minimum password length", ur: "پاس ورڈ کی کم از کم لمبائی"}
    description: {en: "Minimum password length", ur: "پاس ورڈ کی کم از کم لمبائی"}
    help: {en: "New and changed passwords must have at least this many characters.", ur: "نئے اور تبدیل شدہ پاس ورڈ میں کم از کم اتنے حروف ہونے چاہییں۔"}
  - key: iam.password.min_character_kinds
    type: int
    default: 3
    validation: {min: 1}
    layers: [tenant]
    area: security.passwords
    name: {en: "Character kinds", ur: "حروف کی اقسام"}
    description: {en: "Character kinds required (of upper, lower, digit, symbol)", ur: "درکار حروف کی اقسام (بڑے، چھوٹے، ہندسے، علامات میں سے)"}
    help: {en: "How many of upper-case letters, lower-case letters, digits and symbols a password must contain.", ur: "پاس ورڈ میں بڑے حروف، چھوٹے حروف، ہندسوں اور علامات میں سے کتنی اقسام ہونی چاہییں۔"}
  - key: iam.password.history_count
    type: int
    default: 5
    validation: {min: 0}
    layers: [tenant]
    area: security.passwords
    unit: passwords
    name: {en: "Password history", ur: "پاس ورڈ کی تاریخ"}
    description: {en: "Previous passwords that cannot be reused", ur: "پچھلے پاس ورڈ جو دوبارہ استعمال نہیں ہو سکتے"}
    help: {en: "A new password may not repeat any of this many previous passwords.", ur: "نیا پاس ورڈ اتنے پچھلے پاس ورڈز میں سے کسی کو دہرا نہیں سکتا۔"}
  - key: iam.password.expiry_days
    type: int
    default: 0
    validation: {min: 0}
    layers: [tenant]
    area: security.passwords
    unit: days
    name: {en: "Password expiry", ur: "پاس ورڈ کی میعاد"}
    description: {en: "Days until a password expires (0 = never)", ur: "پاس ورڈ کی میعاد کے دن (0 = کبھی نہیں)"}
    help: {en: "Users must choose a new password after this many days; 0 means passwords never expire.", ur: "صارفین کو اتنے دن بعد نیا پاس ورڈ چننا ہوگا؛ 0 کا مطلب ہے کہ پاس ورڈ کی میعاد کبھی ختم نہیں ہوتی۔"}
  - key: iam.lockout.threshold
    type: int
    default: 5
    validation: {min: 0}
    layers: [tenant]
    area: security.sign_in
    unit: attempts
    name: {en: "Lockout after failed sign-ins", ur: "ناکام سائن ان کے بعد بندش"}
    description: {en: "Failed sign-ins before the account locks (0 = never)", ur: "اکاؤنٹ بند ہونے سے پہلے ناکام سائن ان (0 = کبھی نہیں)"}
    help: {en: "The account locks after this many failed sign-ins in a row; 0 turns locking off.", ur: "مسلسل اتنی ناکام کوششوں کے بعد اکاؤنٹ بند ہو جاتا ہے؛ 0 سے بندش بند ہو جاتی ہے۔"}
  - key: iam.lockout.minutes
    type: int
    default: 15
    validation: {min: 1}
    layers: [tenant]
    area: security.sign_in
    unit: minutes
    name: {en: "Lockout duration", ur: "بندش کی مدت"}
    description: {en: "Minutes an automatic lock lasts", ur: "خودکار بندش کے منٹ"}
    help: {en: "An automatic lock ends after this many minutes; an administrator can unlock the account earlier.", ur: "خودکار بندش اتنے منٹ بعد ختم ہو جاتی ہے؛ منتظم اکاؤنٹ پہلے بھی کھول سکتا ہے۔"}
  - key: iam.session.idle_minutes
    type: int
    default: 30
    validation: {min: 5}
    layers: [tenant]
    area: security.sessions
    unit: minutes
    name: {en: "Idle timeout", ur: "غیر فعالیت کی حد"}
    description: {en: "Minutes without activity before a session ends", ur: "غیر فعالیت کے منٹ جن کے بعد سیشن ختم ہو جاتا ہے"}
    help: {en: "A session ends when it has not been used for this many minutes.", ur: "اتنے منٹ استعمال نہ ہونے پر سیشن ختم ہو جاتا ہے۔"}
  - key: iam.session.absolute_minutes
    type: int
    default: 720
    validation: {min: 5}
    layers: [tenant]
    area: security.sessions
    unit: minutes
    name: {en: "Maximum session length", ur: "سیشن کی زیادہ سے زیادہ مدت"}
    description: {en: "Maximum session length in minutes", ur: "سیشن کی زیادہ سے زیادہ مدت منٹوں میں"}
    help: {en: "A session ends this many minutes after sign-in, even while it is in use.", ur: "سائن ان کے اتنے منٹ بعد سیشن ختم ہو جاتا ہے، چاہے وہ استعمال میں ہو۔"}
  - key: iam.session.max_concurrent
    type: int
    default: 3
    validation: {min: 1}
    layers: [tenant]
    area: security.sessions
    unit: sessions
    name: {en: "Sessions at once", ur: "بیک وقت سیشن"}
    description: {en: "Sessions a user may hold at once", ur: "ایک صارف کے بیک وقت سیشن"}
    help: {en: "The most sessions one user may hold at the same time.", ur: "ایک صارف بیک وقت زیادہ سے زیادہ اتنے سیشن رکھ سکتا ہے۔"}
  - key: iam.session.remember_device_days
    type: int
    default: 0
    validation: {min: 0}
    layers: [tenant]
    area: security.sessions
    unit: days
    name: {en: "Remember trusted device", ur: "قابل اعتماد آلہ یاد رکھنا"}
    description: {en: "Days a trusted device is remembered (0 = off; used from slice S1.12)", ur: "قابل اعتماد آلہ یاد رکھنے کے دن (0 = بند)"}
    help: {en: "Days a trusted device is remembered; 0 turns this off.", ur: "قابل اعتماد آلہ کتنے دن یاد رکھا جائے؛ 0 سے یہ بند ہو جاتا ہے۔"}
  - key: iam.mfa.required
    type: bool
    default: false
    layers: [tenant, role, user]
    role_rule: any
    tighten_only: true
    area: security.mfa
    name: {en: "Second factor required", ur: "دوسرا مرحلہ لازمی"}
    description: {en: "Second factor required at sign-in", ur: "سائن ان پر دوسرا مرحلہ لازمی"}
    help: {en: "When on, users must confirm sign-in with a second factor. A role or a user's own value can only make it required, never relax the organization's rule.", ur: "فعال ہونے پر صارفین کو سائن ان کی تصدیق دوسرے مرحلے سے کرنا ہوگی۔ کوئی کردار یا صارف کی اپنی قدر اسے صرف لازمی بنا سکتی ہے، ادارے کا اصول نرم نہیں کر سکتی۔"}
  - key: iam.mfa.grace_days
    type: int
    default: 7
    validation: {min: 0}
    layers: [tenant]
    area: security.mfa
    unit: days
    name: {en: "Second factor grace period", ur: "دوسرے مرحلے کی مہلت"}
    description: {en: "Days allowed to enrol a second factor once required", ur: "لازمی ہونے کے بعد دوسرا مرحلہ اندراج کرنے کے دن"}
    help: {en: "Days a user may still sign in without a second factor after it becomes required.", ur: "لازمی ہونے کے بعد صارف کتنے دن دوسرے مرحلے کے بغیر سائن ان کر سکتا ہے۔"}
  - key: iam.mfa.recovery_codes
    type: int
    default: 10
    validation: {min: 1}
    layers: [tenant]
    area: security.mfa
    unit: codes
    name: {en: "Recovery codes", ur: "بحالی کوڈ"}
    description: {en: "Recovery codes issued at enrolment", ur: "اندراج پر جاری کردہ بحالی کوڈ"}
    help: {en: "Recovery codes given at enrolment, for use when the second-factor device is lost.", ur: "اندراج پر دیے گئے بحالی کوڈ، دوسرے مرحلے کا آلہ گم ہونے کی صورت میں استعمال کے لیے۔"}
  - key: iam.mfa.allowed_methods
    type: list
    default: ["totp"]
    layers: [tenant]
    area: security.mfa
    name: {en: "Second factor methods", ur: "دوسرے مرحلے کے طریقے"}
    description: {en: "Allowed second-factor methods", ur: "دوسرے مرحلے کے اجازت یافتہ طریقے"}
    help: {en: "The second-factor methods users may enrol; in this release the authenticator app (totp).", ur: "وہ طریقے جن کا صارفین اندراج کر سکتے ہیں؛ اس ریلیز میں تصدیقی ایپ (totp)۔"}
  - key: iam.activation.token_hours
    type: int
    default: 72
    validation: {min: 1}
    layers: [tenant]
    area: security.accounts
    unit: hours
    name: {en: "Activation link validity", ur: "فعال کرنے کے لنک کی مدت"}
    description: {en: "Hours an account activation link stays valid", ur: "اکاؤنٹ فعال کرنے کا لنک کتنے گھنٹے درست رہتا ہے"}
    help: {en: "Hours a new user's activation link can be used.", ur: "نئے صارف کا فعال کرنے کا لنک کتنے گھنٹے استعمال ہو سکتا ہے۔"}
  - key: iam.sign_in.challenge_minutes
    type: int
    default: 10
    validation: {min: 1}
    layers: [tenant]
    area: security.sign_in
    unit: minutes
    name: {en: "Time for the next sign-in step", ur: "سائن ان کے اگلے مرحلے کا وقت"}
    description: {en: "Minutes to complete a sign-in step (second factor, password change)", ur: "سائن ان کا اگلا مرحلہ مکمل کرنے کے منٹ"}
    help: {en: "Minutes a user has to finish a sign-in step such as the second factor or a password change.", ur: "دوسرا مرحلہ یا پاس ورڈ کی تبدیلی جیسا سائن ان مرحلہ مکمل کرنے کے لیے صارف کے پاس اتنے منٹ ہیں۔"}
  - key: iam.mfa.required_for_privileged
    type: bool
    default: true
    layers: [tenant]
    area: security.mfa
    name: {en: "Second factor for privileged roles", ur: "مراعات یافتہ کرداروں کے لیے دوسرا مرحلہ"}
    description: {en: "Second factor required for users holding a privileged role", ur: "مراعات یافتہ کردار رکھنے والے صارفین کے لیے دوسرا مرحلہ لازمی"}
    help: {en: "Users holding a role with a sensitive permission must use a second factor. With two or more tenant administrators, switching it off needs the approval of a second one.", ur: "حساس اجازت والے کردار کے حامل صارفین کو دوسرا مرحلہ استعمال کرنا ہوگا۔ دو یا زیادہ ٹیننٹ ایڈمن ہوں تو اسے بند کرنے کے لیے دوسرے کی منظوری درکار ہے۔"}
  - key: iam.password.privileged_min_length
    type: int
    default: 14
    validation: {min: 6}
    layers: [tenant]
    area: security.passwords
    unit: characters
    name: {en: "Minimum password length for privileged roles", ur: "مراعات یافتہ کرداروں کے پاس ورڈ کی کم از کم لمبائی"}
    description: {en: "Minimum password length for users holding a privileged role", ur: "مراعات یافتہ کردار رکھنے والے صارفین کے پاس ورڈ کی کم از کم لمبائی"}
    help: {en: "Users holding a role with a sensitive permission need passwords at least this long.", ur: "حساس اجازت والے کردار کے حامل صارفین کے پاس ورڈ کم از کم اتنے لمبے ہونے چاہییں۔"}
  - key: iam.maker_checker.sensitive_roles
    type: bool
    default: true
    layers: [tenant]
    area: security.approvals
    name: {en: "Approval of sensitive role changes", ur: "حساس کرداروں میں تبدیلی کی منظوری"}
    description: {en: "Changes to roles with sensitive permissions need a second person's approval", ur: "حساس اجازتوں والے کرداروں میں تبدیلی کے لیے دوسرے شخص کی منظوری درکار"}
    help: {en: "Changes to, and assignments of, roles with sensitive permissions wait for a second person's approval. With two or more tenant administrators, switching it off needs the approval of a second one.", ur: "حساس اجازتوں والے کرداروں میں تبدیلی اور ان کی تفویض دوسرے شخص کی منظوری کی منتظر رہتی ہے۔ دو یا زیادہ ٹیننٹ ایڈمن ہوں تو اسے بند کرنے کے لیے دوسرے کی منظوری درکار ہے۔"}
  - key: iam.maker_checker.expiry_days
    type: int
    default: 7
    validation: {min: 1}
    layers: [tenant]
    area: security.approvals
    unit: days
    name: {en: "Approval waiting time", ur: "منظوری کے انتظار کی مدت"}
    description: {en: "Days a change waiting for approval stays open", ur: "منظوری کی منتظر تبدیلی کتنے دن کھلی رہتی ہے"}
    help: {en: "A change waiting for approval expires after this many days.", ur: "منظوری کی منتظر تبدیلی اتنے دن بعد ختم ہو جاتی ہے۔"}
  - key: cfg.numbering.fiscal_year_start_month
    type: int
    default: 1
    validation: {min: 1, max: 12}
    layers: [tenant, company]
    area: numbering
    unit: month
    name: {en: "Fiscal year start month", ur: "مالی سال کا پہلا مہینہ"}
    description: {en: "Month the fiscal year starts in (1 = January); used by fiscal-year numbering", ur: "مالی سال کس مہینے سے شروع ہوتا ہے (1 = جنوری)؛ مالی سال کی نمبرنگ کے لیے"}
    help: {en: "Month the fiscal year starts in (1 = January). Without a value, the default of the company's country applies.", ur: "مالی سال کس مہینے سے شروع ہوتا ہے (1 = جنوری)۔ قدر نہ ہونے پر کمپنی کے ملک کا طے شدہ مہینہ لاگو ہوتا ہے۔"}
  - key: org.time_zone
    type: text
    default: "Asia/Karachi"
    layers: [tenant, company]
    area: organization
    name: {en: "Time zone", ur: "ٹائم زون"}
    description: {en: "Time zone of the company (IANA name, for example Asia/Karachi)", ur: "کمپنی کا ٹائم زون (IANA نام، مثلاً Asia/Karachi)"}
    help: {en: "IANA time zone name, for example Asia/Karachi. It decides which day \"today\" is. Without a value, the default of the company's country applies.", ur: "IANA ٹائم زون کا نام، مثلاً Asia/Karachi۔ اسی سے طے ہوتا ہے کہ \"آج\" کون سا دن ہے۔ قدر نہ ہونے پر کمپنی کے ملک کا طے شدہ ٹائم زون لاگو ہوتا ہے۔"}
  # Slice S1.09b (ruling Q7, FR-ADM-USR-08 "configurable thresholds"): when a licence limit warns before its hard stop.
  - key: cfg.limits.warning_percent
    type: int
    default: 90
    validation: {min: 50, max: 99}
    layers: [tenant]
    area: licence
    unit: percent
    name: {en: "Licence limit warning", ur: "لائسنس کی حد کی تنبیہ"}
    description: {en: "Percentage of a licence limit at which administrators are warned", ur: "لائسنس کی حد کا وہ فیصد جس پر منتظمین کو تنبیہ کی جاتی ہے"}
    help: {en: "When users, concurrent users or companies reach this percentage of the licence limit, a warning is shown and announced once. At 100 percent new ones are refused.", ur: "جب صارفین، بیک وقت صارفین یا کمپنیاں لائسنس کی حد کے اس فیصد تک پہنچیں تو ایک بار تنبیہ دکھائی اور بھیجی جاتی ہے۔ 100 فیصد پر نئے رد کر دیے جاتے ہیں۔"}

# Release 1.0 has no requirement that needs a specific flag yet (ruling Q14): the mechanism ships with an empty list.
flags: []

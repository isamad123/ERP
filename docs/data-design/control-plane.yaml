# Control-plane database (schema cp). One per installation. Holds no customer business data.
# Spec 03 section 4; D-02, D-05, D-47.

- table: cp.tenants
  purpose: Registry of customers
  traits: [std]
  status: [provisioning, active, suspended, offboarding, deleted]
  columns:
    - [code, code, req, unique; used in host names]
    - [name, text, req]
    - [region_code, code, req, "hosting region, e.g. pk-1"]
    - [deployment_type, "enum(saas,on_prem)", req]
    - [country_code, char(2), req, "primary country, selects default country pack"]
    - [size_profile, "enum(micro,sme,mid,enterprise)", req, D-40; changeable]
    - [legal_hold, bool, req]
    - [hibernated_at, ts, opt, idle tenants (FR-STR-OPS-02)]
  unique: [[code]]
  reqs: [KRN-TEN-01, KRN-TEN-03, KRN-TEN-09]

- table: cp.tenant_domains
  purpose: Host names that resolve to a tenant
  traits: [std]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [host, text, req, lower-case; unique]
    - [is_primary, bool, req]
    - [verified_at, ts, opt]
  unique: [[host]]
  reqs: [KRN-TEN-04]

- table: cp.db_clusters
  purpose: PostgreSQL servers that host tenant databases
  traits: [std]
  status: [active, full, draining, retired]
  columns:
    - [name, code, req]
    - [region_code, code, req]
    - [host, text, req]
    - [port, int, req]
    - [max_databases, int, req]
    - [admin_secret_ref, text, req, "reference to the secrets store, never the secret"]
  unique: [[name]]
  reqs: [KRN-TEN-02]

- table: cp.tenant_databases
  purpose: The one production database of each tenant (UAT and sandbox are Release 1.1)
  traits: [std]
  status: [creating, ready, migrating, maintenance, retired]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [db_cluster_id, uuid, req, fk cp.db_clusters]
    - [env_type, "enum(production,uat,sandbox)", req, default production; only production in 1.0]
    - [database_name, text, req]
    - [app_secret_ref, text, req]
    - [schema_version, text, opt, highest applied migration]
    - [size_bytes, big, opt]
    - [last_backup_at, ts, opt]
    - [last_restore_test_at, ts, opt]
  unique: [[db_cluster_id, database_name], [tenant_id, env_type]]
  reqs: [KRN-TEN-02, KRN-TEN-03, ADM-DAT-08]

- table: cp.entitlements
  purpose: "Signed entitlement per tenant (edition, modules, limits, term); history kept"
  traits: [std]
  status: [active, warning, grace, read_only, locked, superseded, scheduled]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [version, int, req]
    - [edition, "enum(starter,business,enterprise)", req]
    - [claims, json, req, "modules, feature keys, packs, limits (users, employees, companies, storage)"]
    - [signature, bytea, req]
    - [signing_key_id, code, req]
    - [effective_from, date, req]
    - [expires_at, date, opt]
    - [state_since, ts, req]
  unique: [[tenant_id, version], [tenant_id, "where status <> 'superseded'"]]
  # S1.09b (ruling Q3, CR-036 item 6): an entitlement with a future start date waits as `scheduled`; the one-current key
  # ignores scheduled rows as well as superseded ones.
  enum_added_in: {S1.09b: {status: [scheduled]}}
  uniques_replaced_in: {S1.09b: [[tenant_id, "where status not in ('superseded', 'scheduled')"]]}
  reqs: [KRN-ENT-01, KRN-ENT-03, KRN-ENT-04, KRN-ENT-05, ADM-PLT-03]

- table: cp.license_events
  purpose: Entitlement state changes and limit breaches
  traits: [app]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [event_type, code, req]
    - [from_state, text, opt]
    - [to_state, text, opt]
    - [occurred_at, ts, req]
    - [details, json, req]
    - [source_event_id, uuid, opt, "the customer's security event a limit event was copied from (copied once, CR-039)"]
  indexes: [[tenant_id, occurred_at]]
  # S1.09b (CR-039): limit warnings and refusals are recorded in the customer database first; the licence loop copies
  # each one here exactly once, keyed by the customer's security-event id.
  added_in: {S1.09b: [source_event_id]}
  uniques_added_in: {S1.09b: [[source_event_id, "where source_event_id is not null"]]}
  reqs: [KRN-ENT-04]

- table: cp.signing_keys
  purpose: Public keys for entitlement and pack signatures; private keys are never stored
  traits: [std]
  columns:
    - [key_id, code, req]
    - [purpose, "enum(entitlement,pack,update)", req]
    - [public_key, bytea, req]
    - [valid_from, ts, req]
    - [valid_to, ts, opt]
    - [revoked_at, ts, opt]
  unique: [[key_id]]
  reqs: [KRN-ENT-01, KRN-CFG-01]

- table: cp.usage_meters
  purpose: Monthly usage per tenant for limits and billing
  traits: [std]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [meter_key, "enum(active_users,active_employees,companies,storage_bytes,api_calls)", req]
    - [period, char(6), req, yyyymm]
    - [value, big, req]
    - [as_of, ts, req]
  unique: [[tenant_id, meter_key, period]]
  reqs: [KRN-ENT-06, ADM-OPS-07, ADM-USR-08]

- table: cp.module_catalog
  purpose: "Modules known to the platform, mirrors module manifests"
  traits: [std]
  columns:
    - [module_id, code, req, "e.g. kernel, hrm"]
    - [name, text, req]
    - [kind, "enum(kernel,business)", req]
    - [entitlement_keys, "text[]", req]
  unique: [[module_id]]
  reqs: [KRN-ENT-03]

- table: cp.tenant_module_versions
  purpose: Which module versions each tenant database runs
  traits: [std]
  columns:
    - [tenant_database_id, uuid, req, fk cp.tenant_databases]
    - [module_id, code, req]
    - [installed_version, text, req]
    - [installed_at, ts, req]
  unique: [[tenant_database_id, module_id]]
  reqs: [KRN-TEN-11]

- table: cp.pack_catalog
  purpose: Signed country and industry packs available to install
  traits: [std]
  columns:
    - [pack_id, code, req, e.g. country-pk]
    - [kind, "enum(country,industry,template,language)", req]
    - [version, text, req]
    - [compatible_from, text, req]
    - [signature, bytea, req]
    - [released_at, ts, req]
    - [release_notes, text, opt]
  unique: [[pack_id, version]]
  reqs: [KRN-CFG-01]

- table: cp.platform_users
  purpose: Vendor staff; MFA mandatory
  traits: [std, soft]
  status: [active, disabled]
  columns:
    - [email, text, req, lower-case unique]
    - [display_name, text, req]
    - [role, "enum(platform_admin,provisioning,support,read_only)", req]
    - [mfa_enrolled, bool, req]
  unique: [[email]]
  reqs: [ADM-PLT-10]

- table: cp.platform_audit
  purpose: Every vendor-side action
  traits: [app]
  columns:
    - [platform_user_id, uuid, req, fk cp.platform_users]
    - [action, code, req]
    - [tenant_id, uuid, opt, fk cp.tenants]
    - [occurred_at, ts, req]
    - [details, json, req]
  indexes: [[tenant_id, occurred_at], [platform_user_id, occurred_at]]
  reqs: [ADM-PLT-10, ADM-PLT-11]

- table: cp.audit_anchors
  purpose: Copy of each customer's daily audit-chain anchor kept outside the customer database, so a customer-side database owner cannot rewrite the chain unnoticed (CR-027)
  traits: [app]
  columns:
    - [tenant_id, uuid, req, fk cp.tenants]
    - [day, date, req]
    - [last_hash, bytea, req]
    - [recorded_at, ts, req]
  unique: [[tenant_id, day]]
  # S1.07 (CR-027): added after the release's first control-plane migration; created by the slice's design migration.
  added_in: S1.07
  reqs: [KRN-AUD-03]

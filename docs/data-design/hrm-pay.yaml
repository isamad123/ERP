# HRMIS: payroll, statutory tables, tax, payments, final settlement, loans, expenses, compensation and benefits,
# compliance. Spec 06a sections 14 to 17. Multi-currency payroll is Release 1.1: each pay group has one currency.

- table: hrm.pay_groups
  traits: [std, co, soft, name]
  columns:
    - [frequency, "enum(monthly,semi_monthly,bi_weekly,weekly)", req]
    - [currency_code, char(3), req, fk ref.currencies]
    - [tax_year_start_month, int, req, "7 for Pakistan, from pack"]
    - [cut_off_day, int, opt]
    - [payment_day, int, opt]
    - [company_bank_account_id, uuid, opt, fk org.company_bank_accounts]
    - [approval_threshold, money, opt, dual approval above this total (PAY-13)]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-01, PAY-13]

- table: hrm.pay_periods
  purpose: Payroll calendar per pay group
  traits: [std, co]
  status: [future, open, processing, closed]
  columns:
    - [pay_group_id, uuid, req, fk hrm.pay_groups]
    - [period_no, int, req]
    - [tax_year, int, req, year in which the tax year starts]
    - [start_date, date, req]
    - [end_date, date, req]
    - [cut_off_date, date, req]
    - [payment_date, date, req]
  unique: [[pay_group_id, start_date], [pay_group_id, tax_year, period_no]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-01, PAY-38]
  checks: ["exclusion: (pay_group_id with =, daterange(start_date, end_date, '[]') with &&)", start_date <= cut_off_date and start_date <= end_date]
  notes: "Trigger refuses new pay_inputs, retro_adjustments or installments targeting a closed period."

- table: hrm.pay_components
  traits: [std, co, soft, name]
  columns:
    - [kind, "enum(earning,deduction,employer_contribution,reimbursement,informational)", req]
    - [payslip_order, int, req]
    - [is_recurring, bool, req]
    - [is_one_time_allowed, bool, req]
    - [source, "enum(pack,tenant)", req]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-02, PAY-03, PAY-05, PAY-08, PAY-18, CMP-03]

- table: hrm.pay_component_versions
  purpose: "Calculation definition of a component, effective-dated; runs record the version used"
  traits: [std, eff]
  eff_key: [component_id]
  columns:
    - [component_id, uuid, req, fk hrm.pay_components]
    - [method, "enum(fixed,percent_of,formula,table_lookup,per_day,per_hour,attendance_linked,manual)", req]
    - [formula, text, opt, expression over named inputs]
    - [base_component_ids, "uuid[]", req, cycle check on save]
    - [statutory_table_code, code, opt]
    - [pro_rata_rule, "enum(none,calendar_days,working_days,fixed_30,custom)", req]
    - [statutory_flags, json, req, "taxable, eobi_base, social_security_base, pf_base, gratuity_base ... set by pack"]
    - [tax_treatment, code, opt, "regular, irregular, exempt"]
  reqs: [PAY-02, PAY-03, PAY-05, PAY-18, PAY-31]

- table: hrm.salary_structures
  traits: [std, co, soft, name]
  columns:
    - [assign_rule, json, opt, default by grade or employee type]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-04]

- table: hrm.salary_structure_components
  traits: [std, eff]
  eff_key: [structure_id, component_id]
  columns:
    - [structure_id, uuid, req, fk hrm.salary_structures]
    - [component_id, uuid, req, fk hrm.pay_components]
    - [evaluation_order, int, req]
    - [default_amount, money, opt]
    - [default_percent, pct, opt]
    - [is_mandatory, bool, req]
    - [currency_code, char(3), req]
  reqs: [PAY-04]

- table: hrm.compensation_assignments
  purpose: "An employee's salary structure, effective-dated; a revision closes one row and opens another (PAY-06)"
  traits: [std, co, eff]
  eff_key: [employment_id]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [structure_id, uuid, req, fk hrm.salary_structures]
    - [event_id, uuid, req, fk hrm.employment_events]
    - [currency_code, char(3), req]
    - [gross_amount, money, opt, informational; lines are authoritative]
    - [increment_proposal_id, uuid, opt, fk hrm.increment_proposals]
  indexes: [[employment_id, valid_from]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {gross_amount: salary}
  reqs: [PAY-04, PAY-06, CMP-02]

- table: hrm.compensation_lines
  purpose: "Amounts per component for an assignment, including allowances and perquisites (CMP-03)"
  traits: [std, co]
  columns:
    - [assignment_id, uuid, req, fk hrm.compensation_assignments]
    - [component_id, uuid, req, fk hrm.pay_components]
    - [amount, money, opt]
    - [percent, pct, opt]
    - [units, qty, opt]
  unique: [[assignment_id, component_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  field_class: {amount: salary}
  reqs: [PAY-04, CMP-03]

- table: hrm.statutory_tables
  purpose: "Pack-supplied, tenant-overridable rate and slab tables (income tax slabs, EOBI, PESSI/SESSI, WWF, minimum wage)"
  traits: [std, eff]
  eff_key: [company_scope, code]
  columns:
    - [code, code, req, e.g. pk.income_tax.salaried]
    - [company_id, uuid, opt, fk org.companies; null = pack or tenant-wide value]
    - [company_scope, uuid, req, "generated always as coalesce(company_id, nil uuid) stored"]
    - [source, "enum(pack,tenant)", req]
    - [kind, "enum(slab,rate,ceiling,lookup)", req]
    - [description_i18n, i18n, req]
    - [pack_version, text, opt]
  notes: Pack updates create new versions with a future valid_from.
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-17, PAY-20, PAY-21, POL-04, CPL-04]

- table: hrm.statutory_table_rows
  traits: [std]
  columns:
    - [table_id, uuid, req, fk hrm.statutory_tables]
    - [seq, int, req]
    - [lower_bound, money, opt]
    - [upper_bound, money, opt]
    - [fixed_amount, money, opt]
    - [currency_code, char(3), opt, for money bounds]
    - [rate, rate, opt]
    - [key, code, opt, "for lookups, e.g. province code"]
    - [attributes, json, req]
  unique: [[table_id, seq]]
  reqs: [PAY-17, PAY-20, PAY-21]
  checks: [lower_bound < upper_bound when both present, "exclusion: (table_id with =, coalesce(key,'') with =, numrange(lower_bound, upper_bound) with &&)"]
  notes: Immutable by trigger once the parent version is effective or referenced by any run; change by a new table version.

- table: hrm.pay_runs
  traits: [std, co]
  status: [created, inputs_imported, calculated, validated, in_review, approved, locked, paid, posted, closed, cancelled]
  columns:
    - [run_no, text, req]
    - [pay_group_id, uuid, req, fk hrm.pay_groups]
    - [pay_period_id, uuid, req, fk hrm.pay_periods]
    - [kind, "enum(regular,bonus,correction,final_settlement,advance)", req]
    - [currency_code, char(3), req]
    - [snapshot_taken_at, ts, opt]
    - [calc_job_run_id, uuid, opt, fk job.runs]
    - [total_gross, money, opt]
    - [total_net, money, opt]
    - [total_employer, money, opt]
    - [employee_count, int, opt]
    - [stage_log, json, req, user and time per stage (PAY-10)]
    - [reopened_reason, text, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, run_no], [pay_group_id, pay_period_id, "where kind = 'regular' and status <> 'cancelled'"]]
  indexes: [[pay_group_id, pay_period_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-10, PAY-14, PAY-15, PAY-34]
  notes: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33); status column may still advance (paid, posted, closed) through the run service only."

- table: hrm.pay_run_employees
  purpose: "Who is in a run, the frozen input snapshot, status and validation flags"
  traits: [std, co]
  status: [included, excluded, held, calculated, error]
  columns:
    - [pay_run_id, uuid, req, fk hrm.pay_runs]
    - [employment_id, uuid, req, fk hrm.employments]
    - [period_start, date, req]
    - [period_end, date, req]
    - [run_kind, text, req, copy of pay_runs.kind]
    - [run_status, text, req, "copy of pay_runs.status, maintained by the run service"]
    - [snapshot, json, req, "frozen assignment, compensation lines, attendance summary, leave, loans, tables and policy versions (PAY-31); ids and amounts only, never identifiers or bank numbers in plaintext"]
    - [snapshot_hash, bytea, req]
    - [validation_flags, "text[]", req, "negative_net, missing_bank, missing_tax_id, variance_above_threshold, duplicate, no_attendance"]
    - [hold_id, uuid, opt, fk hrm.salary_holds]
  unique: [[pay_run_id, employment_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [PAY-09, PAY-11, PAY-31]
  notes: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
  checks: ["exclusion: (employment_id with =, daterange(period_start, period_end, '[]') with &&) where run_kind in ('regular','final_settlement') and run_status <> 'cancelled'"]

- table: hrm.pay_inputs
  purpose: "One-time inputs to a period (bonus, incentive, deduction, adjustment, imported file rows)"
  traits: [std, co]
  status: [pending, consumed, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [pay_period_id, uuid, req, fk hrm.pay_periods]
    - [component_id, uuid, req, fk hrm.pay_components]
    - [amount, money, opt]
    - [currency_code, char(3), req]
    - [units, qty, opt]
    - [source_type, text, req, "manual, import, expense_claim, overtime, loan, bonus"]
    - [source_id, uuid, opt]
    - [consumed_by_run_id, uuid, opt, fk hrm.pay_runs]
    - [import_batch_id, uuid, opt, fk itg.import_batches]
  indexes: [[employment_id, pay_period_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {amount: salary}
  reqs: [PAY-07, PAY-08]
  unique: [[source_type, source_id, component_id, "where status <> 'cancelled' and source_id is not null"]]

- table: hrm.pay_results
  purpose: Net result per employee per run; append-only once the run is locked (PAY-33)
  traits: [std, co]
  columns:
    - [pay_run_id, uuid, req, fk hrm.pay_runs]
    - [employment_id, uuid, req, fk hrm.employments]
    - [tax_year, int, req]
    - [pay_period_id, uuid, req, fk hrm.pay_periods]
    - [gross, money, req]
    - [deductions, money, req]
    - [net, money, req]
    - [employer_cost, money, req]
    - [taxable_income_ytd, money, req]
    - [tax_ytd, money, req]
    - [worked_days, qty, req]
    - [paid_days, qty, req]
    - [corrects_result_id, uuid, opt, fk hrm.pay_results]
  unique: [[pay_run_id, employment_id]]
  notes: "Trigger refuses update and delete when the run status is locked or later. Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {gross: salary, deductions: salary, net: salary, employer_cost: salary, taxable_income_ytd: salary, tax_ytd: salary}
  reqs: [PAY-12, PAY-28, PAY-33, FR-XM-27]
  indexes: [[employment_id, tax_year]]

- table: hrm.pay_result_lines
  traits: [std, co]
  columns:
    - [result_id, uuid, req, fk hrm.pay_results]
    - [pay_period_id, uuid, req, denormalized]
    - [employment_id, uuid, req, denormalized]
    - [component_id, uuid, req, fk hrm.pay_components]
    - [amount, money, req]
    - [units, qty, opt]
    - [rate, rate, opt]
    - [period_start, date, opt, "arrears: the period it relates to"]
    - [cost_allocation, json, req, split by cost centre or department for the journal]
  indexes: [[result_id], [company_id, component_id, pay_period_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {amount: salary}
  reqs: [PAY-06, PAY-29, PAY-30]
  notes: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."
  partition: range on pay_period start (yearly) once volume requires; key includes partition column

- table: hrm.pay_traces
  purpose: Calculation trace per result (PAY-32)
  key: [result_id]
  columns:
    - [result_id, uuid, req, "pk, fk hrm.pay_results"]
    - [trace, json, req, "inputs, formulas, rule and table versions, rounding steps"]
    - [engine_version, text, req]
  reqs: [PAY-32]
  notes: "Lock: trigger refuses UPDATE and DELETE once the parent pay run status is locked or later (FR-XM-05, PAY-33)."

- table: hrm.pay_result_reversals
  purpose: Reversal of a single payslip after approval and before payment (FR-XM-27); after payment correct by adjustment or off-cycle run
  traits: [app, co]
  columns:
    - [result_id, uuid, req, fk hrm.pay_results]
    - [reason, text, req]
    - [approved_by, uuid, req, fk iam.users]
    - [reversed_at, ts, req]
  unique: [[result_id]]
  checks: [allowed only while no non-failed payment line exists for the result]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  reqs: [FR-XM-27, PAY-14]

- table: hrm.retro_adjustments
  purpose: "Changes discovered after lock (attendance, salary, leave) carried to the next open run (PAY-16, FR-XM-26)"
  traits: [std, co]
  status: [pending, applied, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [original_run_id, uuid, req, fk hrm.pay_runs]
    - [original_pay_period_id, uuid, req, fk hrm.pay_periods; tax year of arrears]
    - [cause_type, text, req]
    - [cause_id, uuid, opt]
    - [component_id, uuid, req, fk hrm.pay_components]
    - [amount, money, req]
    - [currency_code, char(3), req]
    - [applied_in_run_id, uuid, opt, fk hrm.pay_runs]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {amount: salary}
  reqs: [PAY-06, PAY-16, FR-XM-26]
  notes: "applied_in_run_id may be set once (trigger); status pending -> applied is one-way."
  indexes: [[employment_id, status, "partial where status='pending'"]]

- table: hrm.salary_holds
  traits: [std, co]
  status: [active, released]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [reason, text, req]
    - [held_from_run_id, uuid, req, fk hrm.pay_runs]
    - [released_at, ts, opt]
    - [released_by, uuid, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [PAY-09]
  notes: A release pays the original result of the held run through a payment batch; the salary is never recalculated. Each result is paid once (hrm.payment_lines unique key).
  indexes: [[employment_id, status, "partial where status='active'"]]

- table: hrm.tax_declarations
  traits: [std, co]
  status: [draft, submitted, verified, rejected]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [tax_year, int, req]
  unique: [[employment_id, tax_year]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [PAY-19]

- table: hrm.tax_declaration_lines
  traits: [std]
  columns:
    - [declaration_id, uuid, req, fk hrm.tax_declarations]
    - [kind, code, req, "exemption or credit type from pack, e.g. zakat, donation, pension fund"]
    - [declared_amount, money, req]
    - [verified_amount, money, opt]
    - [file_ids, "uuid[]", req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  field_class: {declared_amount: salary, verified_amount: salary}
  # CR-025 (S1.06 review finding 1): lines are located through their declaration (own, team, company ... of its employment).
  scope: {via: declaration_id}
  reqs: [PAY-19]

- table: hrm.previous_employer_income
  traits: [std, co]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [tax_year, int, req]
    - [employer_name, text, req]
    - [taxable_income, money, req]
    - [tax_deducted, money, req]
    - [file_id, uuid, opt, fk doc.files]
  unique: [[employment_id, tax_year, employer_name]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {taxable_income: salary, tax_deducted: salary}
  reqs: [PAY-22]

- table: hrm.payment_batches
  traits: [std, co]
  status: [generated, validated, downloaded, partially_paid, paid, cancelled]
  columns:
    - [pay_run_id, uuid, opt, fk hrm.pay_runs; null for a batch that releases held salaries]
    - [company_bank_account_id, uuid, opt, fk org.company_bank_accounts]
    - [payment_mode, "enum(bank_transfer,cheque,cash,mobile_wallet)", req]
    - [template_id, uuid, opt, fk doc.templates (bank file format)]
    - [file_id, uuid, opt, fk doc.files]
    - [total_amount, money, req]
    - [line_count, int, req]
    - [value_date, date, opt]
    - [file_checksum, text, opt, sha-256 of the downloaded file]
    - [currency_code, char(3), req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [PAY-23, PAY-24]
  unique: [[pay_run_id, payment_mode, company_bank_account_id, "where status <> 'cancelled' (NULLS NOT DISTINCT)"]]

- table: hrm.payment_lines
  traits: [std, co]
  status: [pending, paid, failed, reissued]
  columns:
    - [batch_id, uuid, req, fk hrm.payment_batches]
    - [batch_status, text, req, copy of batch status for the partial unique key]
    - [result_id, uuid, req, fk hrm.pay_results]
    - [source_run_id, uuid, req, fk hrm.pay_runs; run of the result being paid (differs from batch run for released holds)]
    - [bank_account_id, uuid, opt, fk hrm.employee_bank_accounts]
    - [cheque_no, text, opt]
    - [iban_hmac, hmac, opt, snapshot]
    - [iban, enc, opt, snapshot]
    - [account_number, enc, opt, snapshot]
    - [account_title, text, opt, snapshot]
    - [bank_id, uuid, opt, fk ref.banks; snapshot at generation]
    - [amount, money, req]
    - [bank_reference, text, opt]
    - [failure_reason, text, opt]
    - [reissued_in_line_id, uuid, opt, fk hrm.payment_lines]
  indexes: [[batch_id], [result_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  field_class: {amount: salary}
  reqs: [PAY-23, PAY-25]
  unique: [[result_id, bank_account_id, "where status not in ('failed','reissued') and batch not cancelled (maintained via denormalized batch_status)"]]
  checks: ["deferred: sum of active lines per result equals pay_results.net"]

- table: hrm.final_settlements
  traits: [std, co]
  status: [draft, calculated, blocked, approved, paid, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [separation_id, uuid, req, fk hrm.separations]
    - [pay_run_id, uuid, opt, fk hrm.pay_runs (off-cycle run that pays it)]
    - [clearance_status, "enum(pending,cleared,waived)", req]
    - [open_items, json, req, "from the clearance check: loans, advances, items, claims, approvals (FR-XM-29)"]
    - [net_amount, money, opt]
    - [currency_code, char(3), req]
    - [statement_document_id, uuid, opt, fk doc.generated_documents]
    - [acknowledged_at, ts, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[employment_id, "where status <> 'cancelled'"]]
  checks: ["status may become approved only when clearance_status in (cleared, waived) (FR-XM-29)", pay_run_id required before status = paid]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  field_class: {net_amount: salary}
  reqs: [PAY-26, PAY-27, ONB-17, FR-XM-29]
  notes: Header and lines locked by trigger from approved onward; correction by cancel and reissue (FR-XM-05).

- table: hrm.final_settlement_lines
  traits: [std, co]
  columns:
    - [settlement_id, uuid, req, fk hrm.final_settlements]
    - [kind, "enum(pending_salary,leave_encashment,gratuity,notice_pay,notice_recovery,loan_recovery,advance_recovery,bond_recovery,bonus,tax_adjustment,pf_payout,other)", req]
    - [component_id, uuid, opt, fk hrm.pay_components]
    - [amount, money, req]
    - [basis, json, req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}

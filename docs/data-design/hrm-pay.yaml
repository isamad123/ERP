    - [kind, "enum(disbursement,recovery,early_settlement,adjustment,write_off,settlement_recovery)", req]
    - [amount, money, req, positive increases balance]
    - [txn_date, date, req]
    - [source_type, text, opt]
    - [source_id, uuid, opt]
  indexes: [[loan_id, txn_date]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  field_class: {amount: salary}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  reqs: [LON-03, LON-05, LON-07]
  unique: [[loan_id, source_type, source_id, kind, where source_id is not null]]
  checks: ["trigger: a recovery cannot exceed the outstanding balance"]
  notes: Recovery entries are written only when the pay run locks.


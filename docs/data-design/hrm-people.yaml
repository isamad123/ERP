# HRMIS: people, employment, structure, policies, documents, self-service requests, onboarding and exit.
# Spec 06a sections 5 to 8, 11, 12, 27. All tables in schema hrm.

# ---------------- persons ----------------
- table: hrm.persons
  purpose: One row per human (FR-XM-28). Employments hang off the person
  traits: [std, soft, cust]
  columns:
    - [person_no, text, req, "assigned by numbering"]
    - [first_name, text, req]
    - [middle_name, text, opt]
    - [last_name, text, opt]
    - [name_local, text, opt, "name in Urdu script"]
    - [father_or_spouse_name, text, opt, "common in Pakistani records"]
    - [gender, "enum(male,female,other,unspecified)", req]
    - [date_of_birth, date, opt]
    - [marital_status, code, opt, "option list"]
    - [nationality_code, char(2), opt, fk ref.countries]
    - [religion, code, opt, "only where a pack requires it (e.g. Hajj leave eligibility); field-secured"]
    - [photo_file_id, uuid, opt, fk doc.files]
    - [party_ref, uuid, opt, "kernel party when Finance or Procurement pays the person (Later); no FK"]
  unique: [[lower(person_no)]]
  reqs: [EMP-01, EMP-15, FR-XM-28]

- table: hrm.person_identifiers
  purpose: National IDs, passports, tax numbers; validated per country pack
  traits: [std, eff]
  eff_key: [person_id, kind]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, code, req, "cnic, nicop, passport, ntn, iqama ... from pack"]
    - [country_code, char(2), req]
    - [value, enc, req]
    - [value_hmac, hmac, req, "duplicate detection"]
    - [value_last4, text, opt, "for display"]
    - [issue_date, date, opt]
    - [expiry_date, date, opt]
    - [file_id, uuid, opt, fk doc.files]
  unique: [[kind, value_hmac]]
  reqs: [EMP-05, EMP-16, EMP-18]

- table: hrm.person_contacts
  traits: [std]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(mobile,phone,email_personal,email_work,other)", req]
    - [value, text, req]
    - [is_primary, bool, req]
  reqs: [EMP-01]

- table: hrm.person_addresses
  traits: [std, eff]
  eff_key: [person_id, kind]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(permanent,current,mailing)", req]
    - [address, json, req]
  reqs: [EMP-01]

- table: hrm.person_relations
  purpose: Family, dependents and emergency contacts in one table
  traits: [std, soft]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [relation, code, req, "spouse, child, parent, sibling, other"]
    - [full_name, text, req]
    - [date_of_birth, date, opt]
    - [gender, text, opt]
    - [identifier, enc, opt]
    - [phone, text, opt]
    - [is_dependent, bool, req]
    - [is_emergency_contact, bool, req]
    - [is_nominee, bool, req, "provident fund, gratuity, insurance"]
    - [nominee_share, pct, opt]
  reqs: [EMP-01, CMP-04, CMP-05]

- table: hrm.person_qualifications
  purpose: Education, previous experience, languages and certifications
  traits: [std, soft]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(education,experience,language,certification)", req]
    - [title, text, req, "degree, job title, language, certificate name"]
    - [institution, text, opt, "school, employer or issuing body"]
    - [start_date, date, opt]
    - [end_date, date, opt]
    - [expiry_date, date, opt, "certifications (LND-05)"]
    - [grade_or_level, text, opt]
    - [details, json, req]
    - [file_id, uuid, opt, fk doc.files]
    - [learning_record_id, uuid, opt, "fk hrm.learning_records when earned through training"]
  indexes: [[person_id, kind], [expiry_date, "partial where expiry_date is not null"]]
  reqs: [EMP-01, LND-05]

# ---------------- employment ----------------
- table: hrm.employments
  purpose: One employment of a person with one company; transfers between companies create a new linked row (FR-XM-30)
  traits: [std, co, cust]
  status: [pre_joining, active, on_notice, separated, cancelled]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [employee_no, text, req, "numbering per company"]
    - [employee_type, code, req, "permanent, contract, probation, intern, daily_wage, consultant, part_time"]
    - [joining_date, date, req]
    - [service_start_date, date, req, "carries over on intra-group transfer"]
    - [confirmation_date, date, opt]
    - [expected_end_date, date, opt]
    - [separation_date, date, opt]
    - [previous_employment_id, uuid, opt, "fk hrm.employments (transfer or rehire)"]
    - [user_ref, uuid, opt, "iam.users.id"]
    - [is_primary, bool, req, "one primary per person (multiple concurrent assignments are 1.1)"]
  unique: [[company_id, lower(employee_no)]]
  indexes: [[person_id], [company_id, status]]
  reqs: [EMP-02, EMP-04, EMP-07, EMP-15, EMP-17, FR-XM-30]

- table: hrm.employment_assignments
  purpose: Effective-dated job details; every change closes the current row and opens a new one
  traits: [std, co, eff]
  eff_key: [employment_id]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [event_id, uuid, req, fk hrm.employment_events]
    - [org_unit_id, uuid, req, fk org.org_units]
    - [position_id, uuid, opt, fk hrm.positions]
    - [title, text, req]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [branch_id, uuid, req, fk org.branches]
    - [location_id, uuid, opt, fk org.locations]
    - [manager_employment_id, uuid, opt, fk hrm.employments]
    - [pay_group_id, uuid, opt, fk hrm.pay_groups]
    - [cost_allocation, json, req, "list of {cost_center_ref or department, pct}; must sum to 1"]
    - [fte, pct, req, "default 1"]
    - [work_schedule, code, opt]
    - [is_acting, bool, req]
  indexes: [[employment_id, valid_from], [org_unit_id], [manager_employment_id]]
  reqs: [EMP-02, EMP-03, POS-01]

- table: hrm.employment_events
  purpose: Why something changed (hire, promotion, transfer ... termination) with reason code
  traits: [std, co]
  status: [draft, pending_approval, approved, effective, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, "enum(hire,rehire,promotion,demotion,transfer,grade_change,acting,secondment,confirmation,probation_extension,salary_revision,separation,data_correction)", req]
    - [reason_code, code, req, "option list"]
    - [effective_date, date, req]
    - [notes, text, opt]
    - [carry_over, json, opt, "intra-group transfer: service, leave, loans rules (FR-XM-30)"]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [letter_document_id, uuid, opt, fk doc.generated_documents]
  indexes: [[employment_id, effective_date]]
  reqs: [EMP-03, EMP-11, FR-XM-30]

- table: hrm.contracts
  traits: [std, co]
  status: [draft, active, expired, renewed, terminated]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [contract_no, text, req]
    - [start_date, date, req]
    - [end_date, date, opt]
    - [renewal_notice_days, int, opt]
    - [terms, json, req]
    - [file_id, uuid, opt, fk doc.files]
    - [renews_contract_id, uuid, opt, fk hrm.contracts]
  indexes: [[employment_id], [end_date]]
  reqs: [EMP-09]

- table: hrm.probation_records
  traits: [std, co]
  status: [in_progress, extended, confirmed, not_confirmed]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [start_date, date, req]
    - [end_date, date, req]
    - [extended_to, date, opt]
    - [review_form_response_id, uuid, opt, fk hrm.form_responses]
    - [decision_date, date, opt]
  reqs: [EMP-10, ONB-12]

- table: hrm.employee_bank_accounts
  traits: [std, co, eff]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [payment_mode, "enum(bank_transfer,cheque,cash,mobile_wallet)", req]
    - [bank_id, uuid, opt, fk ref.banks]
    - [account_title, text, opt]
    - [account_number, enc, opt]
    - [iban, enc, opt]
    - [iban_hmac, hmac, opt]
    - [split_kind, "enum(remainder,percent,amount)", req]
    - [split_value, money, opt]
    - [priority, int, req]
  checks: ["bank fields required when payment_mode = bank_transfer or mobile_wallet"]
  indexes: [[employment_id, valid_from]]
  notes: "Changes go through maker-checker (iam.maker_checker_requests)."
  reqs: [EMP-06, PAY-24]

- table: hrm.change_requests
  purpose: Employee self-service changes to their own data, approved before applying (EMP-08)
  traits: [std, co]
  status: [submitted, approved, rejected, applied, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [entity_type, text, req]
    - [entity_id, uuid, opt]
    - [proposed, json, req]
    - [current_snapshot, json, req]
    - [file_ids, "uuid[]", req]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  reqs: [EMP-08, SSP-12]

- table: hrm.service_requests
  purpose: General HR requests from self-service (letters, documents, other)
  traits: [std, co, br]
  status: [submitted, in_progress, fulfilled, rejected, cancelled]
  columns:
    - [request_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, code, req, "letter, document, other"]
    - [template_id, uuid, opt, fk doc.templates]
    - [details, json, req]
    - [generated_document_id, uuid, opt, fk doc.generated_documents]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, request_no]]
  reqs: [DOC-07, SSP-12]

- table: hrm.employee_letters
  purpose: Letters issued to an employee (offer, appointment, confirmation, increment, promotion, transfer, warning, experience, salary certificate)
  traits: [std, co]
  status: [draft, pending_approval, approved, issued, acknowledged, cancelled]
  columns:
    - [letter_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [template_id, uuid, req, fk doc.templates]
    - [letter_type, code, req]
    - [data, json, req, "merged values, frozen at issue"]
    - [contains_salary, bool, req, "only roles with salary permission may generate or view (DOC-08)"]
    - [generated_document_id, uuid, opt, fk doc.generated_documents]
    - [issued_at, ts, opt]
    - [emailed_at, ts, opt]
    - [acknowledged_at, ts, opt]
    - [source_type, text, opt, "employment_event, service_request, final_settlement"]
    - [source_id, uuid, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, letter_no]]
  indexes: [[employment_id]]
  reqs: [DOC-04, DOC-05, DOC-07, DOC-08, CMP-06]

# ---------------- structure ----------------
- table: hrm.grades
  traits: [std, co, soft, name]
  columns:
    - [rank, int, req, "ordering"]
    - [defaults, json, req, "leave and policy defaults"]
  unique: [[company_id, lower(code)]]
  reqs: [POS-06]

- table: hrm.positions
  traits: [std, co, eff, cust]
  status: [planned, open, filled, frozen, closed]
  eff_key: [position_code_lower]
  columns:
    - [position_code, text, req]
    - [title, text, req]
    - [org_unit_id, uuid, req, fk org.org_units]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [reports_to_position_id, uuid, opt, fk hrm.positions]
    - [location_id, uuid, opt, fk org.locations]
    - [cost_center_ref, uuid, opt]
    - [budgeted_fte, pct, req]
  notes: "One row per version; exclusion on (company_id, lower(position_code)) over the validity range."
  indexes: [[org_unit_id], [reports_to_position_id]]
  reqs: [POS-01, POS-02, POS-03, POS-04, POS-08]

- table: hrm.headcount_budgets
  purpose: Headcount-based model (POS-01) — sanctioned strength per unit and grade
  traits: [std, co, eff]
  eff_key: [org_unit_id, grade_id]
  columns:
    - [org_unit_id, uuid, req, fk org.org_units]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [sanctioned_count, int, req]
  reqs: [POS-01, POS-03]

# ---------------- policies ----------------
- table: hrm.policies
  purpose: Named policies by type (leave, attendance, shift, overtime, pay, expense, loan, benefits, performance)
  traits: [std, co, soft, name]
  columns:
    - [policy_type, code, req]
    - [source, "enum(pack,tenant)", req]
  unique: [[company_id, policy_type, lower(code)]]
  reqs: [POL-02, POL-04]

- table: hrm.policy_versions
  traits: [std, eff]
  status: [draft, active, retired]
  eff_key: [policy_id]
  columns:
    - [policy_id, uuid, req, fk hrm.policies]
    - [version, int, req]
    - [parameters, json, req, "validated against the policy type schema"]
    - [is_overridden, bool, req, "tenant changed a pack value"]
  unique: [[policy_id, version]]
  reqs: [POL-04, POL-06]

- table: hrm.policy_assignments
  purpose: Assigns a policy by attribute rule with precedence
  traits: [std, co, eff]
  columns:
    - [policy_id, uuid, req, fk hrm.policies]
    - [precedence, int, req]
    - [rule, json, req, "conditions on company, location, grade, employee type, unit, custom field"]
  indexes: [[policy_id], [company_id, precedence]]
  reqs: [POL-02, POL-03]

# ---------------- documents ----------------
- table: hrm.employee_documents
  purpose: Employee document vault entries (file in doc.files)
  traits: [std, co]
  status: [requested, submitted, verified, rejected, expired]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [document_type, code, req]
    - [file_id, uuid, opt, fk doc.files]
    - [issue_date, date, opt]
    - [expiry_date, date, opt]
    - [requested_due_date, date, opt]
    - [verified_by, uuid, opt]
  indexes: [[employment_id, document_type], [expiry_date]]
  reqs: [DOC-01, DOC-02, DOC-03]

- table: hrm.policy_publications
  purpose: Policy documents published to populations for acknowledgement
  traits: [std, co]
  status: [draft, published, withdrawn]
  columns:
    - [title_i18n, i18n, req]
    - [version, int, req]
    - [file_id, uuid, req, fk doc.files]
    - [audience_rule, json, req]
    - [requires_ack, bool, req]
    - [published_at, ts, opt]
  reqs: [DOC-06]

- table: hrm.policy_acknowledgements
  traits: [app, co]
  columns:
    - [publication_id, uuid, req, fk hrm.policy_publications]
    - [employment_id, uuid, req, fk hrm.employments]
    - [acknowledged_at, ts, req]
  unique: [[publication_id, employment_id]]
  reqs: [DOC-06]

# ---------------- onboarding and offboarding ----------------
- table: hrm.checklist_templates
  traits: [std, co, soft, name]
  columns:
    - [kind, "enum(onboarding,offboarding)", req]
    - [applies_rule, json, req, "employee type, company, location, role"]
  unique: [[company_id, kind, lower(code)]]
  reqs: [ONB-01, ONB-04]

- table: hrm.checklist_template_items
  traits: [std]
  columns:
    - [template_id, uuid, req, fk hrm.checklist_templates]
    - [seq, int, req]
    - [title_i18n, i18n, req]
    - [owner_kind, "enum(hr,it,admin,manager,employee,finance,department)", req]
    - [owner_role_id, uuid, opt, fk iam.roles]
    - [due_offset_days, int, req, "relative to joining or separation date"]
    - [is_clearance, bool, req, "blocks final settlement until done (FR-XM-29)"]
  reqs: [ONB-01, ONB-04]

- table: hrm.checklists
  traits: [std, co]
  status: [open, completed, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [template_id, uuid, req, fk hrm.checklist_templates]
    - [kind, "enum(onboarding,offboarding)", req]
    - [separation_id, uuid, opt, fk hrm.separations]
  reqs: [ONB-01, ONB-04]

- table: hrm.checklist_items
  traits: [std]
  status: [pending, done, not_applicable, waived]
  columns:
    - [checklist_id, uuid, req, fk hrm.checklists]
    - [template_item_id, uuid, req, fk hrm.checklist_template_items]
    - [owner_user_id, uuid, opt, fk iam.users]
    - [due_date, date, req]
    - [is_clearance, bool, req]
    - [completed_by, uuid, opt]
    - [completed_at, ts, opt]
    - [notes, text, opt]
  indexes: [[checklist_id], [owner_user_id, status]]
  reqs: [ONB-01, ONB-04, ONB-17]

- table: hrm.separations
  traits: [std, co]
  status: [submitted, accepted, rejected, withdrawn, completed]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, "enum(resignation,termination,end_of_contract,retirement,death,absconding,other)", req]
    - [submitted_on, date, req]
    - [notice_period_days, int, req, "from policy"]
    - [requested_last_day, date, opt]
    - [last_working_day, date, opt]
    - [notice_shortfall_days, int, opt]
    - [exit_reason_code, code, opt, "standard taxonomy (ONB-13)"]
    - [is_rehire_eligible, bool, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  indexes: [[employment_id]]
  reqs: [ONB-03, ONB-06, ONB-13, ONB-14]

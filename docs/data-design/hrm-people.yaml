# HRMIS: people, employment, structure, policies, documents, self-service requests, onboarding and exit.
# Spec 06a sections 5 to 8, 11, 12, 27. All tables in schema hrm.

# Slice S1.09b (ruling Q9, CR-036): people tables belong to feature key hrm.core.
- defaults:
  entitlement: hrm.core

- table: hrm.persons
  purpose: One row per human (FR-XM-28). Employments hang off the person
  traits: [std, soft, cust]
  columns:
    - [person_no, text, req, assigned by numbering]
    - [first_name, text, req]
    - [middle_name, text, opt]
    - [last_name, text, opt]
    - [name_local, text, opt, name in Urdu script]
    - [father_or_spouse_name, text, opt, common in Pakistani records]
    - [gender, "enum(male,female,other,unspecified)", req]
    - [date_of_birth, date, opt]
    - [marital_status, code, opt, option list]
    - [nationality_code, char(2), opt, fk ref.countries]
    - [religion, code, opt, only where a pack requires it (e.g. Hajj leave eligibility); field-secured]
    - [photo_file_id, uuid, opt, fk doc.files]
    - [party_ref, uuid, opt, kernel party when Finance or Procurement pays the person (Later); no FK]
    - [merged_into_person_id, uuid, opt, "fk hrm.persons; set when this person was merged into another (retired, FR-HRM-EMP-18)"]
  unique: [[lower(person_no)]]
  # S1.20a (CR-076 item 4, slice S1.20 rulings Q4 and Q5): the merge pointer (the merged person is retired, never deleted).
  added_in: {S1.20a: [merged_into_person_id]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {date_of_birth: personal, religion: personal}
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: person_no, type: hrm.person_no, assign: create, tenant_wide: yes, default: "P-{seq:6}", reset: never}
  reqs: [EMP-01, EMP-15, FR-XM-28]

- table: hrm.person_identifiers
  purpose: "National IDs, passports, tax numbers; validated per country pack"
  traits: [std]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, code, req, "cnic, nicop, passport, ntn, iqama ... from pack"]
    - [country_code, char(2), req]
    - [value, enc, req]
    - [value_hmac, hmac, req, duplicate detection]
    - [value_last4, text, opt, for display]
    - [issue_date, date, opt]
    - [expiry_date, date, opt]
    - [file_id, uuid, opt, fk doc.files]
  unique: [[kind, country_code, value_hmac]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {value: personal, value_last4: personal}
  reqs: [EMP-05, EMP-16, EMP-18]
  notes: One row per identifier; renewal updates issue and expiry dates (history in the audit log).

- table: hrm.person_contacts
  traits: [std]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(mobile,phone,email_personal,email_work,other)", req]
    - [value, text, req]
    - [is_primary, bool, req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {value: personal}
  reqs: [EMP-01]

- table: hrm.person_addresses
  traits: [std, eff]
  eff_key: [person_id, kind]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(permanent,current,mailing)", req]
    - [address, json, req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {address: personal}
  reqs: [EMP-01]

- table: hrm.person_relations
  purpose: "Family, dependents and emergency contacts in one table"
  traits: [std, soft]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [relation, code, req, "spouse, child, parent, sibling, other"]
    - [full_name, text, req]
    - [date_of_birth, date, opt]
    - [gender, text, opt]
    - [identifier, enc, opt]
    - [phone, text, opt]
    - [is_dependent, bool, req]
    - [is_emergency_contact, bool, req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {date_of_birth: personal, gender: personal, identifier: personal, phone: personal}
  reqs: [EMP-01, CMP-04, CMP-05]

- table: hrm.nominations
  purpose: "Nominees per scheme (provident fund, gratuity, insurance plan)"
  traits: [std, eff]
  eff_key: [person_id, scheme, relation_id]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [scheme, code, req, "pf, gratuity, or benefit plan code"]
    - [relation_id, uuid, req, fk hrm.person_relations]
    - [share, pct, req]
  checks: ["deferred: shares per (person_id, scheme) on any date sum to 1"]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  reqs: [CMP-04, CMP-05, PAY-26]

- table: hrm.person_qualifications
  purpose: "Education, previous experience, languages and certifications"
  traits: [std, soft]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [kind, "enum(education,experience,language,certification)", req]
    - [title, text, req, "degree, job title, language, certificate name"]
    - [institution, text, opt, "school, employer or issuing body"]
    - [start_date, date, opt]
    - [end_date, date, opt]
    - [expiry_date, date, opt, certifications (LND-05)]
    - [grade_or_level, text, opt]
    - [details, json, req]
    - [file_id, uuid, opt, fk doc.files]
    - [learning_record_id, uuid, opt, fk hrm.learning_records when earned through training]
  indexes: [[person_id, kind], [expiry_date, partial where expiry_date is not null]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {person: person_id}
  # S1.20a (CR-076 S1.20a detail a; slice S1.20 ruling Q1): generated writes closed; the HR person and employment services write.
  api_actions: [read]
  reqs: [EMP-01, LND-05]

# S1.20a (CR-076 S1.20a detail b, FR-HRM-EMP-18): the review queue of possible duplicate persons. A case is opened when HR
# sends a possible match to review (same name and birth date; same bank account from S1.20d) and closed as distinct or merged.
- table: hrm.person_duplicate_cases
  purpose: "Possible duplicate persons kept for HR review (FR-HRM-EMP-18)"
  traits: [std]
  status: [open, distinct, merged]
  added_in: S1.20a
  columns:
    - [person_id, uuid, req, "fk hrm.persons; the person whose creation raised the case"]
    - [other_person_id, uuid, req, "fk hrm.persons; the existing person it resembles"]
    - [match_kind, "enum(name_and_birth_date,bank_account)", req]
    - [source, "enum(create,import)", req]
    - [decided_by, uuid, opt, fk iam.users]
    - [decided_at, ts, opt]
    - [decision_note, text, opt]
  unique: [[person_id, other_person_id, match_kind]]
  indexes: [[status, created_at]]
  scope: {person: person_id}
  api_actions: [read]
  reqs: [EMP-18]

- table: hrm.employments
  purpose: One employment of a person with one company; transfers between companies create a new linked row (FR-XM-30)
  traits: [std, co, cust]
  status: [pre_joining, active, on_notice, separated, cancelled]
  columns:
    - [person_id, uuid, req, fk hrm.persons]
    - [employee_no, text, req, numbering per company]
    - [employee_type, code, req, "permanent, contract, probation, intern, daily_wage, consultant, part_time"]
    - [joining_date, date, req]
    - [service_start_date, date, req, carries over on intra-group transfer]
    - [confirmation_date, date, opt]
    - [expected_end_date, date, opt]
    - [separation_date, date, opt]
    - [previous_employment_id, uuid, opt, fk hrm.employments (transfer or rehire)]
    - [user_ref, uuid, opt, iam.users.id]
    - [is_primary, bool, req, one primary per person (multiple concurrent assignments are 1.1)]
  unique: [[company_id, lower(employee_no)], [person_id, "where is_primary and status in ('pre_joining','active','on_notice')"]]
  # S1.20b (CR-076 S1.20b detail; slice S1.20 ruling Q8): one current employment per user per company (FR-HRM-EMP-17).
  uniques_added_in: {S1.20b: [[company_id, user_ref, "where user_ref is not null and status in ('pre_joining','active','on_notice')"]]}
  indexes: [[person_id], [company_id, status]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: id, person: person_id, attributes: [status, employee_type]}
  # S1.20b (CR-076 S1.20b detail; slice S1.20 ruling Q1, R-113): generated writes closed; the HR employment services write.
  api_actions: [read]
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: employee_no, type: hrm.employee_no, assign: create, override: yes, default: "EMP-{seq:5}", reset: never}
  reqs: [EMP-02, EMP-04, EMP-07, EMP-15, EMP-17, FR-XM-30]

- table: hrm.employment_assignments
  purpose: Effective-dated job details; every change closes the current row and opens a new one
  traits: [std, co, eff]
  eff_key: [employment_id]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [event_id, uuid, req, fk hrm.employment_events]
    - [org_unit_id, uuid, req, fk org.org_units]
    - [position_id, uuid, opt, fk hrm.positions]
    - [title, text, req]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [branch_id, uuid, req, fk org.branches]
    - [location_id, uuid, opt, fk org.locations]
    - [manager_employment_id, uuid, opt, fk hrm.employments]
    - [pay_group_id, uuid, opt, fk hrm.pay_groups]
    - [cost_allocation, json, req, "list of {cost_center_ref or department, pct}; must sum to 1"]
    - [fte, pct, req, default 1]
    - [work_schedule, code, opt]
    - [is_acting, bool, req]
  indexes: [[employment_id, valid_from], [org_unit_id], [manager_employment_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, branch: branch_id, org_unit: org_unit_id, employment: employment_id}
  # S1.20b (CR-076 S1.20b detail; ruling Q1, R-113): generated writes closed; rows follow the employment events.
  api_actions: [read]
  reqs: [EMP-02, EMP-03, POS-01]
  notes: Cycle check trigger on manager_employment_id.

- table: hrm.employment_events
  purpose: "Why something changed (hire, promotion, transfer ... termination) with reason code"
  traits: [std, co]
  status: [draft, pending_approval, approved, effective, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, "enum(hire,rehire,promotion,demotion,transfer,grade_change,acting,secondment,confirmation,probation_extension,salary_revision,separation,data_correction)", req]
    - [reason_code, code, req, option list]
    - [effective_date, date, req]
    - [notes, text, opt]
    - [carry_over, json, opt, "intra-group transfer: service, leave, loans rules (FR-XM-30)"]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [letter_document_id, uuid, opt, fk doc.generated_documents]
    - [changes, json, opt, "what the event changes: assignment and employment fields with their new values, and the backdated change check (S1.20b)"]
    - [corrects_event_id, uuid, opt, "fk hrm.employment_events; the earlier event a data_correction replaces (FR-XM-05: never edited)"]
  indexes: [[employment_id, effective_date]]
  # S1.20b (CR-076 S1.20b detail; slice S1.20 rulings Q2, Q11, Q12): the requested changes are kept on the event, so an event
  # waiting for approval or dated in the future applies exactly what was asked, and a correction names the event it replaces.
  added_in: {S1.20b: [changes, corrects_event_id]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.20b (CR-076 S1.20b detail; ruling Q1, R-113): generated writes closed; events are recorded by the HR employment services.
  api_actions: [read]
  # S1.20b review finding 4: `changes` holds job details (and, from S1.34, pay), so the generated read hides it unless the role is
  # granted the salary class (GHR-06); the timeline shows it field by field under the assignment and employment rules.
  field_class: {changes: salary}
  reqs: [EMP-03, EMP-11, FR-XM-30]

- table: hrm.contracts
  traits: [std, co]
  status: [draft, active, expired, renewed, terminated]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [contract_no, text, req]
    - [start_date, date, req]
    - [end_date, date, opt]
    - [renewal_notice_days, int, opt]
    - [terms, json, req]
    - [file_id, uuid, opt, fk doc.files]
    - [renews_contract_id, uuid, opt, fk hrm.contracts]
  indexes: [[employment_id], [end_date]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: contract_no, type: hrm.contract_no, assign: create, default: "CON-{yyyy}-{seq:5}", reset: yearly, date: start_date}
  # S1.08 review finding 1 (CR-058, closes R-016): one contract number per company, like the other numbered tables.
  uniques_added_in: {S1.08-r1: [[company_id, contract_no]]}
  reqs: [EMP-09]

- table: hrm.probation_records
  traits: [std, co]
  status: [in_progress, extended, confirmed, not_confirmed]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [start_date, date, req]
    - [end_date, date, req]
    - [extended_to, date, opt]
    - [review_form_response_id, uuid, opt, fk hrm.form_responses]
    - [decision_date, date, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [EMP-10, ONB-12]

- table: hrm.employee_bank_accounts
  traits: [std, co, eff]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [payment_mode, "enum(bank_transfer,cheque,cash,mobile_wallet)", req]
    - [bank_id, uuid, opt, fk ref.banks]
    - [account_title, text, opt]
    - [account_number, enc, opt]
    - [account_number_hmac, hmac, opt, normalized with bank; ghost-employee duplicate check]
    - [iban, enc, opt]
    - [iban_hmac, hmac, opt]
    - [split_kind, "enum(remainder,percent,amount)", req]
    - [split_value, money, opt]
    - [priority, int, req]
  checks: [bank fields required when payment_mode = bank_transfer or mobile_wallet]
  indexes: [[employment_id, valid_from], [account_number_hmac], [iban_hmac]]
  notes: Changes go through maker-checker (iam.maker_checker_requests).
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {account_title: personal, account_number: personal, iban: personal}
  reqs: [EMP-06, PAY-24]
  eff_key: [employment_id, priority]

- table: hrm.employment_statutory_registrations
  purpose: "Per-employee applicability and registration for EOBI, provincial social security and provident fund"
  traits: [std, co, eff]
  eff_key: [employment_id, scheme]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [scheme, code, req, "eobi, pessi, sessi, kp_ess, bessi, pf ... from pack"]
    - [is_applicable, bool, req]
    - [exemption_reason, text, opt]
    - [registration_no, enc, opt]
    - [registration_no_hmac, hmac, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.07 (CR-026, Q5): personal fields; the audit log encrypts their values with the person's key (R-21).
  field_class: {registration_no: personal}
  reqs: [PAY-20, CPL-02]

- table: hrm.change_requests
  purpose: "Employee self-service changes to their own data, approved before applying (EMP-08)"
  traits: [std, co]
  status: [submitted, approved, rejected, applied, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [entity_type, text, req]
    - [entity_id, uuid, opt]
    - [proposed, json, req]
    - [current_snapshot, json, req]
    - [file_ids, "uuid[]", req]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [EMP-08, SSP-12]

- table: hrm.service_requests
  purpose: "General HR requests from self-service (letters, documents, other)"
  traits: [std, co, br]
  status: [submitted, in_progress, fulfilled, rejected, cancelled]
  columns:
    - [request_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, code, req, "letter, document, other"]
    - [template_id, uuid, opt, fk doc.templates]
    - [details, json, req]
    - [generated_document_id, uuid, opt, fk doc.generated_documents]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, request_no]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, branch: branch_id, employment: employment_id}
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: request_no, type: hrm.service_request_no, assign: create, default: "SR-{yyyy}-{seq:5}", reset: yearly}
  reqs: [DOC-07, SSP-12]

- table: hrm.employee_letters
  purpose: "Letters issued to an employee (offer, appointment, confirmation, increment, promotion, transfer, warning, experience, salary certificate)"
  traits: [std, co]
  status: [draft, pending_approval, approved, issued, acknowledged, cancelled]
  columns:
    - [letter_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [template_id, uuid, req, fk doc.templates]
    - [letter_type, code, req]
    - [data, json, req, "merged values, frozen at issue"]
    - [contains_salary, bool, req, only roles with salary permission may generate or view (DOC-08)]
    - [generated_document_id, uuid, opt, fk doc.generated_documents]
    - [issued_at, ts, opt]
    - [emailed_at, ts, opt]
    - [acknowledged_at, ts, opt]
    - [source_type, text, opt, "employment_event, service_request, final_settlement"]
    - [source_id, uuid, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, letter_no]]
  indexes: [[employment_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: letter_no, type: hrm.letter_no, assign: post, gap_free: yes, default: "LTR-{yyyy}-{seq:5}", reset: yearly}
  reqs: [DOC-04, DOC-05, DOC-07, DOC-08, CMP-06]

- table: hrm.grades
  traits: [std, co, soft, name]
  columns:
    - [rank, int, req, ordering]
    - [defaults, json, req, leave and policy defaults]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [POS-06]

- table: hrm.positions
  traits: [std, co, eff, cust]
  status: [planned, open, filled, frozen, closed]
  eff_key: [company_id, position_code_lower]
  columns:
    - [position_code, text, req]
    - [position_code_lower, text, req, generated always as lower(position_code) stored]
    - [title, text, req]
    - [org_unit_id, uuid, req, fk org.org_units]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [reports_to_position_id, uuid, opt, fk hrm.positions]
    - [location_id, uuid, opt, fk org.locations]
    - [cost_center_ref, uuid, opt]
    - [budgeted_fte, pct, req]
  indexes: [[org_unit_id], [reports_to_position_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, org_unit: org_unit_id}
  # S1.22a (CR-078 S1.22a detail a; slice S1.22 Build item 3): generated writes closed; the HR position service creates, changes
  # from a date, freezes and closes a position (a change adds a row, so the generated update would rewrite history).
  api_actions: [read]
  reqs: [POS-01, POS-02, POS-03, POS-04, POS-08]
  notes: Cycle check trigger on reports_to_position_id.

- table: hrm.headcount_budgets
  purpose: Headcount-based model (POS-01) — sanctioned strength per unit and grade
  traits: [std, co, eff]
  eff_key: [org_unit_id, grade_id]
  columns:
    - [org_unit_id, uuid, req, fk org.org_units]
    - [grade_id, uuid, opt, fk hrm.grades]
    - [sanctioned_count, int, req]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, org_unit: org_unit_id}
  reqs: [POS-01, POS-03]

# S1.22a (CR-078 S1.22a detail d; slice S1.22 Build item 5, ruling Q5, BR-04): the permission to place one person beyond a position's
# budgeted FTE or a unit and grade's sanctioned count. Requested through the HR service, decided through the workflow engine
# (document type hrm.strength_exception), used by one placement: the employment event that places the person names it.
- table: hrm.strength_exceptions
  purpose: "Approved exception to the position budget or sanctioned count for one placement (BR-04)"
  traits: [std, co]
  status: [pending_approval, approved, rejected, cancelled, used]
  added_in: S1.22a
  columns:
    - [employment_id, uuid, req, "fk hrm.employments; the person to place"]
    - [org_unit_id, uuid, req, "fk org.org_units; the unit of the placement"]
    - [grade_id, uuid, opt, "fk hrm.grades; the grade of the placement"]
    - [position_id, uuid, opt, "fk hrm.positions; the position of the placement (a row of it; positions are matched by code)"]
    - [effective_date, date, req, "the day the placement starts"]
    - [reason, text, req]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [used_event_id, uuid, opt, "fk hrm.employment_events; the event that used the exception"]
  indexes: [[employment_id, status]]
  scope: {company: company_id, employment: employment_id, org_unit: org_unit_id}
  api_actions: [read]
  reqs: [POS-01, POS-02]

- table: hrm.policies
  purpose: "Named policies by type (leave, attendance, shift, overtime, pay, expense, loan, benefits, performance)"
  traits: [std, co, soft, name]
  columns:
    - [policy_type, code, req]
    - [source, "enum(pack,tenant)", req]
  unique: [[company_id, policy_type, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [POL-02, POL-04]

- table: hrm.policy_versions
  traits: [std, eff]
  status: [draft, active, retired]
  eff_key: [policy_id]
  columns:
    - [policy_id, uuid, req, fk hrm.policies]
    - [version, int, req]
    - [parameters, json, req, validated against the policy type schema]
    - [is_overridden, bool, req, tenant changed a pack value]
  unique: [[policy_id, version]]
  reqs: [POL-04, POL-06]
  notes: "Exclusion on policy_id applies where status <> 'draft'; dates assigned on activation."

- table: hrm.policy_assignments
  purpose: Assigns a policy by attribute rule with precedence
  traits: [std, co, eff]
  columns:
    - [policy_id, uuid, req, fk hrm.policies]

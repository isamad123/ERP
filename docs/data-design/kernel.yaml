    - [source, "enum(product,tenant)", req, "default product; product jobs come from the module job manifests (CR-045)"]
  unique: [[code]]
  # S1.11a (CR-045 item 1): owner, priority and source of a job.
  added_in: {S1.11a: [owner_user_id, priority, source]}

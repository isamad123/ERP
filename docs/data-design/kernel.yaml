    - [title, text, req]
    - [body, text, req]
    - [link, text, opt]
    - [read_at, ts, opt]
    - [dedup_key, text, opt, "event id and recipient: one item per event and person (CR-048, KRN-NTF-05)"]
    - [event_group, code, opt, "preference group of the event (CR-048)"]
  indexes: [[user_id, read_at, created_at]]
  # S1.11b1 (CR-048): items are written by the notification consumer; a person reads, marks and searches only their own.
  added_in: {S1.11b: [dedup_key, event_group]}
  uniques_added_in: {S1.11b: [[user_id, dedup_key, "where dedup_key is not null"]]}
  api_actions: [read]
  # S1.11b1 (CR-048): the consumer writes items and a person marks their own read; the item itself is the record (delivery audit HRM-NTF-16).
  audit: false
  audit_reason: "a person's own notification item: created by the notification consumer, only its read state changes; delivery results of audited events go to the audit log (S1.11b1)"
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  reqs: [HRM-NTF-09]


- table: ntf.outbound_messages
  traits: [std]
  partition: range (created_at) monthly; processed rows purged after 30 days
  status: [queued, sent, failed, dead]
  columns:
    - [channel, text, req]
    - [recipient, text, req]
    - [template_id, uuid, opt, fk ntf.templates]
    - [payload, json, req]
    - [dedup_key, text, opt]
    - [attempts, int, req]
    - [next_attempt_at, ts, opt]
    - [provider_ref, text, opt]
    - [error, text, opt]
    - [user_id, uuid, opt, "fk iam.users; the person the message is for (none for the operator address) (CR-045)"]
    - [event_code, code, opt, "catalogue event of the message (CR-045)"]
    - [company_id, uuid, opt, "company of the event, for the delivery log filter and scope (CR-045)"]
    - [secret, enc, opt, "reset link or code of an identity e-mail, encrypted; cleared once the message is sent or ends (CR-049)"]
  indexes: [[status, next_attempt_at, "partial where status='queued'"]]
  # S1.11b2 (CR-045, CR-049): delivery log columns; the queue is written only by the notification services and the sender job.
  added_in: {S1.11b-r1: [user_id, event_code, company_id, secret]}
  indexes_added_in: {S1.11b-r1: [[user_id], [event_code, created_at], [company_id]]}
  api_actions: [read]
  scope: {company: company_id}
  # S1.07 audit key (CR-026, CR-045, CR-049): the change log skips the queue rows; the sender writes one change-log entry per
  # delivery result of events marked audited (HRM-NTF-16).
  audit: false
  audit_reason: "machinery: delivery queue; the delivery results of events marked audited are written to the change log by the sender job (HRM-NTF-16, S1.11b2)"
  reqs: [KRN-NTF-05, KRN-NTF-07, ADM-OPS-04]
  key: [id, created_at]
  unique: [[dedup_key, created_at, where dedup_key is not null]]

- table: ntf.in_app_items
  traits: [std]
  columns:
    - [user_id, uuid, req, fk iam.users]

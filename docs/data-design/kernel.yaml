# Kernel tables inside every tenant database. Spec 02 and spec 03 sections 5 and 6, trimmed to Release 1.0.
# ---------------- iam: identity and access ----------------

- table: iam.users
  purpose: "People who sign in (employees, HR, admins)"
  traits: [std, soft]
  status: [invited, active, locked, disabled, archived]
  columns:
    - [username, text, req, unique lower()]
    - [email, text, req, unique lower()]
    - [display_name, text, req]
    - [default_company_id, uuid, opt, fk org.companies]
    - [language, char(2), req, en or ur in 1.0]
    - [time_zone, text, req, "IANA, default Asia/Karachi"]
    - [last_login_at, ts, opt]
    - [employee_ref, uuid, opt, links to hrm.employments.id; no FK (module boundary)]
    - [is_system, bool, req, reserved job and system users]
    - [access_valid_to, date, opt, automatic disable date]
  unique: [[lower(username)], [lower(email)]]
  # CR-012 (S1.05): status changes only through the user status service (transitions, user limit, session revocation).
  api_read_only: [status, is_system, last_login_at]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: id}
  api_actions: [read, create, update]
  reqs: [KRN-IAM-01, ADM-USR-01, ADM-USR-03, ADM-USR-07]

- table: iam.user_credentials
  purpose: Password hash kept apart from the user row
  key: [user_id]
  columns:
    - [user_id, uuid, req, "pk, fk iam.users"]
    - [password_hash, text, req]
    - [hash_algorithm, code, req]
    - [password_changed_at, ts, req]
    - [must_change, bool, req]
    - [failed_attempts, int, req, default 0]
    - [locked_until, ts, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "secrets and sign-in counters; password, lockout and credential changes are security events (S1.07 Q4, Q7)"
  reqs: [KRN-IAM-01, ADM-USR-05, ADM-USR-20]

- table: iam.password_history
  traits: [app]
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [password_hash, text, req]
  indexes: [[user_id, created_at]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  reqs: [ADM-USR-20]

- table: iam.mfa_devices
  traits: [std]
  status: [pending, active, revoked]
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [kind, "enum(totp,email,sms,hardware)", req]
    - [secret, enc, opt]
    - [label, text, opt]
    - [last_used_at, ts, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  reqs: [KRN-IAM-02, ADM-USR-21]

- table: iam.sessions
  purpose: Durable record of sign-in sessions (active copies cached in Valkey)
  traits: [app]
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [issued_at, ts, req]
    - [last_seen_at, ts, req, "updated by session service only (exception to append-only, documented)"]
    - [expires_at, ts, req]
    - [ip_address, inet, opt]
    - [user_agent, text, opt]
    - [revoked_at, ts, opt]
    - [revoked_reason, text, opt]
    - [refresh_token_hash, text, opt, "SHA-256 (hex) of the current refresh token; replaced on every refresh"]
    - [previous_refresh_hash, text, opt, "SHA-256 (hex) of the refresh token replaced by the last rotation; only a match with it counts as reuse"]
  indexes: [[user_id, issued_at]]
  notes: "Not strictly append-only: last_seen_at and revoked_* are updatable by the session service role only."
  # CR-010 (S1.05): refresh-token hash on the session; rotation on every refresh (product owner, S1.05 plan P6).
  # CR-016 (S1.05 review finding 6): the previous hash, so a wrong secret is a plain failure and only a reused old token ends the session.
  added_in: {S1.05: [refresh_token_hash], S1.05-r1: [previous_refresh_hash]}
  updatable_added_in:
    S1.05:
      columns: [refresh_token_hash]
      note: "From S1.05 the session service also replaces refresh_token_hash on every refresh (rotation, CR-010)."
    S1.05-r1:
      columns: [previous_refresh_hash]
      note: "From S1.05-r1 it also keeps previous_refresh_hash, the token replaced by the last rotation (reuse detection, CR-016)."
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4); last_seen_at is machinery"
  reqs: [KRN-IAM-04, ADM-USR-24]

- table: iam.login_attempts
  traits: [app]
  partition: "range (occurred_at) monthly; key (id, occurred_at)"
  columns:
    - [occurred_at, ts, req]
    - [username, text, req]
    - [outcome, "enum(success,bad_password,locked,mfa_failed,disabled)", req]
    - [ip_address, inet, opt]
  indexes: [[username, occurred_at]]
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  reqs: [KRN-AUD-02]

# CR-010 (S1.05): tokens and recovery codes are stored only as hashes.
- table: iam.one_time_tokens
  purpose: "Single-use, expiring tokens for account activation and sign-in steps"
  traits: [std]
  added_in: S1.05
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [purpose, "enum(activation,mfa_challenge,password_change,mfa_enrolment)", req]
    - [token_hash, text, req, SHA-256 (hex) of the token; the token itself is never stored]
    - [expires_at, ts, req]
    - [used_at, ts, opt]
  unique: [[token_hash]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "machinery: single-use token hashes; issuing and using them are security events (S1.07 Q4)"
  reqs: [KRN-IAM-01, KRN-IAM-02, ADM-USR-05]

- table: iam.mfa_recovery_codes
  purpose: "One-time recovery codes for a user's second factor"
  traits: [std]
  added_in: S1.05
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [code_hash, text, req, Argon2id hash of the code; the code is shown once]
    - [used_at, ts, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "machinery: one-time code hashes; regeneration is a security event (S1.07 Q4)"
  reqs: [KRN-IAM-02, ADM-USR-21]

- table: iam.permissions
  purpose: Registered from module manifests at start-up
  traits: [std]
  columns:
    - [code, text, req, "module.resource.action, e.g. hrm.payroll.approve"]
    - [module_id, code, req]
    - [description_i18n, i18n, req]
    - [is_sensitive, bool, req]
    - [retired_at, ts, opt, "set when no module declares the code any more; never deleted, grants nothing (CR-021)"]
  unique: [[code]]
  added_in: {S1.06: [retired_at]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  api_actions: [read]
  reqs: [KRN-IAM-10, ADM-ROL-01]

- table: iam.roles
  traits: [std, soft, name]
  columns:
    - [description_i18n, i18n, opt]
    - [source, "enum(module,pack,tenant)", req]
    - [baseline_code, code, opt, baseline role it was copied from]
  unique: [[lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  api_actions: [read]
  reqs: [KRN-IAM-11, ADM-ROL-02, ADM-ROL-03]

- table: iam.role_permissions
  key: [role_id, permission_id]
  columns:
    - [role_id, uuid, req, fk iam.roles]
    - [permission_id, uuid, req, fk iam.permissions]
  reqs: [KRN-IAM-10]

- table: iam.data_scopes
  purpose: "Reusable record filters (own, team, subtree, company, branch, department list)"
  traits: [std, name]
  columns:
    - [kind, "enum(own,direct_team,subtree,org_units,branches,companies,all)", req]
    - [definition, json, req, parameters for the kind]
  unique: [[lower(code)]]
  # CR-025 (S1.06 review finding 2): scopes are shared by roles; created by the access service, never edited in place.
  api_actions: [read]
  reqs: [KRN-IAM-12, ADM-ROL-06]

- table: iam.role_data_scopes
  key: [role_id, resource_type]
  columns:
    - [role_id, uuid, req, fk iam.roles]
    - [resource_type, text, req, e.g. hrm.employment]
    - [data_scope_id, uuid, req, fk iam.data_scopes]
  reqs: [KRN-IAM-12]

- table: iam.field_policies
  purpose: Field-level security per role
  traits: [std]
  columns:
    - [role_id, uuid, req, fk iam.roles]
    - [resource_type, text, req]
    - [field_key, text, req, includes custom fields]
    - [access, "enum(hidden,masked,read_only,editable)", req]
  unique: [[role_id, resource_type, field_key]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  api_actions: [read]
  reqs: [KRN-IAM-13, ADM-ROL-07]

- table: iam.user_roles
  traits: [std, eff]
  eff_key: [user_id, role_id, company_id]
  columns:
    - [user_id, uuid, req, fk iam.users]
    - [role_id, uuid, req, fk iam.roles]
    - [company_id, uuid, opt, fk org.companies; null means all companies]
    - [reason, text, opt]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, user: user_id}
  api_actions: [read]
  reqs: [KRN-IAM-11, ADM-ROL-04]

- table: iam.user_groups
  traits: [std, soft, name]
  unique: [[lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  api_actions: [read]
  reqs: [ADM-USR-06]

- table: iam.user_group_members
  key: [group_id, user_id]
  columns:
    - [group_id, uuid, req, fk iam.user_groups]
    - [user_id, uuid, req, fk iam.users]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: user_id}
  reqs: [ADM-USR-06]

# CR-019 (S1.06 Q7): roles given to a user group; a user's roles are their own assignments plus their groups'.
- table: iam.user_group_roles
  purpose: Roles given to every member of a user group (FR-ADM-USR-06)
  traits: [std, eff]
  added_in: S1.06
  eff_key: [group_id, role_id, company_id]
  columns:
    - [group_id, uuid, req, fk iam.user_groups]
    - [role_id, uuid, req, fk iam.roles]
    - [company_id, uuid, opt, fk org.companies; null means all companies]
    - [reason, text, opt]
  scope: {company: company_id}
  api_actions: [read]
  reqs: [ADM-USR-06, KRN-IAM-11]

- table: iam.delegations
  purpose: Approval delegation and out-of-office substitution
  traits: [std]
  status: [active, revoked]
  columns:
    - [from_user_id, uuid, req, fk iam.users]
    - [to_user_id, uuid, req, "fk iam.users; check <> from_user_id"]
    - [scope, json, req, "document types, companies"]
    - [valid_from, ts, req]
    - [valid_to, ts, req]
    - [reason, text, opt]
  indexes: [[to_user_id, valid_from]]
  reqs: [KRN-WFL-05, ADM-ROL-09, HRM-ROL-05, HRM-SSP-07]

- table: iam.maker_checker_requests
  purpose: Sensitive changes held for a second person
  traits: [std]
  status: [pending, approved, rejected, expired]
  columns:
    - [action_type, code, req]
    - [subject_type, text, req]
    - [subject_id, uuid, req]
    - [payload, json, req]
    - [requested_by, uuid, req, fk iam.users]
    - [decided_by, uuid, opt, "fk iam.users; check <> requested_by"]
    - [decided_at, ts, opt]
    - [reason, text, opt]
  indexes: [[status, created_at]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: requested_by}
  api_actions: [read]
  reqs: [KRN-IAM-14, ADM-SET-04, HRM-PAY-13]

- table: iam.api_clients
  purpose: API keys for integrations such as biometric middleware and HR data feeds (ADM-SEC-02); OAuth client credentials are Release 1.1
  traits: [std, soft]
  status: [active, revoked, expired]
  columns:
    - [name, text, req]
    - [client_id, text, req]
    - [secret_hash, text, req, shown once at creation]
    - [scopes, "text[]", req]
    - [ip_allow, "text[]", req]
    - [rate_limit_per_minute, int, req]
    - [expires_at, ts, opt]
    - [last_used_at, ts, opt]
  unique: [[client_id]]
  reqs: [ADM-SEC-02, KRN-INT-07]

- table: org.companies
  purpose: Legal entities
  traits: [std, soft, name]
  status: [active, inactive]
  columns:
    - [legal_name, text, req]
    - [country_code, char(2), req]
    - [base_currency_code, char(3), req, fk ref.currencies]
    - [default_language, char(2), req]
    - [holiday_calendar_id, uuid, opt, fk ref.calendars]
    - [logo_file_id, uuid, opt, fk doc.files]
    - [cost_center_model, "enum(none,external_ref)", req, Finance cost centres are Later]
  unique: [[lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: id}
  reqs: [KRN-ORG-01, ADM-ORG-01]

- table: org.company_registrations
  purpose: "Tax and statutory registration numbers of a company (NTN, EOBI, social security)"
  traits: [std, eff]
  eff_key: [company_id, kind, authority]
  columns:
    - [company_id, uuid, req, fk org.companies]
    - [kind, "enum(ntn,strn,eobi,social_security,provident_fund,commercial_registration,other)", req]
    - [value, enc, req]
    - [value_hmac, hmac, req]
    - [authority, code, req, "e.g. PESSI, SESSI, EOBI, FBR; 'none' when not applicable"]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [KRN-ORG-01, HRM-CPL-02]

- table: org.company_bank_accounts
  purpose: Company accounts used to pay salaries
  traits: [std, co, soft]
  columns:
    - [bank_code, code, req, from ref.banks]
    - [account_title, text, req]
    - [account_number, enc, req]
    - [iban, enc, opt]
    - [iban_hmac, hmac, opt]
    - [currency_code, char(3), req]
    - [salary_file_format, code, opt, doc.templates code of the bank file format]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  reqs: [HRM-PAY-23]

- table: org.branches
  traits: [std, co, soft, name]
  unique: [[company_id, lower(code)]]
  notes: Every company has at least one branch; small customers get one created automatically (rule SC-2).
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, branch: id}
  reqs: [KRN-ORG-02]

- table: org.locations
  purpose: "Physical sites (office, factory, warehouse)"
  traits: [std, co, soft, name]
  columns:
    - [branch_id, uuid, req, fk org.branches]
    - [address, json, req]
    - [region_code, code, req, "province or state, e.g. PB, SD, KP, BA, ICT; selects provincial tables"]
    - [latitude, "numeric(9,6)", opt, for 1.1 geo-attendance; plain columns (D-36)]
    - [longitude, "numeric(9,6)", opt]
    - [time_zone, text, req]
    - [holiday_calendar_id, uuid, opt, fk ref.calendars]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, branch: branch_id}
  reqs: [KRN-ORG-02, ADM-ORG-02]

- table: org.org_unit_types
  traits: [std, name]
  columns:
    - [level_hint, int, opt]
  unique: [[lower(code)]]
  reqs: [KRN-ORG-03, ADM-ORG-04]

- table: org.org_units
  traits: [std, co, soft, cust, name]
  notes: "Not effective-dated: renames and moves are audited; hierarchy changes are dated in org.org_unit_links."
  columns:
    - [unit_type_id, uuid, req, fk org.org_unit_types]
    - [location_id, uuid, opt, fk org.locations]
    - [cost_center_ref, uuid, opt, "Finance, Later; no FK"]
    - [head_position_ref, uuid, opt, hrm.positions.id; no FK]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, org_unit: id}
  reqs: [KRN-ORG-03, ADM-ORG-03]

- table: org.org_hierarchies
  traits: [std, name]
  columns:
    - [kind, "enum(reporting,legal,geographic)", req]
  unique: [[lower(code)]]
  reqs: [KRN-ORG-03]

- table: org.org_unit_links
  purpose: "Parent of each unit per hierarchy, effective-dated"
  traits: [std, eff]
  eff_key: [hierarchy_id, unit_id]
  columns:
    - [hierarchy_id, uuid, req, fk org.org_hierarchies]
    - [unit_id, uuid, req, fk org.org_units]
    - [parent_unit_id, uuid, opt, fk org.org_units; null for root; cycle check by trigger]
  indexes: [[hierarchy_id, parent_unit_id]]
  reqs: [KRN-ORG-03, ADM-ORG-03]

- table: ref.currencies
  key: [code]
  columns:
    - [code, char(3), req, pk]
    - [name_i18n, i18n, req]
    - [symbol, text, req]
    - [decimals, int, req]
    - [is_active, bool, req]
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "reference data keyed by code, written only by migrations and country packs (no uuid key, no API) (S1.07 Q4)"
  reqs: [KRN-LOC-04]

- table: ref.countries
  key: [code]
  columns:
    - [code, char(2), req, pk]
    - [name_i18n, i18n, req]
    - [is_active, bool, req]
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "reference data keyed by code, written only by migrations and country packs (no uuid key, no API) (S1.07 Q4)"
  reqs: [KRN-LOC-02]

- table: ref.banks
  purpose: "Banks per country, seeded by the country pack"
  traits: [std, name]
  columns:
    - [country_code, char(2), req, fk ref.countries]
    - [swift_code, text, opt]
    - [iban_prefix, text, opt]
  unique: [[country_code, lower(code)]]
  reqs: [HRM-EMP-06, HRM-PAY-23]

- table: ref.calendars
  purpose: "Holiday calendars per country, company or location"
  traits: [std, name]
  columns:
    - [country_code, char(2), opt]
    - [source, "enum(pack,tenant)", req]
  unique: [[lower(code)]]
  reqs: [KRN-LOC-06, ADM-LOC-04, HRM-ATT-15]

- table: ref.holidays
  traits: [std]
  columns:
    - [calendar_id, uuid, req, fk ref.calendars]
    - [holiday_date, date, req]
    - [name_i18n, i18n, req]
    - [kind, "enum(public,religious,optional,restricted)", req]
    - [is_tentative, bool, req, moon-sighting dates confirmed later]
  unique: [[calendar_id, holiday_date]]
  reqs: [HRM-ATT-15]

- table: cfg.settings
  purpose: Setting definitions registered from manifests
  key: [key]
  columns:
    - [key, text, req, pk]
    - [module_id, code, req]
    - [data_type, "enum(bool,int,decimal,text,choice,list,json)", req]
    - [default_value, json, req]
    - [validation, json, req]
    - [allowed_layers, "text[]", req, "product, pack, tenant, company, role, user"]
    - [requires_approval, bool, req]
    - [description_i18n, i18n, req]
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "setting definitions keyed by code, registered from manifests by migrations (no uuid key, no API); values are audited in cfg.setting_values (S1.07 Q4)"
  reqs: [KRN-SET-01, ADM-SET-01]

- table: cfg.setting_values
  traits: [std]
  columns:
    - [setting_key, text, req, fk cfg.settings]
    - [layer, "enum(pack,tenant,company,role,user)", req]
    - [scope_id, uuid, opt, "company, role or user id; null for tenant"]
    - [value, json, req]
  unique: [[setting_key, layer, scope_id]]
  reqs: [KRN-SET-02, ADM-SET-03]

- table: cfg.setting_value_history
  traits: [app]
  columns:
    - [setting_value_id, uuid, req]
    - [setting_key, text, req]
    - [layer, text, req]
    - [scope_id, uuid, opt]
    - [old_value, json, opt]
    - [new_value, json, opt]
    - [reason, text, opt]
  indexes: [[setting_key, created_at]]
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  reqs: [KRN-SET-04, ADM-SET-06]

- table: cfg.feature_flags
  key: [key]
  columns:
    - [key, text, req, pk]
    - [default_enabled, bool, req]
    - [description_i18n, i18n, req]

- table: wf.workflow_instances
  traits: [std, co]
  status: [running, approved, rejected, cancelled, failed, returned]
  columns:
    - [version_id, uuid, req, fk wf.workflow_versions]
    - [document_type, text, req]
    - [document_id, uuid, req]
    - [requester_user_id, uuid, req, fk iam.users]
    - [started_at, ts, req]
    - [completed_at, ts, opt]
    - [context, json, req, "values used by conditions, frozen at start"]
    - [subject_user_ids, "uuid[]", req, "the people the document is about; excluded from approving like the requester (CR-041, Q6)"]
  indexes: [[document_type, document_id], [status, "partial where status='running'"]]
  # S1.10a (CR-041 items 1 and 4, Q6, Q7, Q14): status returned (waiting for the requester), subjects; engine writes only.
  enum_added_in: {S1.10a: {status: [returned]}}
  added_in: {S1.10a: [subject_user_ids]}
  # S1.11f2 (R-023, CR-054): one open request per document in the database too, besides the engine's lock.
  uniques_added_in: {S1.11f-r2: [[document_type, document_id, "where status in ('running', 'returned')"]]}
  api_actions: [read]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  # S1.10b (CR-043, ruling P1): the company locator, so a role limited to companies reads only their requests.
  scope: {user: requester_user_id, company: company_id}
  reqs: [KRN-WFL-01, KRN-WFL-10]

- table: wf.workflow_tasks
  traits: [std]
  status: [pending, approved, rejected, changes_requested, reassigned, skipped, escalated]
  columns:
    - [instance_id, uuid, req, fk wf.workflow_instances]
    - [step_key, text, req]
    - [assignee_user_id, uuid, opt, fk iam.users]
    - [assignee_role_id, uuid, opt, fk iam.roles]
    - [acting_for_user_id, uuid, opt, delegation]
    - [due_at, ts, opt]
    - [escalated_at, ts, opt]
    - [acted_by, uuid, opt, fk iam.users]
    - [acted_at, ts, opt]
    - [comment, text, opt]
    - [info_requested_at, ts, opt, "set while a question to the requester is unanswered (CR-041, Q7)"]
    - [info_requested_by, uuid, opt, "the approver who asked (CR-041, Q7)"]
    - [claimed_at, ts, opt, "when a role-queue task was claimed (CR-041, Q4)"]
    - [escalation_level, int, req, "default 0; levels moved up by escalation (CR-041, Q9)"]
  checks: ["assignee_user_id is distinct from the instance requester (FR-XM-32), enforced by trigger"]
  indexes: [[assignee_user_id, status, "partial where status='pending'"], [instance_id]]
  # S1.10a (CR-041 items 2 and 4, Q4, Q7, Q9, Q14): engine columns; tasks change only through the engine.
  added_in: {S1.10a: [info_requested_at, info_requested_by, claimed_at, escalation_level]}
  # S1.10b (CR-043): the escalation scan finds open tasks past their time limit.
  indexes_added_in: {S1.10b: [[status, due_at]]}
  api_actions: [read]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {user: assignee_user_id}
  reqs: [KRN-WFL-07, KRN-WFL-08, KRN-WFL-09, HRM-ROL-04, FR-XM-32]


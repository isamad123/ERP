# HRMIS: devices, shifts, rosters, attendance, overtime, leave. Spec 06a sections 9 (ATT-01 to ATT-21) and 10.
# Geo-fences, location evidence and mobile capture are Release 1.1.

# Slice S1.09b (ruling Q9, CR-036): time and leave tables belong to feature key hrm.core.
- defaults:
  entitlement: hrm.core

- table: hrm.attendance_devices
  purpose: Biometric and kiosk devices by site (ATT-02)
  traits: [std, co, soft]
  status: [active, offline, retired]
  columns:
    - [location_id, uuid, req, fk org.locations]
    - [connector_id, uuid, req, fk itg.connectors]
    - [serial_no, text, req]
    - [model, text, opt]
    - [connection, json, req, "host, port, protocol only; no secrets"]
    - [credentials_ref, text, opt, "reference to the secrets store (device password, comm key)"]
    - [last_seen_at, ts, opt]
    - [last_sync_at, ts, opt]
    - [last_error, text, opt]
    - [sync_cursor_at, ts, opt, "S1.27b: the latest punch time read from the device; the next pull starts a day before it (the keys remove repeats)"]
    - [sync_requested_at, ts, opt, "S1.27b: when HR asked for a sync now; the device sync job takes it and clears it"]
  unique: [[company_id, serial_no]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.27b (CR-088 S1.27b detail): the device registry service checks the connection and keeps the secret out of the row; the generated writes are closed.
  added_in: {S1.27b: [sync_cursor_at, sync_requested_at]}
  api_actions: [read]
  reqs: [ATT-02, ATT-03]

- table: hrm.device_user_maps
  purpose: Device user number to employee (ATT-03); biometric templates never stored (ATT-20)
  traits: [std, co, eff]
  columns:
    - [device_id, uuid, opt, fk hrm.attendance_devices; null means all devices of the company]
    - [device_scope, uuid, req, "generated always as coalesce(device_id, nil uuid) stored"]
    - [device_user_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [consent_at, ts, opt, biometric consent (ATT-20)]
    - [removal_due_at, ts, opt, "S1.27b: when the mapping ended and the user is to be removed from the device (ATT-20)"]
    - [removal_done_at, ts, opt, "S1.27b: when HR confirmed the user was removed from the device"]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.27b (CR-088 S1.27b detail): mapping is written by the device mapping service (consent, ending on leaving, removal task); the generated writes are closed.
  added_in: {S1.27b: [removal_due_at, removal_done_at]}
  api_actions: [read]
  reqs: [ATT-03, ATT-20]
  eff_key: [company_id, device_scope, device_user_no]
  notes: Punches resolve the employee by mapping valid on the punch date.

# S1.27b (CR-088 S1.27b detail): punches of a device user number that maps to nobody (yet) wait here, so a late mapping brings them
# into the event store with their original times and nothing is lost (FR-HRM-ATT-03).
- table: hrm.unmapped_punches
  purpose: Device punches whose user number maps to no employment yet, kept until mapped or discarded (ATT-03)
  traits: [std, co]
  status: [open, resolved, discarded]
  added_in: S1.27b
  columns:
    - [device_id, uuid, req, fk hrm.attendance_devices]
    - [device_user_no, text, req]
    - [punched_at, ts, req, the device's time of the punch]
    - [direction, "enum(in,out,break_out,break_in,unknown)", req]
    - [idempotency_key, text, req, "the key the punch gets in the event store"]
    - [received_at, ts, req, server receipt time]
    - [employment_id, uuid, opt, "fk hrm.employments; set when the punch was brought into the event store"]
    - [resolved_at, ts, opt]
    - [resolved_by, uuid, opt, fk iam.users]
  unique: [[company_id, idempotency_key]]
  indexes: [[company_id, device_id, device_user_no, status]]
  scope: {company: company_id}
  api_actions: [read]
  reqs: [ATT-03]

- table: hrm.shifts
  traits: [std, co, soft, name]
  columns:
    - [shift_type, "enum(fixed,flexible,rotating,split,night,continuous)", req]
    - [start_time, time, opt]
    - [end_time, time, opt]
    - [core_start, time, opt]
    - [core_end, time, opt]
    - [crosses_midnight, bool, req]
    - [segments, json, req, split shifts and breaks]
    - [min_full_day_minutes, int, req]
    - [policy_id, uuid, opt, "fk hrm.policies (attendance policy: grace, thresholds, rounding)"]
    - [valid_from, date, opt, "first day this version applies; null means from the beginning (S1.28a)"]
    - [valid_to, date, opt, "last day this version applies; null means open-ended (S1.28a)"]
    - [previous_shift_id, uuid, opt, "fk hrm.shifts; the version this one replaced (S1.28a)"]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.28a (CR-085 S1.28a detail; slice S1.28 Build item 1, FR-HRM-ATT-06): a change from a date is a new row that replaces the one in
  # force (the old row is kept with its end date), so the code is unique among the versions still open-ended; generated writes closed,
  # the HR shift service checks the type's times.
  added_in: {S1.28a: [valid_from, valid_to, previous_shift_id]}
  uniques_replaced_in: {S1.28a: [[company_id, "lower(code)", "where valid_to is null"]]}
  checks_added_in:
    S1.28a:
      - "a version ends on or after the day it starts"
  api_actions: [read]
  reqs: [ATT-06, ATT-09, ATT-16]

- table: hrm.rosters
  traits: [std, co]
  status: [draft, published, archived]
  columns:
    - [name, text, req]
    - [org_unit_id, uuid, opt, fk org.org_units]
    - [period_start, date, req]
    - [period_end, date, req]
    - [published_at, ts, opt, "when the roster was published (S1.28a)"]
    - [published_by, uuid, opt, "the user who published it (S1.28a)"]
    - [copied_from_roster_id, uuid, opt, "fk hrm.rosters; the roster this one was copied forward from (S1.28a)"]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, org_unit: org_unit_id}
  # S1.28a (CR-085 S1.28a detail; slice S1.28 Build items 4 and 5, FR-HRM-ATT-07): generated writes closed; the HR roster service builds,
  # copies forward, checks and publishes.
  added_in: {S1.28a: [published_at, published_by, copied_from_roster_id]}
  checks_added_in:
    S1.28a:
      - "a roster ends on or after the day it starts"
  api_actions: [read]
  reqs: [ATT-07]

- table: hrm.roster_lines
  purpose: Shift or weekly off per employee per day
  traits: [std, co]
  columns:
    - [roster_id, uuid, req, fk hrm.rosters]
    - [employment_id, uuid, req, fk hrm.employments]
    - [work_date, date, req]
    - [shift_id, uuid, opt, fk hrm.shifts; null means weekly off]
    - [day_type, "enum(working,weekly_off,holiday)", req]
    - [roster_status, text, req, copy of rosters.status]
    - [reason, text, opt, "why a day is worked on a rest day, or why a published day was changed (S1.28a)"]
  unique: [[employment_id, work_date, "where roster_status = 'published'"]]
  indexes: [[employment_id, work_date]]
  # S1.30b (CR-090 S1.30b detail b): the live dashboard reads one company's published lines of a day.
  indexes_added_in: {S1.30b: [[work_date, company_id]]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.28a (CR-085 S1.28a detail; slice S1.28 Build items 4 and 5, FR-HRM-ATT-07): a person has one line per roster and day; a working
  # day names a shift, any other day none; a line of a published roster changes only with a reason (rules.yaml function
  # hrm.tg_roster_lines_published); generated writes closed.
  added_in: {S1.28a: [reason]}
  uniques_added_in: {S1.28a: [[roster_id, employment_id, work_date]]}
  checks_added_in:
    S1.28a:
      - "a working day has a shift and any other day has none"
  api_actions: [read]
  reqs: [ATT-07]

- table: hrm.optional_holiday_choices
  purpose: "The optional holidays an employee chose for a year (S1.28b, CR-085, FR-HRM-ATT-15)"
  traits: [std, co]
  added_in: S1.28b
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [holiday_id, uuid, req, fk ref.holidays]
    - [holiday_year, int, req, "the calendar year of the holiday's date; the yearly limit counts per employment and year"]
    - [chosen_at, ts, req, "when the choice was made (the injected clock)"]
  unique: [[employment_id, holiday_id]]
  indexes: [[employment_id, holiday_year]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed; the HR optional-holiday service writes
  # (it holds the yearly limit and the cut-off).
  scope: {company: company_id, employment: employment_id}
  api_actions: [read]
  reqs: [ATT-15]

- table: hrm.attendance_events
  purpose: "Raw punches from web check-in, biometric import, kiosk and HR entry (spec name 'punches')"
  traits: [app, co]
  partition: "range (event_date) monthly; key (id, event_date)"
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [event_date, date, req, local date at the location]
    - [event_at, ts, req]
    - [direction, "enum(in,out,break_out,break_in,unknown)", req]
    - [source, "enum(web,biometric,kiosk,hr_entry,import,qr,regularization)", req]
    - [device_id, uuid, opt, fk hrm.attendance_devices]
    - [received_at, ts, req, server receipt time (GHR-13)]
    - [idempotency_key, text, req]
    - [ip_address, inet, opt]
    - [is_duplicate, bool, req]
    - [supersedes_event_id, uuid, opt, correction of an earlier event]
  unique: [[company_id, idempotency_key, event_date]]
  indexes: [[employment_id, event_date]]
  # S1.30b (CR-090 S1.30b detail b): the dashboard's first punch of a day and the punch log report read by day.
  indexes_added_in: {S1.30b: [[company_id, event_date, employment_id]]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  # S1.27a (CR-088; slice S1.27 Build items 1 to 4): a punch scanned from a gate's QR code is source qr; generated writes closed, the
  # HR attendance services append events (idempotency, duplicate marking, future tolerance, time zone date).
  enum_added_in: {S1.27a: {source: [qr]}, S1.30a: {source: [regularization]}}
  api_actions: [read]
  reqs: [ATT-01, ATT-03, DAT-01, DAT-02, DAT-04]

- table: hrm.attendance_periods
  purpose: Lock unit for attendance per company and pay group (FR-XM-26)
  traits: [std, co]
  status: [open, locked]
  columns:
    - [pay_group_id, uuid, req, fk hrm.pay_groups]
    - [pay_period_id, uuid, req, fk hrm.pay_periods]
    - [period_start, date, req]
    - [period_end, date, req]
    - [locked_at, ts, opt]
    - [locked_by_run_id, uuid, opt, fk hrm.pay_runs]
    - [lock_kind, "enum(payroll,manual)", opt, "who locked: payroll's calculation (locked_by_run_id) or HR after the cut-off date with approval (S1.31)"]
    - [locked_by, uuid, opt, "the user who locked: the payroll run's calculator or the HR requester (S1.31)"]
    - [lock_reason, text, opt, "why HR asks to lock, or locked, before payroll (S1.31)"]
    - [lock_requested_by, uuid, opt, "who asked HR's lock, waiting or decided (S1.31)"]
    - [lock_accept_open, bool, opt, "HR's lock request accepts days not processed and open exceptions (S1.31)"]
    - [unprocessed_accepted, int, opt, "employee days not processed that the lock accepted (S1.31); null when every day was processed"]
    - [exceptions_accepted, int, opt, "open exceptions the lock accepted (S1.31); null when none was open"]
    - [lock_workflow_instance_id, uuid, opt, "fk wf.workflow_instances; HR's lock request, waiting or decided (S1.31)"]
    - [reopen_workflow_instance_id, uuid, opt, "fk wf.workflow_instances; the request to cancel the locking run and reopen (S1.31)"]
    - [reopen_requested_by, uuid, opt, "who asked to cancel the locking run and reopen (S1.31)"]
    - [reopened_at, ts, opt, "when the period last reopened (S1.31)"]
    - [reopen_reason, text, opt, "why it is asked to reopen, or last reopened (S1.31)"]
  unique: [[pay_period_id]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.31 (CR-091 S1.31 detail; slice S1.31 Build items 1 to 4, FR-XM-26, FR-HRM-ATT-17, ATT-21): the period is locked by payroll's calculation
  # (locked_by_run_id) or by HR after the cut-off date with approval (lock_kind manual), and reopens only when the run that locked it is cancelled
  # before it is locked itself (CR-095). The lock records who, why and what it accepted. Generated writes closed (rules.yaml stub
  # attendance_periods_lock implemented); the changes are made by the HR attendance lock service only. "hrm.retro_adjustments" in the note is the
  # pay adjustment of S1.39; the attendance side of a change after lock is hrm.attendance_adjustments (CR-091), which S1.39 turns into it.
  added_in: {S1.31: [lock_kind, locked_by, lock_reason, lock_requested_by, lock_accept_open, unprocessed_accepted, exceptions_accepted, lock_workflow_instance_id, reopen_workflow_instance_id, reopen_requested_by, reopened_at, reopen_reason]}
  api_actions: [read]
  reqs: [ATT-17, ATT-21, FR-XM-26]
  checks: ["exclusion: (pay_group_id with =, daterange(period_start, period_end, '[]') with &&)"]
  notes: "A locked period never reopens (FR-XM-26). Unlocking is allowed only if the locking run is cancelled before it is locked itself. Lock trigger covers attendance_days, leave_request_days, overtime_entries and approved regularization_requests dated in the period; changes after lock become hrm.retro_adjustments."

- table: hrm.attendance_days
  purpose: Processed daily result per employee with explanation
  traits: [std, co]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [work_date, date, req]
    - [shift_id, uuid, opt, fk hrm.shifts]
    - [day_type, "enum(working,weekly_off,holiday)", req]
    - [result, "enum(present,absent,late,half_day,on_leave,holiday,weekly_off,on_duty,incomplete)", req]
    - [first_in, ts, opt]
    - [last_out, ts, opt]
    - [worked_minutes, int, req]
    - [late_minutes, int, req]
    - [early_minutes, int, req]
    - [overtime_minutes, int, req]
    - [leave_request_id, uuid, opt, fk hrm.leave_requests]
    - [duty_request_id, uuid, opt, fk hrm.duty_requests]
    - [explanation, json, req, rule steps that produced the result (ATT-10)]
    - [policy_version_id, uuid, opt, fk hrm.policy_versions]
    - [period_id, uuid, req, fk hrm.attendance_periods; derived from pay group and date on insert]
    - [processed_at, ts, req]
    - [superseded_at, ts, opt, "when a newer result of the same day replaced this one; null for the current result (S1.29a)"]
  unique: [[employment_id, work_date]]
  indexes: [[company_id, work_date, result]]
  notes: Trigger refuses updates when the period is locked; later changes create hrm.retro_adjustments (FR-XM-26).
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [ATT-10, ATT-13, ATT-18, ATT-19, FR-XM-26]
  partition: "range (work_date) monthly; key (id, work_date)"
  # S1.29a (CR-089 S1.29a detail; slice S1.29 Build items 2 and 6, FR-HRM-ATT-10): the attendance engine writes each result; a reprocessed day is
  # a new row and the row it replaces gets superseded_at (history kept, never edited in place; rules.yaml function hrm.tg_attendance_days_versions),
  # so one current row per employment and day; generated writes closed.
  added_in: {S1.29a: [superseded_at]}
  uniques_replaced_in: {S1.29a: [[employment_id, work_date, "where superseded_at is null"]]}
  api_actions: [read]
  # S1.07 audit key (CR-026), set by S1.29a (CR-089 S1.29a detail f): each result is its own row, never changed or deleted; the row says who
  # processed it and when, and superseded_at when a newer one replaced it, so the change log skips the table like the other append-only ones.
  audit: false
  audit_reason: "row versions: each result is a new row that is never changed or deleted; superseded_at records when a newer one replaced it (S1.29a)"

- table: hrm.attendance_exceptions
  traits: [std, co]
  status: [open, regularized, accepted, rejected, closed]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [work_date, date, req]
    - [kind, "enum(missing_in,missing_out,late,early,absent,unscheduled,odd_count,outside_tolerance)", req]
    - [attendance_day_id, uuid, req, fk hrm.attendance_days]
  indexes: [[employment_id, work_date], [company_id, status]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [ATT-11]
  # S1.29a (CR-089 S1.29a detail; slice S1.29 Build item 4, FR-HRM-ATT-11): the engine raises an odd number of punches and a punch outside the
  # shift's window as exceptions too, and follows an open exception to the day's newest result; generated writes closed.
  enum_added_in: {S1.29a: {kind: [odd_count, outside_tolerance]}}
  api_actions: [read]

- table: hrm.regularization_requests
  traits: [std, co]
  status: [submitted, approved, rejected, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [exception_id, uuid, opt, fk hrm.attendance_exceptions]
    - [work_date, date, req]
    - [requested_in, ts, opt]
    - [requested_out, ts, opt]
    - [reason, text, req]
    - [file_ids, "uuid[]", req]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.30a (CR-090; slice S1.30 Build items 1 and 3, FR-HRM-ATT-11, GHR-09): requests are made, approved and cancelled by the HR attendance
  # request service (the acting user is created_by, the person it is for is the employment); generated writes closed.
  api_actions: [read]
  reqs: [ATT-11]

- table: hrm.duty_requests
  purpose: "On-duty, official visit and work-from-home requests (ATT-14)"
  traits: [std, co]
  status: [submitted, approved, rejected, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [kind, "enum(on_duty,official_visit,work_from_home,field_duty)", req]
    - [start_at, ts, req]
    - [end_at, ts, req]
    - [purpose, text, req]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [file_ids, "uuid[]", opt, "proof files of the request, kept when it is decided (S1.30b, R-161; the files are owned through IAttachmentOwner, type hrm.duty_requests)"]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.30a (CR-090; slice S1.30 Build items 2 and 3, FR-HRM-ATT-14, GHR-09): field duty is a fourth kind; requests are made, approved and
  # cancelled by the HR attendance request service (the acting user is created_by); generated writes closed.
  enum_added_in: {S1.30a: {kind: [field_duty]}}
  # S1.30b (CR-090 S1.30b detail a, R-161): proof files like the regularization request has; an index for the dashboard's "on duty today".
  added_in: {S1.30b: [file_ids]}
  indexes_added_in: {S1.30b: [[status, start_at, end_at]]}
  api_actions: [read]
  reqs: [ATT-14]

- table: hrm.overtime_entries
  traits: [std, co]
  status: [calculated, submitted, approved, rejected, paid, converted_to_comp_off]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [work_date, date, req]
    - [day_type, "enum(working,weekly_off,holiday)", req]
    - [minutes, int, req]
    - [approved_minutes, int, opt]
    - [rate_multiplier, rate, req, from overtime policy]
    - [pay_input_id, uuid, opt, fk hrm.pay_inputs; the only path into payroll]
    - [attendance_day_id, uuid, opt, fk hrm.attendance_days]
    - [comp_off_entry_id, uuid, opt, fk hrm.leave_ledger]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [requested_minutes, int, opt, "minutes asked for before the day (pre-approval, S1.29b); null for overtime claimed after it was worked"]
    - [reason, text, opt, "why the overtime is asked for or claimed (S1.29b)"]
    - [policy_version_id, uuid, opt, "fk hrm.policy_versions; the attendance policy version whose overtime rule gave the multiplier (S1.29b)"]
    - [comp_off_minutes, int, opt, "minutes converted to compensatory off: what the comp-off leave type can earn in its unit; the rest of the approved minutes is paid (S1.29b review)"]
  indexes: [[employment_id, work_date]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  reqs: [ATT-12, LVE-08]
  unique: [[employment_id, work_date, "where status <> 'rejected'"]]
  # S1.29a (CR-089 S1.29a detail): entries are made by the attendance engine and approved through the workflow (S1.29b); generated writes closed.
  # S1.29b (CR-089 S1.29b detail; slice S1.29 Build items 9 to 11, FR-HRM-ATT-12, LVE-08): minutes are the overtime the engine worked out from the
  # day's result (beyond the shift on a working day, all recorded work on a weekly off or holiday); approved_minutes is set on approval, within the
  # policy's daily and monthly caps of the day type; a pre-approval is asked before the day (requested_minutes) and pays the smaller of the minutes
  # worked and approved. Approved overtime the policy converts becomes converted_to_comp_off and earns comp-off through hrm.attendance.comp_off_earned
  # for the minutes the comp-off leave type can earn in its unit (comp_off_minutes); the rest is paid (review S1.29b finding 2).
  added_in: {S1.29b: [requested_minutes, reason, policy_version_id, comp_off_minutes]}
  api_actions: [read]

- table: hrm.attendance_penalties
  purpose: "A late-coming or early-leaving penalty of a day beyond the monthly allowance of the attendance policy, and its waiver (S1.29b, CR-089, FR-HRM-ATT-13)"
  traits: [std, co]
  status: [applied, waived, cancelled]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [work_date, date, req]
    - [kind, "enum(late,early)", req]
    - [minutes, int, req, "the late or early minutes of the day's result"]
    - [occurrence, int, req, "which late (or early) day of the calendar month this is; the policy allows a number of them before the action"]
    - [action, "enum(leave,pay_deduction,warning)", req, "what the policy does beyond the allowance: deduct leave, a pay deduction input for payroll, or a warning only"]
    - [leave_type_id, uuid, opt, fk hrm.leave_types]
    - [leave_quantity, qty, opt, "the leave units the policy deducts (action leave)"]
    - [leave_entry_id, uuid, opt, "fk hrm.leave_ledger; the usage entry posted (action leave)"]
    - [leave_reversal_id, uuid, opt, "fk hrm.leave_ledger; the usage reversal posted when the penalty was waived or cancelled"]
    - [attendance_day_id, uuid, req, fk hrm.attendance_days]
    - [period_id, uuid, req, "fk hrm.attendance_periods; the day's attendance period (FR-XM-26)"]
    - [policy_version_id, uuid, req, fk hrm.policy_versions]
    - [explanation, json, req, "why: keys and values translated at display (ATT-10 style)"]
    - [waiver_reason, text, opt, "the reason of the last waiver asked for (the workflow history keeps every request and decision)"]
    - [waived_at, ts, opt]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[employment_id, work_date, kind, "where status <> 'cancelled'"]]
  indexes: [[employment_id, work_date]]
  # S1.29b (CR-089 S1.29b detail; slice S1.29 Build items 7 and 8, FR-HRM-ATT-13, FR-XM-32): the attendance engine applies and cancels penalties as
  # day results change (never in a locked period, FR-XM-26); a waiver is asked through the workflow and approved by someone other than the
  # employee; a waived penalty stays as the record (status waived). Generated writes closed (rules.yaml function hrm.tg_attendance_penalties_rules).
  scope: {company: company_id, employment: employment_id}
  added_in: S1.29b
  api_actions: [read]
  reqs: [ATT-13]

- table: hrm.attendance_adjustments
  purpose: "A change to attendance or leave of a locked period, carried into the next open payroll period; the locked days stay as they were (S1.31, CR-091, FR-XM-26)"
  traits: [std, co]
  status: [submitted, approved, rejected, withdrawn, applied]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [period_id, uuid, req, "fk hrm.attendance_periods; the locked period of the dates"]
    - [from_date, date, req]
    - [to_date, date, req]
    - [kind, "enum(attendance,leave_cancellation,overtime)", req, "a day's result, approved leave cancelled, or overtime of a locked day"]
    - [leave_request_id, uuid, opt, "fk hrm.leave_requests; the approved leave cancelled (kind leave_cancellation)"]
    - [old_summary, json, req, "the locked result of each day (result, minutes, leave, overtime) as payroll read it"]
    - [new_summary, json, req, "the corrected result of each day"]
    - [reason, text, req]
    - [target_pay_period_id, uuid, req, "fk hrm.pay_periods; the next open payroll period of the employment's pay group, set again on approval"]
    - [leave_reversal_id, uuid, opt, "fk hrm.leave_ledger; the usage reversal dated in the target period (kind leave_cancellation)"]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
    - [applied_in_run_id, uuid, opt, "fk hrm.pay_runs; the run that paid or recovered it (S1.39)"]
    - [status_history, json, req, "every status the adjustment took with who and when; only added to"]
  indexes: [[employment_id, from_date], [company_id, status], [target_pay_period_id, status]]
  # S1.31 (CR-091 S1.31 detail; slice S1.31 Build item 5, FR-XM-26, FR-XM-05, FR-XM-06, FR-XM-32): asked for by HR or the employee's manager in scope,
  # approved through the workflow (document type hrm.attendance_adjustment, never by the requester or the employee); its facts never change and its
  # status only moves forward, each move added to status_history (rules.yaml function hrm.tg_attendance_adjustments_rules). Read by payroll through
  # IAttendanceAdjustments. Generated writes closed.
  scope: {company: company_id, employment: employment_id}
  added_in: S1.31
  api_actions: [read]
  # S1.07 audit key (CR-026), set by S1.31 (CR-091 S1.31 detail): the facts never change and the row is never removed; each status move is added to
  # status_history with who and when, so the change log skips the table like the other append-only ones.
  audit: false
  audit_reason: "append-only status history: the facts never change, each status move is added to status_history with who and when, and the row is never removed (S1.31)"
  reqs: [ATT-17, FR-XM-26]

- table: hrm.leave_types
  traits: [std, co, soft, name]
  columns:
    - [is_paid, bool, req]
    - [counting, "enum(calendar_days,working_days,hours)", req]
    - [unit, "enum(day,half_day,hour)", req]
    - [requires_document, bool, req]
    - [is_comp_off, bool, req]
    - [is_unpaid_deduction, bool, req, flows to payroll as leave without pay (LVE-07)]
    - [source, "enum(pack,tenant)", req]
  unique: [[company_id, lower(code)]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.32a (CR-086 S1.32a detail; slice S1.32 Build item 1): generated writes closed; the HR leave type service writes (code, counting and unit fixed once
  # the type has ledger entries; retire, never delete; rules.yaml function hrm.tg_leave_types_rules).
  api_actions: [read]
  reqs: [LVE-01, LVE-12]
  notes: "Entitlement, accrual, carry-forward, encashment, eligibility and sandwich rules are a leave policy (hrm.policies type leave) assigned per leave type."

- table: hrm.leave_ledger
  purpose: "Every movement of a leave balance; balances are sums (LVE-10, LVE-14)"
  traits: [app, co]
  columns:
    - [employment_id, uuid, req, fk hrm.employments]
    - [leave_type_id, uuid, req, fk hrm.leave_types]
    - [leave_year, int, req]
    - [entry_date, date, req]
    - [kind, "enum(opening,accrual,grant,usage,usage_reversal,adjustment,carry_forward,lapse,encashment,comp_off_earned,comp_off_expired,transfer_in,transfer_out)", req]
    - [quantity, qty, req, "positive adds, negative uses"]
    - [expires_on, date, opt, carry-forward and comp-off expiry]
    - [source_type, text, opt]
    - [source_id, uuid, opt]
    - [policy_version_id, uuid, opt, fk hrm.policy_versions]
    - [reverses_entry_id, uuid, opt, fk hrm.leave_ledger]
    - [reason, text, opt]
  indexes: [[employment_id, leave_type_id, leave_year]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.07 audit key (CR-026): the change log skips this table, for the reason given.
  audit: false
  audit_reason: "append-only: the row itself is the record and is never changed (S1.07 Q4)"
  # S1.32a (CR-086 S1.32a detail; Build item 4): generated writes closed; entries are posted by the HR leave services and the accrual job only (opening,
  # grant, adjustment and reversal by HR; grant and accrual by the job, once per employment, type and period); a reversal negates its entry
  # (rules.yaml function hrm.tg_leave_ledger_reversal). Update, delete and truncate were already refused (tg_leave_ledger_append_only).
  api_actions: [read]
  reqs: [LVE-02, LVE-03, LVE-08, LVE-10, LVE-14]
  unique: [[source_type, source_id, kind, leave_type_id, where source_id is not null], [reverses_entry_id, where reverses_entry_id is not null]]
  notes: Intra-group transfer posts transfer_out on the old employment and transfer_in on the new one with the same source_id (FR-XM-30).

- table: hrm.leave_requests
  traits: [std, co, br, cust]
  status: [draft, submitted, approved, rejected, cancel_requested, cancelled]
  columns:
    - [request_no, text, req]
    - [employment_id, uuid, req, fk hrm.employments]
    - [leave_type_id, uuid, req, fk hrm.leave_types]
    - [start_date, date, req]
    - [end_date, date, req]
    - [start_part, "enum(full,first_half,second_half)", req]
    - [end_part, "enum(full,first_half,second_half)", req]
    - [hours, qty, opt]
    - [days, qty, req, "computed by policy, check > 0"]
    - [reason, text, opt]
    - [file_ids, "uuid[]", req]
    - [modifies_request_id, uuid, opt, fk hrm.leave_requests]
    - [workflow_instance_id, uuid, opt, fk wf.workflow_instances]
  unique: [[company_id, request_no]]
  indexes: [[employment_id, start_date], [company_id, status]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, branch: branch_id, employment: employment_id}
  # S1.08 numbering key (CR-033, Q1, Q7): the number comes from the kernel numbering service.
  numbering: {column: request_no, type: hrm.leave_request_no, assign: post, gap_free: yes, default: "LV-{yyyy}-{seq:6}", reset: yearly, date: start_date}
  # S1.32b (CR-086 S1.32b detail; slice S1.32 Build items 7 and 9): generated writes closed; the HR leave request service writes (the number from
  # the kernel numbering service when the request is saved, gap-free in its transaction; the approval through the workflow engine; cancellation and
  # change by reversal).
  api_actions: [read]
  reqs: [LVE-04, LVE-05, LVE-06, LVE-15, LVE-16]

- table: hrm.leave_request_days
  purpose: Day-by-day breakdown used by attendance and payroll
  traits: [std, co]
  columns:
    - [leave_request_id, uuid, req, fk hrm.leave_requests]
    - [employment_id, uuid, req, fk hrm.employments]
    - [leave_date, date, req]
    - [quantity, qty, req]
    - [is_paid, bool, req]
    - [request_status, text, req, copy of leave_requests.status]
    - [day_kind, "enum(leave,sandwich)", req, "default leave; sandwich: a holiday or weekly off between two leave days of the request counted as leave (S1.32b, Build item 8)"]
  unique: [[leave_request_id, leave_date]]
  indexes: [[employment_id, leave_date]]
  # S1.30b (CR-090 S1.30b detail b): the dashboard's "on leave today" reads one day of a company.
  indexes_added_in: {S1.30b: [[leave_date, company_id, request_status]]}
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id, employment: employment_id}
  # S1.32b (CR-086 S1.32b detail; slice S1.32 Build items 7 and 8): the days are written with their request by the HR leave request service only
  # (generated writes closed); day_kind shows a sandwich day in the day list.
  added_in: {S1.32b: [day_kind]}
  api_actions: [read]
  reqs: [LVE-04, LVE-07]
  checks: ["trigger: sum(quantity) per (employment_id, leave_date) over non-cancelled requests <= 1 day (or shift hours for hourly leave)"]

- table: hrm.leave_year_end_runs
  purpose: "Carry-forward, lapse and encashment with preview and rollback (LVE-11)"
  traits: [std, co]
  status: [preview, applied, rolled_back]
  columns:
    - [leave_year, int, req]
    - [job_run_id, uuid, opt, fk job.runs]
    - [summary, json, req]
  unique: [[company_id, leave_year, "where status='applied'"]]
  # S1.06 access keys: scope locators and field classes (CR-018), generated writes closed (CR-020, CR-021).
  scope: {company: company_id}
  # S1.32b (CR-086 S1.32b detail; slice S1.32 Build item 12): the job hrm.leave_year_end writes the preview; HR confirms or rolls it back through the
  # leave year-end service (generated writes closed).
  api_actions: [read]
  reqs: [LVE-11]

name: ci

# Minutes are limited (GitHub free plan), so: no run per branch push (the pull request run covers it), nothing for
# documents no test reads, and the tenant-isolation job only on pull requests. Run it by hand with "Run workflow".
# R-040: `build-and-test` and `tenant-isolation` are required checks of main, so every pull request must report them.
# A pull request therefore always starts this workflow; the `changes` job skips both jobs when every changed file is a
# document no test reads (the list in DOC_ONLY below, the same as the push filter). GitHub counts a skipped job as passed.
# If `changes` itself fails or is unsure, both jobs run (fail closed).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/specs/**"
      - "docs/decisions/**"
      - "docs/slices/**"
      - "docs/handoff/**"
      - "docs/adr/**"
      - "docs/runbooks/**"
      - "docs/setup/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  # Integration tests use the PostgreSQL 16 service container below (real database, never mocked).
  ERP_TEST_PG: "Host=localhost;Port=5432;Username=erp;Password=erp-ci-only;Database=erp_test"

jobs:
  # R-040: decides whether the two checks below run. Only a pull request that changes nothing but the documents listed in
  # DOC_ONLY (the push filter above) skips them; anything else, an empty or unreadable diff included, runs both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does the pull request change anything but documents no test reads?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "not a pull request: run everything"; exit 0; fi
          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "$changed"
          code=false
          if [ -z "$changed" ]; then code=true; fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/specs/*|docs/decisions/*|docs/slices/*|docs/handoff/*|docs/adr/*|docs/runbooks/*|docs/setup/*) ;; # DOC_ONLY
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "run the checks: $code"

  build-and-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=256mb

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # S1.11f1 (R-030, CLAUDE.md done criteria): secret scan of the history reachable from the checked-out commit (not other
      # branches: one session's branch must not fail another's pull request) and of the working tree. gitleaks (MIT) is
      # pinned to one release and verified against its sha256 before it runs. Any finding fails the build; the only
      # allowances are exact public test values in .gitleaks.toml. The self-test proves the scan fails on a planted secret.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          GL="$RUNNER_TEMP/gitleaks/gitleaks"
          mkdir -p "$RUNNER_TEMP/planted"
          printf 'github_token = "%s%s"\n' ghp_ 1a2B3c4D5e6F7g8H9i0J1k2L3m4N5o6P7q8R > "$RUNNER_TEMP/planted/planted.txt"
          if "$GL" dir --no-banner --redact -c .gitleaks.toml "$RUNNER_TEMP/planted" >/dev/null 2>&1; then echo "Self-test failed: the scan did not flag a planted secret."; exit 1; fi
          "$GL" detect --no-banner --redact -c .gitleaks.toml --source . --log-opts="HEAD"
          "$GL" dir --no-banner --redact -c .gitleaks.toml .

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare log folder
        run: mkdir -p logs

      - name: Restore
        run: dotnet restore Erp.sln -v q "-flp:logfile=logs/restore.log;verbosity=normal"

      - name: Build
        run: dotnet build Erp.sln --no-restore -c Release -v q "-flp:logfile=logs/build.log;verbosity=normal"

      - name: Generator drift (generated code must match the data design)
        run: |
          dotnet run --project tools/Erp.CodeGen --no-build -c Release -- generate
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "Generated files differ from the committed ones: run the generator and commit."; git diff --stat; exit 1; }

      - name: TypeScript type-check of the generated client
        run: npx --yes -p typescript@6.0.2 tsc -p web/generated/tsconfig.json

      - name: Unit tests
        run: dotnet test --project tests/Erp.UnitTests --no-build -c Release --report-xunit-trx --results-directory logs/test-results

      - name: Architecture tests
        run: dotnet test --project tests/Erp.ArchitectureTests --no-build -c Release --report-xunit-trx --results-directory logs/test-results

      - name: PostgreSQL connection limit (the numbering tests run 100 concurrent transactions, S1.08)
        # The service starts with the image default of 100 connections; the invariant-6 test needs 100 at once plus the
        # other test classes running in parallel. Raised to 300 and the service restarted.
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U erp -d erp_test -qc "alter system set max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do docker exec ${{ job.services.postgres.id }} pg_isready -U erp -d erp_test && break; sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U erp -d erp_test -tc "show max_connections"

      - name: PostgreSQL 16 client tools (pg_dump and pg_restore for the backup and restore test, S1.03)
        # The client tools must match the server's major version (16). The runner's own tools may be newer and its
        # distribution may not package version 16, so the tools run from the same postgres:16 image as the service.
        run: |
          if pg_dump --version | grep -Eq ' 16\.'; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/pg16"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e PGPASSWORD postgres:16 %s "$@"\n' "$tool" > "$RUNNER_TEMP/pg16/$tool"
            chmod +x "$RUNNER_TEMP/pg16/$tool"
          done
          echo "ERP_PG_BIN=$RUNNER_TEMP/pg16" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pg16/pg_dump" --version
          "$RUNNER_TEMP/pg16/pg_restore" --version

      - name: Integration tests (PostgreSQL 16; the tenant-isolation suite runs in its own job below)
        run: dotnet test --project tests/Erp.IntegrationTests --no-build -c Release --filter-not-trait "Suite=TenantIsolation" --report-xunit-trx --results-directory logs/test-results

      - name: Data dictionary drift (live database must match the committed dictionary)
        run: |
          dotnet run --project tools/Erp.CodeGen --no-build -c Release -- dictionary --connection "$ERP_TEST_PG"
          test -z "$(git status --porcelain)" || { echo "docs/data-design/generated/data-dictionary.md is out of date."; git diff --stat; exit 1; }

      - name: Licence gate (D-09)
        run: |
          python3 build/licence-gate.py --self-test
          python3 build/licence-gate.py | tee logs/licence-report.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

  # S1.04: the tenant-isolation suite (FR-KRN-TEN-03, FR-KRN-TEN-04, spec 03 section 10 invariant 10). Every API endpoint
  # is called as one customer with another customer's ids, hosts and tokens; any success fails this job. It is its own
  # job so it shows by name on every pull request and can be made a required check in the branch protection of main.
  tenant-isolation:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp-ci-only
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=256mb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Prepare log folder
        run: mkdir -p logs

      - name: Restore
        run: dotnet restore Erp.sln -v q "-flp:logfile=logs/restore.log;verbosity=normal"

      - name: Build
        run: dotnet build tests/Erp.IntegrationTests --no-restore -c Release -v q "-flp:logfile=logs/build.log;verbosity=normal"

      - name: Tenant-isolation suite (every endpoint, crossed customers)
        run: dotnet test --project tests/Erp.IntegrationTests --no-build -c Release --filter-trait "Suite=TenantIsolation" --report-xunit-trx --results-directory logs/test-results

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14
